name: Compare APK2 save manager vtables

on:
  push:
    paths:
      - '.github/workflows/compare-apk2-save-manager-vtables.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare vtables and dump overridden methods
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-manager-vtables
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect,json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-save-manager-vtables')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']: return s['raw']+(r-s['rva'])
              return None
          def secva(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']: return s['name']
              return None
          def cstr(va,lim=180):
              off=va2off(va)
              if off is None:return None
              raw=b[off:off+lim].split(b'\0',1)[0]
              if len(raw)>1 and all(32<=x<127 for x in raw):
                  try:return raw.decode()
                  except:return None
          def wstr(va,lim=100):
              off=va2off(va)
              if off is None:return None
              z=[]
              for i in range(lim):
                  if off+2*i+1>=len(b):break
                  a,c=b[off+2*i],b[off+2*i+1]
                  if a==0 and c==0:break
                  if c or not 32<=a<127:return None
                  z.append(chr(a))
              return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
              if st<en: funcs.append((st,en))
          funcs=sorted(set(funcs)); starts=[a for a,_ in funcs]
          def cf(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None

          base_vt=0x149dd8d58
          derived_vt=0x14a1deb08
          n=256
          rows=[]
          for idx in range(n):
              bo=va2off(base_vt+idx*8); do=va2off(derived_vt+idx*8)
              if bo is None or do is None: break
              bv=struct.unpack_from('<Q',b,bo)[0]; dv=struct.unpack_from('<Q',b,do)[0]
              # stop after long non-code tail, but keep enough UObject virtuals
              rows.append((idx,bv,dv,bv!=dv,secva(bv),secva(dv),cf(bv),cf(dv)))
          diffs=[r for r in rows if r[3]]
          with (out/'vtable_compare.txt').open('w') as f:
              f.write(f'BASE=0x{base_vt:x} DERIVED=0x{derived_vt:x} ENTRIES={len(rows)} DIFFS={len(diffs)}\n')
              for idx,bv,dv,diff,bs,ds,bf,df in rows:
                  mark='DIFF' if diff else 'SAME'
                  f.write(f'[{idx:03d}] +0x{idx*8:03x} {mark} base=0x{bv:x}({bs}) derived=0x{dv:x}({ds}) base_func={bf} derived_func={df}\n')

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          unique=[]
          for r in diffs:
              dv=r[2]; fr=cf(dv)
              if fr and fr not in unique and 0 < fr[1]-fr[0] <= 0x10000: unique.append(fr)
          with (out/'overridden_methods.txt').open('w',encoding='utf-8') as f:
              for st,en in unique:
                  off=va2off(st)
                  if off is None:continue
                  inds=[idx for idx,bv,dv,*_ in diffs if cf(dv)==(st,en)]
                  f.write(f'\n===== METHOD 0x{st:x}-0x{en:x} SIZE=0x{en-st:x} VTABLE_INDICES={inds} =====\n')
                  insns=list(md.disasm(b[off:off+(en-st)],st)); calls=[]
                  for ins in insns:
                      ann=[]
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          dst=ins.operands[0].imm; calls.append(dst); ann.append(f'CALL->0x{dst:x} pdata={cf(dst)}')
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              dst=ins.address+ins.size+op.mem.disp; a=cstr(dst); w=wstr(dst); ss=secva(dst)
                              z=f'RIP->0x{dst:x}({ss})'
                              if a:z+=f' ASCII={a!r}'
                              if w:z+=f' WIDE={w!r}'
                              ann.append(z)
                          if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38,0x40,0x48,0x4c,0x50):
                              ann.append(f'OBJDISP=0x{op.mem.disp:x}')
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:9s} {ins.op_str}' + ((' ; '+' | '.join(ann)) if ann else '')+'\n')
                  f.write('CALLS='+','.join(hex(x) for x in sorted(set(calls)))+'\n')
          (out/'override_targets.txt').write_text(''.join(f'0x{st:x}\n' for st,en in unique))
          print('entries',len(rows),'diffs',len(diffs),'unique overridden funcs',len(unique))
          PY
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-manager-vtables
          git commit -m 'Compare APK2 save manager vtables' || exit 0
          git pull --rebase origin main
          git push origin main
