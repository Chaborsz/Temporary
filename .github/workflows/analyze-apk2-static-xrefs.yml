name: APK2 static save xrefs

on:
  push:
    paths:
      - '.github/workflows/analyze-apk2-static-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch verified APK2 and Rizin
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          curl -L --fail --retry 5 'https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz' -o rizin.tar.xz
          mkdir rizin && tar -xJf rizin.tar.xz -C rizin
          echo "RIZIN=$(find rizin -type f -name rizin -perm -111 | head -n1)" >> "$GITHUB_ENV"
          mkdir -p report

      - name: Find direct and indirect references without global analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pefile capstone
          python3 - <<'PY' | tee report/static_xrefs.txt
          from pathlib import Path
          import pefile,struct
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          fn='APK2-Win64-Shipping.exe'; data=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=True); base=pe.OPTIONAL_HEADER.ImageBase
          names={
           0x14a4570f8:'DefaultData',0x14a1d45d0:'UAPKSaveGameManager',0x14a1cf718:'UAPKSaveGameLibrary',0x14a1cf7a6:'sUAPKSaveGame',
           0x14a45c290:'SaveGameManager Busy',0x149b30ee8:'SaveGamePipe',0x149bcd740:'SaveGameSystemModule',0x14a4576a0:'SEGA save path',
           0x149b18590:'SaveGames path',0x149b30ff0:'SaveGameSystem.cpp:18',0x149b30f30:'SaveGameSystem.cpp:45',0x149b31170:'SaveGameSystem.cpp:72',
           0x149b310b0:'SaveGameSystem.cpp:100',0x149b31350:'SaveGameSystem.cpp:124',0x149ff7e60:'APK_SetVersion',0x149ff7eb8:'APK_SetBroken',0x149ff7f10:'APK_ForceLoad'
          }
          secs=[]
          for s in pe.sections:
            secs.append((s.PointerToRawData,s.SizeOfRawData,s.VirtualAddress,s.Characteristics,s.Name.rstrip(b'\0').decode(errors='replace')))
          def off2va(off):
            for raw,sz,rva,ch,n in secs:
              if raw<=off<raw+sz:return base+rva+(off-raw),n
            return None,None
          def va2off(va):
            r=va-base
            for raw,sz,rva,ch,n in secs:
              if rva<=r<rva+sz:return raw+(r-rva)
            return None

          # absolute pointer slots, recursively two levels
          targets=dict(names)
          for level in range(2):
            new={}
            for va,nm in list(targets.items()):
              needle=struct.pack('<Q',va); p=0
              while True:
                i=data.find(needle,p)
                if i<0:break
                sva,sec=off2va(i)
                if sva and sva not in targets and sva not in new:
                  new[sva]=f'ptr{level+1}->{nm}'
                  print(f'POINTER level={level+1} slot=0x{sva:x} -> 0x{va:x} {nm} section={sec}')
                p=i+1
            targets.update(new)
            print('POINTER_LEVEL',level+1,'NEW',len(new),'TOTAL_TARGETS',len(targets))

          # scan RIP-relative ModRM forms in executable sections
          hits=[]
          ops=set([0x8d,0x8b,0x89,0x39,0x3b,0x31,0x33,0x21,0x23,0x09,0x0b,0x85,0x83,0x81,0xff])
          for raw,sz,rva,ch,sn in secs:
            if not (ch & 0x20000000): continue
            buf=memoryview(data)[raw:raw+sz]; secva=base+rva; L=len(buf)
            for i in range(max(0,L-8)):
              # REX + opcode + modrm + disp32
              if 0x40<=buf[i]<=0x4f and buf[i+1] in ops and (buf[i+2]&0xc7)==0x05:
                disp=struct.unpack_from('<i',buf,i+3)[0]; src=secva+i; dst=src+7+disp
                if dst in targets:hits.append((src,dst,targets[dst],sn,7))
              # opcode + modrm + disp32
              if buf[i] in ops and (buf[i+1]&0xc7)==0x05:
                disp=struct.unpack_from('<i',buf,i+2)[0]; src=secva+i; dst=src+6+disp
                if dst in targets:hits.append((src,dst,targets[dst],sn,6))
          hits=sorted(set(hits))
          md=Cs(CS_ARCH_X86,CS_MODE_64)
          print('HITS',len(hits))
          caller=[]
          for src,dst,nm,sn,ln in hits:
            print(f'XREF src=0x{src:x} dst=0x{dst:x} target={nm} sec={sn}')
            off=va2off(src)
            if off is not None:
              lo=max(0,off-32); code=data[lo:min(len(data),off+64)]; cva=src-(off-lo)
              for ins in md.disasm(code,cva):
                if src-20<=ins.address<=src+28: print(f'  0x{ins.address:x}: {ins.mnemonic} {ins.op_str}')
            caller.append(src)
          Path('report/callers.txt').write_text(''.join(f'0x{x:x}\n' for x in sorted(set(caller))))
          PY

      - name: Rizin disassemble found sites
        shell: bash
        run: |
          set -euo pipefail
          CMD=''; N=0
          while read -r VA; do
            [ -z "$VA" ] && continue
            START=$(python3 -c "print(hex(int('$VA',16)-0x100))")
            CMD="$CMD;pd 160 @ $START"
            N=$((N+1)); [ "$N" -ge 100 ] && break
          done < report/callers.txt
          echo "caller_count=$N"
          if [ "$N" -gt 0 ]; then "$RIZIN" -q -e bin.strings=false -c "${CMD#;};q" APK2-Win64-Shipping.exe > report/rizin_sites.txt 2>&1 || true; fi
          sed -n '1,3000p' report/rizin_sites.txt 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-static-save-xrefs
          path: report/
          retention-days: 7
