name: Build APK2 Save Runtime Probe v5

on:
  push:
    paths:
      - '.github/workflows/build-apk2-save-runtime-probe-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover base probe and inject runtime AES key scanner
        shell: pwsh
        run: |
          $raw = Get-Content '.github/workflows/build-apk2-save-runtime-probe.yml' -Raw
          $m1 = [regex]::Match($raw, "(?s)@'\r?\n(?<src>.*?)\r?\n\s*'@ \| Set-Content -Encoding UTF8 probe\.cpp")
          if (-not $m1.Success) { throw 'Could not recover probe.cpp' }
          $src = ($m1.Groups['src'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"

          $oldDump = @'
          static void DumpBytes(const wchar_t* name, const void* p, size_t n) {
            FILE* f=nullptr; _wfopen_s(&f,OutPath(name).c_str(),L"wb"); if(!f)return;
            __try { std::fwrite(p,1,n,f); } __except(EXCEPTION_EXECUTE_HANDLER) {}
            std::fclose(f);
          }
          '@
          $newDump = @'
          static void DumpBytes(const wchar_t* name, const void* p, size_t n) {
            std::wstring path=OutPath(name);
            FILE* f=nullptr; _wfopen_s(&f,path.c_str(),L"wb"); if(!f)return;
            const size_t CH=0x10000; unsigned char tmp[CH]; size_t off=0;
            while(off<n){SIZE_T got=0;size_t want=(n-off)<CH?(n-off):CH;
              if(!ReadProcessMemory(GetCurrentProcess(),(const unsigned char*)p+off,tmp,want,&got)||got==0)break;
              std::fwrite(tmp,1,got,f);off+=got;if(got<want)break;}
            std::fclose(f);
          }
          '@
          if (-not $src.Contains($oldDump.Trim())) { throw 'DumpBytes block not found' }
          $src = $src.Replace($oldDump.Trim(), $newDump.Trim())

          $aes = @'
          static const unsigned char kKnownPlain[16] = {0x0d,0x00,0x00,0x00,0x42,0x6f,0x6f,0x6c,0x50,0x72,0x6f,0x70,0x65,0x72,0x74,0x79};
          static const unsigned char kKnownCipher[16] = {0xb3,0x31,0x9b,0x16,0x1c,0x89,0x0f,0xd7,0x67,0xe9,0x33,0xd0,0x80,0x74,0x3a,0xc6};
          static volatile LONG g_key_scan_started = 0;

          static unsigned char AesXtime(unsigned char x){return (unsigned char)((x<<1)^(((x>>7)&1)*0x1b));}
          static void AesAddRound(unsigned char s[16],const unsigned char* rk){for(int i=0;i<16;i++)s[i]^=rk[i];}
          static void AesSub(unsigned char s[16]){for(int i=0;i<16;i++)s[i]=kAesSbox[s[i]];}
          static void AesShift(unsigned char s[16]){
            unsigned char t;
            t=s[1];s[1]=s[5];s[5]=s[9];s[9]=s[13];s[13]=t;
            t=s[2];s[2]=s[10];s[10]=t;t=s[6];s[6]=s[14];s[14]=t;
            t=s[3];s[3]=s[15];s[15]=s[11];s[11]=s[7];s[7]=t;
          }
          static void AesMix(unsigned char s[16]){
            for(int c=0;c<4;c++){unsigned char* a=s+4*c;unsigned char t=(unsigned char)(a[0]^a[1]^a[2]^a[3]);unsigned char u=a[0];
              a[0]^=(unsigned char)(t^AesXtime((unsigned char)(a[0]^a[1])));
              a[1]^=(unsigned char)(t^AesXtime((unsigned char)(a[1]^a[2])));
              a[2]^=(unsigned char)(t^AesXtime((unsigned char)(a[2]^a[3])));
              a[3]^=(unsigned char)(t^AesXtime((unsigned char)(a[3]^u)));
            }
          }
          static int AesExpand(const unsigned char* key,int bits,unsigned char* rk){
            int Nk=bits/32,Nr=Nk+6,total=4*(Nr+1),i=0;static const unsigned char rcon[15]={0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36,0x6c,0xd8,0xab,0x4d,0x9a};
            for(i=0;i<Nk*4;i++)rk[i]=key[i];
            unsigned char tmp[4];int w=Nk;
            while(w<total){for(int j=0;j<4;j++)tmp[j]=rk[(w-1)*4+j];
              if((w%Nk)==0){unsigned char q=tmp[0];tmp[0]=kAesSbox[tmp[1]];tmp[1]=kAesSbox[tmp[2]];tmp[2]=kAesSbox[tmp[3]];tmp[3]=kAesSbox[q];tmp[0]^=rcon[w/Nk-1];}
              else if(Nk>6 && (w%Nk)==4){for(int j=0;j<4;j++)tmp[j]=kAesSbox[tmp[j]];}
              for(int j=0;j<4;j++)rk[w*4+j]=(unsigned char)(rk[(w-Nk)*4+j]^tmp[j]);w++;
            }return Nr;
          }
          static void AesEncryptBlock(const unsigned char in[16],const unsigned char* key,int bits,unsigned char out[16]){
            unsigned char rk[240],s[16];int Nr=AesExpand(key,bits,rk);memcpy(s,in,16);AesAddRound(s,rk);
            for(int r=1;r<Nr;r++){AesSub(s);AesShift(s);AesMix(s);AesAddRound(s,rk+16*r);}AesSub(s);AesShift(s);AesAddRound(s,rk+16*Nr);memcpy(out,s,16);
          }
          static bool TestAesKey(const unsigned char* key,int bits){unsigned char out[16];AesEncryptBlock(kKnownPlain,key,bits,out);return memcmp(out,kKnownCipher,16)==0;}
          static bool AesSelfTest(){
            static const unsigned char p[16]={0x00,0x11,0x22,0x33,0x44,0x55,0x66,0x77,0x88,0x99,0xaa,0xbb,0xcc,0xdd,0xee,0xff};
            static const unsigned char k128[16]={0x00,0x01,0x02,0x03,0x04,0x05,0x06,0x07,0x08,0x09,0x0a,0x0b,0x0c,0x0d,0x0e,0x0f};
            static const unsigned char c128[16]={0x69,0xc4,0xe0,0xd8,0x6a,0x7b,0x04,0x30,0xd8,0xcd,0xb7,0x80,0x70,0xb4,0xc5,0x5a};
            unsigned char o[16];AesEncryptBlock(p,k128,128,o);return memcmp(o,c128,16)==0;
          }
          static void WriteKeyHit(const void* addr,const unsigned char* key,int bits){
            FILE* f=nullptr;_wfopen_s(&f,OutPath(L"APK2_AES_runtime_key.txt").c_str(),L"ab");if(!f)return;
            fprintf(f,"AES%d address=%p key=",bits,addr);for(int i=0;i<bits/8;i++)fprintf(f,"%02x",key[i]);fprintf(f,"\n");fclose(f);
          }
          static DWORD WINAPI RuntimeKeyScanThread(void*){
            if(InterlockedCompareExchange(&g_key_scan_started,1,0)!=0)return 0;
            bool self=AesSelfTest();Log("AES runtime key scan start selftest=%d known_pair=0d000000426f6f6c50726f7065727479->b3319b161c890fd767e933d080743ac6",self?1:0);if(!self)return 0;
            SYSTEM_INFO si{};GetSystemInfo(&si);uintptr_t cur=(uintptr_t)si.lpMinimumApplicationAddress,max=(uintptr_t)si.lpMaximumApplicationAddress;unsigned long long tested=0;unsigned hits=0;
            const SIZE_T CH=4*1024*1024;std::vector<unsigned char> buf(CH+64);
            while(cur<max && hits<16){MEMORY_BASIC_INFORMATION mbi{};if(!VirtualQuery((void*)cur,&mbi,sizeof(mbi)))break;uintptr_t base=(uintptr_t)mbi.BaseAddress;SIZE_T rsz=mbi.RegionSize;
              DWORD p=mbi.Protect&0xff;bool writable=(p==PAGE_READWRITE||p==PAGE_WRITECOPY||p==PAGE_EXECUTE_READWRITE||p==PAGE_EXECUTE_WRITECOPY);
              if(mbi.State==MEM_COMMIT && !(mbi.Protect&PAGE_GUARD) && writable && rsz>=32){
                for(SIZE_T ro=0;ro<rsz;){SIZE_T want=(rsz-ro)>CH?CH:(rsz-ro),got=0;if(!ReadProcessMemory(GetCurrentProcess(),(void*)(base+ro),buf.data(),want,&got)||got<32){ro+=want?want:0x1000;continue;}
                  uintptr_t abs0=base+ro;SIZE_T start=(SIZE_T)((16-(abs0&15))&15);
                  for(SIZE_T i=start;i+32<=got;i+=16){const unsigned char* k=buf.data()+i;tested+=3;
                    if(TestAesKey(k,128)){Log("AES128 RUNTIME KEY HIT addr=%p",(void*)(abs0+i));WriteKeyHit((void*)(abs0+i),k,128);hits++;}
                    if(TestAesKey(k,192)){Log("AES192 RUNTIME KEY HIT addr=%p",(void*)(abs0+i));WriteKeyHit((void*)(abs0+i),k,192);hits++;}
                    if(TestAesKey(k,256)){Log("AES256 RUNTIME KEY HIT addr=%p",(void*)(abs0+i));WriteKeyHit((void*)(abs0+i),k,256);hits++;}
                    if(hits>=16)break;
                  }ro+=got;if(got<want)break;
                }
              }
              uintptr_t next=base+rsz;if(next<=cur)break;cur=next;
            }
            Log("AES runtime key scan end tested=%llu hits=%u",tested,hits);return 0;
          }
          '@
          $anchor = 'struct MonitorCtx { unsigned char* buf; DWORD len; HANDLE ready; LONG id; };'
          if (-not $src.Contains($anchor)) { throw 'MonitorCtx anchor not found' }
          $src = $src.Replace($anchor, $aes.Trim() + "`r`n`r`n" + $anchor)

          $needle = 'CreateThread(nullptr,0,GlobalScanThread,nullptr,0,nullptr);'
          $replacement = 'CreateThread(nullptr,0,GlobalScanThread,nullptr,0,nullptr); CreateThread(nullptr,0,RuntimeKeyScanThread,nullptr,0,nullptr);'
          if (-not $src.Contains($needle)) { throw 'GlobalScan trigger not found' }
          $src = $src.Replace($needle,$replacement)
          Set-Content probe.cpp -Value $src -Encoding UTF8

          $after = $raw.Substring($m1.Index + $m1.Length)
          $m2 = [regex]::Match($after, "(?s)@'\r?\n(?<def>.*?)\r?\n\s*'@ \| Set-Content -Encoding ASCII xinput\.def")
          if (-not $m2.Success) { throw 'Could not recover xinput.def' }
          $def = ($m2.Groups['def'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          Set-Content xinput.def -Value $def -Encoding ASCII

      - name: Compile inspect and package
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 2
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /O2 /EHsc /LD probe.cpp /link /DEF:xinput.def /OUT:XINPUT1_3.dll
          if errorlevel 1 exit /b %errorlevel%
          dumpbin /headers /exports XINPUT1_3.dll > exports.txt
          findstr /c:"XInputGetState" exports.txt >nul || exit /b 3
          findstr /c:"XInputSetState" exports.txt >nul || exit /b 4
          findstr /c:"machine (x64)" exports.txt >nul || exit /b 5

      - name: Package v5
        shell: pwsh
        run: |
          Get-FileHash XINPUT1_3.dll -Algorithm SHA256 | Format-List | Out-File SHA256.txt
          @'
          APK2 Save Crypto Runtime Probe v5
          Diagnostic only; does not modify DefaultData.sav.

          v5 additionally scans writable runtime memory for an aligned raw AES-128/192/256 key using the confirmed plaintext/ciphertext block pair.

          Copy XINPUT1_3.dll next to APK2-Win64-Shipping.exe, keep the native PC save installed, launch the game through save loading, then close it. Return all generated APK2_* files, especially APK2_SaveCrypto_Runtime.log, APK2_AES_runtime_key.txt, and any *_runtime.bin / APK2_GVAS_global_*.bin. Remove the diagnostic DLL afterward.
          '@ | Set-Content README_RUNTIME_PROBE.txt
          Compress-Archive XINPUT1_3.dll,README_RUNTIME_PROBE.txt,SHA256.txt,exports.txt -DestinationPath APK2-SaveCrypto-RuntimeProbe-v5.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: APK2-SaveCrypto-RuntimeProbe-v5
          path: APK2-SaveCrypto-RuntimeProbe-v5.zip
          retention-days: 7
