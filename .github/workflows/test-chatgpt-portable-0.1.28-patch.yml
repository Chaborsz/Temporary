name: Test ChatGPT Portable 0.1.28 native patch

on:
  push:
    paths:
      - 'chatgpt-portable-0.1.28/**'
      - '.github/workflows/test-chatgpt-portable-0.1.28-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Electron runtime
        shell: pwsh
        run: |
          $v='46.0.0-nightly.20261016'
          $u="https://github.com/electron/nightlies/releases/download/v$v/electron-v$v-win32-x64.zip"
          Invoke-WebRequest $u -OutFile electron.zip
          if((Get-FileHash electron.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1d986c61270c82d205bb658153dff2f7850bd4ad702ef335e367dc0a7359f4a8'){throw 'zip sha'}
          Expand-Archive electron.zip runtime
          if((Get-FileHash runtime/electron.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5008929104e3514ecfe5975ea6baa31b68607e898e0b0236733fa388dfc6d61b'){throw 'exe sha'}

      - name: Prepare original 0.1.25 0.1.26 and 0.1.27 inputs
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127')){New-Item -ItemType Directory -Force "test/$n/resources/app"|Out-Null;Copy-Item runtime/electron.exe "test/$n/ChatGPT Portable.exe"}
          $p='test/p125/ChatGPT Portable.exe';$b=[IO.File]::ReadAllBytes($p);$b[0xA38EB2F]=0xB1;$b[0xA38EB30]=0x01;[IO.File]::WriteAllBytes($p,$b)
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5ef1227723cacd884b433e34589c2b63fd70bb30753cad18c0a60344dde6aa88'){throw 'p125 sha'}
          $p='test/p126/ChatGPT Portable.exe';$b=[IO.File]::ReadAllBytes($p);[Array]::Copy([byte[]](0xE9,0xFB,0x02,0x00,0x00),0,$b,0xA38EAE0,5);[Array]::Copy([byte[]](0x31,0xC9),0,$b,0xA38EB2F,2);[IO.File]::WriteAllBytes($p,$b)
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'){throw 'p126 sha'}
          $p='test/p127/ChatGPT Portable.exe';$b=[IO.File]::ReadAllBytes($p);[Array]::Copy([byte[]](0x44,0x89,0xF3,0x83,0xE3,0x01),0,$b,0x6F80B70,6);[IO.File]::WriteAllBytes($p,$b)
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0c9be9f4d51978180afe65907401a6ee36f169b0615e99a36766287a2de7c8c8'){throw 'p127 sha'}

      - name: Parse exact PowerShell
        shell: pwsh
        run: |
          $e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'chatgpt-portable-0.1.28/PATCH-TO-0.1.28.ps1'),[ref]$null,[ref]$e);if($e.Count){$e|Format-List|Out-String|Write-Host;throw 'parser'}

      - name: Apply all supported inputs and verify exact result
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127')){
            & ./chatgpt-portable-0.1.28/PATCH-TO-0.1.28.ps1 -PortablePath (Resolve-Path "test/$n")
            $p="test/$n/ChatGPT Portable.exe";$sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($sha -ne 'd65be021ea56ff04228ee0780e7685cbe67db838cd7c331294729f641b07591f'){throw "$n final $sha"}
            $b=[IO.File]::ReadAllBytes($p)
            $enter=(($b[0xA38EB2F..0xA38EB30]|%{$_.ToString('X2')}) -join ' ');if($enter -ne 'B1 01'){throw "$n enter $enter"}
            $site=(($b[0xA38EE6D..0xA38EE75]|%{$_.ToString('X2')}) -join ' ');if($site -ne 'E9 9E F8 FF FF 90 90 90 90'){throw "$n site $site"}
            $cave=(($b[0xA38E710..0xA38E71F]|%{$_.ToString('X2')}) -join ' ');if($cave -ne '8B 44 24 20 85 F6 0F 44 F0 89 F0 E9 56 07 00 00'){throw "$n cave $cave"}
            & ./chatgpt-portable-0.1.28/PATCH-TO-0.1.28.ps1 -PortablePath (Resolve-Path "test/$n")
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd65be021ea56ff04228ee0780e7685cbe67db838cd7c331294729f641b07591f'){throw "$n idempotence"}
          }
