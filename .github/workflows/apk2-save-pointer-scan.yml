name: APK2 Save Pointer Chain Scan

on:
  push:
    paths:
      - '.github/workflows/apk2-save-pointer-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download verified APK2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern APK2-Win64-Shipping.exe --dir .
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip install --quiet pefile capstone

      - name: Scan direct and indirect pointers
        shell: bash
        run: |
          set -euo pipefail
          cat > scan.py <<'PY'
          import pefile, struct
          from pathlib import Path
          from collections import defaultdict
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP, X86_OP_IMM

          FN='APK2-Win64-Shipping.exe'
          data=Path(FN).read_bytes()
          pe=pefile.PE(FN, fast_load=False)
          IB=pe.OPTIONAL_HEADER.ImageBase

          targets={
            'SaveGamesFmt':0x149b17990,
            'SaveGamePipe':0x149b302e8,
            'SaveGameSystem45':0x149b30330,
            'SaveGameSystem18':0x149b303f0,
            'SaveGameSystem100':0x149b304b0,
            'SaveGameSystem72':0x149b30570,
            'SaveGameSystem124':0x149b30750,
            'UAPKGameSaveDataVersionHandler':0x14a07d3b8,
            'UAPKGameSaveDataHandler':0x14a07d3f8,
            'RootSaveDirs':0x14a7e9578,
          }

          sections=[]
          for s in pe.sections:
            nm=s.Name.rstrip(b'\0').decode(errors='replace')
            sections.append((nm,s.VirtualAddress,s.PointerToRawData,s.SizeOfRawData,max(s.Misc_VirtualSize,s.SizeOfRawData),s.Characteristics))

          def off_to_va(off):
            for nm,rva,raw,rsz,vsz,ch in sections:
              if raw <= off < raw+rsz:
                return IB+rva+(off-raw),nm,ch
            return None,None,None

          def va_to_off(va):
            rva=va-IB
            for nm,srva,raw,rsz,vsz,ch in sections:
              if srva <= rva < srva+vsz:
                d=rva-srva
                if d < rsz: return raw+d,nm,ch
            return None,None,None

          def find_all(blob):
            out=[]; p=0
            while True:
              i=data.find(blob,p)
              if i<0: break
              out.append(i); p=i+1
            return out

          report=[]
          report.append(f'IMAGEBASE=0x{IB:x}')
          report.append(f'SIZE={len(data)}')
          report.append('SECTIONS:')
          for x in sections: report.append('  %s RVA=0x%x RAW=0x%x RSZ=0x%x VSZ=0x%x CH=0x%x'%x)

          # Nodes are virtual addresses of storage slots containing pointers/RVAs.
          level_nodes=defaultdict(list)
          direct_slots=[]
          for name,va in targets.items():
            report.append(f'\n=== TARGET {name} VA=0x{va:x} RVA=0x{va-IB:x} ===')
            for kind,blob in [('QWORD_VA',struct.pack('<Q',va)),('DWORD_RVA',struct.pack('<I',va-IB))]:
              hits=find_all(blob)
              report.append(f'{kind}_COUNT={len(hits)}')
              for off in hits[:1000]:
                slot_va,sec,ch=off_to_va(off)
                report.append(f'  off=0x{off:x} slot_va={"0x%x"%slot_va if slot_va else "NA"} sec={sec} chars={"0x%x"%ch if ch is not None else "NA"}')
                if slot_va:
                  direct_slots.append((name,kind,slot_va,sec))
                  level_nodes[1].append((name,slot_va))

          # Recursively find qword pointers to pointer slots, depth 3.
          seen=set(va for _,va in level_nodes[1])
          for depth in range(2,4):
            report.append(f'\n=== POINTER CHAIN DEPTH {depth} ===')
            prev=list(level_nodes[depth-1])
            for origin,node_va in prev:
              hits=find_all(struct.pack('<Q',node_va))
              for off in hits[:300]:
                slot_va,sec,ch=off_to_va(off)
                if not slot_va or slot_va in seen: continue
                seen.add(slot_va)
                level_nodes[depth].append((origin,slot_va))
                report.append(f'  origin={origin} ptr_to=0x{node_va:x} slot=0x{slot_va:x} off=0x{off:x} sec={sec} ch=0x{ch:x}')
            report.append(f'DEPTH_{depth}_COUNT={len(level_nodes[depth])}')

          # Direct code xrefs: RIP-relative mem targets or immediate operands pointing at any target/slot.
          interesting={va:(f'target:{name}') for name,va in targets.items()}
          for depth,nodes in level_nodes.items():
            for origin,va in nodes: interesting.setdefault(va,f'ptr{depth}:{origin}')

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          xrefs=[]
          for nm,srva,raw,rsz,vsz,ch in sections:
            if not (ch & 0x20000000): continue
            code=data[raw:raw+rsz]; base=IB+srva
            for ins in md.disasm(code,base):
              for op in ins.operands:
                dest=None
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  dest=ins.address+ins.size+op.mem.disp
                elif op.type==X86_OP_IMM:
                  dest=op.imm & ((1<<64)-1)
                if dest in interesting:
                  xrefs.append((ins.address,nm,ins.mnemonic,ins.op_str,dest,interesting[dest]))

          report.append(f'\n=== CODE XREFS TO TARGETS OR POINTER SLOTS count={len(xrefs)} ===')
          for a,sec,mn,ops,dest,label in xrefs:
            report.append(f'0x{a:x} sec={sec} {mn} {ops} -> 0x{dest:x} {label}')

          # Disassembly windows around recovered code xrefs.
          report.append('\n=== XREF WINDOWS ===')
          for a,sec,mn,ops,dest,label in xrefs[:1000]:
            off,_,_=va_to_off(a)
            if off is None: continue
            begin=max(0,off-0x80); start_va=a-(off-begin)
            report.append(f'--- XREF 0x{a:x} {label} ---')
            for ins in md.disasm(data[begin:min(len(data),off+0x180)],start_va):
              mark='>>' if ins.address==a else '  '
              report.append(f'{mark} 0x{ins.address:x}: {ins.mnemonic:10} {ins.op_str}')

          Path('pointer-scan.txt').write_text('\n'.join(report),encoding='utf-8')
          print('direct_slots',len(direct_slots),'nodes',sum(map(len,level_nodes.values())),'code_xrefs',len(xrefs))
          PY
          python3 scan.py
          grep -E '^(===|QWORD_VA_COUNT|DWORD_RVA_COUNT|DEPTH_|0x14|direct_slots)' pointer-scan.txt | head -2000 || true

      - name: Upload pointer report
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-pointer-scan
          path: pointer-scan.txt
          retention-days: 3
