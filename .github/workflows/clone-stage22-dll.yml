name: Clone mode Stage22 — Endurance x86 integrated TEST
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/clone_mode/endurance_clone_stage22.cpp"
      - "experiments/clone_mode/test_clone_stage22.cpp"
      - ".github/workflows/clone-stage22-dll.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build x86 integrated version.dll and isolated native tests
        shell: cmd
        run: |
          for /f "delims=" %%V in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do @set "VSROOT=%%V"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 2
          mkdir dist
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /LD /Fe:dist\version.dll experiments\clone_mode\endurance_clone_stage22.cpp /link /DEF:cheats\endurance\dll\version_proxy.def /OUT:dist\version.dll
          if errorlevel 1 exit /b 3
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /Fe:dist\proxy_smoke.exe cheats\endurance\dll\proxy_smoke.cpp /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 4
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /Fe:dist\clone_stage22_test.exe experiments\clone_mode\test_clone_stage22.cpp /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact canonical EXE, native spawn/delete API and 3 hook prologues
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          @'
          import pefile,hashlib
          fn='cheats/endurance/input/player.exe'
          assert hashlib.sha256(open(fn,'rb').read()).hexdigest()=='02a59baab7a4c941f9a01f485082396d61e750a41dc955cff895bef5395441ea'
          game=pefile.PE(fn)
          assert game.FILE_HEADER.Machine==0x14c and game.OPTIONAL_HEADER.ImageBase==0x400000
          checks={
            0x6ab90: bytes.fromhex('55 8b ec 83 e4 f8'),
            0x18b380: bytes.fromhex('55 8b ec 53 8b d9'),
            0x18b5c0: bytes.fromhex('55 8b ec 83 e4 f8'),
          }
          for rva,expected in checks.items():
            got=game.__data__[game.get_offset_from_rva(rva):][:len(expected)]
            assert got==expected, (hex(rva),got.hex())
            print('CLONE_HOOK_PREIMAGE_PASS',hex(rva))
          exports={game.OPTIONAL_HEADER.ImageBase+s.address:(s.name or b'').decode('utf-8','replace') for s in game.DIRECTORY_ENTRY_EXPORT.symbols}
          methods={
            0x53fcf0:'execActionObjectCreateForScript',
            0x5d32d0:'getInstance@GameManager',
            0x5e8470:'getTargetObjectByInstanceId',
            0x58b380:'addObject@SceneLayer',
            0x58b5c0:'removeObject@SceneLayer',
            0x527d50:'getPosition@Object',
            0x4270e0:'getScene@SceneLayer',
            0x4297c0:'getLayerId@SceneLayer',
          }
          for va,needle in methods.items():
            assert needle in exports.get(va,''),(hex(va),exports.get(va))
          print('CLONE_NATIVE_METHOD_SYMBOLS_PASS',len(methods))
          dll=pefile.PE('dist/version.dll')
          assert dll.is_dll() and dll.FILE_HEADER.Machine==0x14c
          forward={s.name.decode('ascii') for s in dll.DIRECTORY_ENTRY_EXPORT.symbols if s.name}
          assert len(forward)==10 and {'GetFileVersionInfoW','GetFileVersionInfoSizeW','VerQueryValueW'}<=forward
          print('CLONE_DLL_PE32_PROXY_EXPORTS_PASS',len(forward))
          '@ | python -
      - name: Validate VERSION forwarding and selective cloning mock behavior on Windows
        shell: cmd
        run: |
          cd dist
          proxy_smoke.exe
          if errorlevel 1 exit /b 1
          clone_stage22_test.exe
          if errorlevel 1 exit /b 2
          findstr /C:"GUARD_FAIL" EnduranceClone.log
          if errorlevel 1 exit /b 3
          echo CLONE_STAGE22_UNIT_TEST_PASS
      - name: Upload TEST DLL and safety instructions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Endurance-CloneMode-F6-F7-TEST-${{ github.run_id }}
          path: |
            dist/version.dll
            experiments/clone_mode/README_CLONE_STAGE22.md
          retention-days: 14
          if-no-files-found: error
