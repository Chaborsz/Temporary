name: APK2 save manager vtable diff fast

on:
  push:
    paths:
      - '.github/workflows/dump-apk2-vtable-diff-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff vtables only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile
          mkdir -p analysis-results/apk2-vtable-diff-fast
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          fn='APK2-Win64-Shipping.exe'; b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append((s.PointerToRawData,s.SizeOfRawData,s.VirtualAddress,max(s.Misc_VirtualSize,s.SizeOfRawData),s.Name.rstrip(b'\0').decode(errors='replace')))
          def va2off(va):
              r=va-base
              for raw,sz,rva,vsz,nm in secs:
                  if rva<=r<rva+sz:return raw+(r-rva)
          def sec(va):
              r=va-base
              for raw,sz,rva,vsz,nm in secs:
                  if rva<=r<rva+vsz:return nm
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress;en=base+e.struct.EndAddress
              if st<en:funcs.append((st,en))
          funcs=sorted(set(funcs));starts=[x[0] for x in funcs]
          def cf(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          bv=0x149dd8d58;dv=0x14a1deb08
          bo=va2off(bv);do=va2off(dv)
          with open('analysis-results/apk2-vtable-diff-fast/diff.txt','w') as f:
              for i in range(256):
                  a=struct.unpack_from('<Q',b,bo+i*8)[0];d=struct.unpack_from('<Q',b,do+i*8)[0]
                  if a!=d:
                      f.write(f'INDEX={i} OFF=0x{i*8:x} BASE=0x{a:x} BASESEC={sec(a)} BASEFUNC={cf(a)} DERIVED=0x{d:x} DERIVEDSEC={sec(d)} DERIVEDFUNC={cf(d)}\n')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-vtable-diff-fast
          git commit -m 'Add APK2 save manager lightweight vtable diff' || exit 0
          git pull --rebase origin main
          git push origin main
