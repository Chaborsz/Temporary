name: Endurance AGTK static audit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag with project.json asset'
        required: false
        type: string
  release:
    types: [published]
  push:
    paths:
      - "cheats/endurance/**"
      - ".github/workflows/endurance-audit.yml"

permissions:
  contents: read

concurrency:
  group: endurance-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve large encrypted project.json from an optional GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "No Release specified; will test decoder without encrypted input."
            exit 0
          fi
          folder="cheats/endurance/input/Resources/data"
          mkdir -p "$folder"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "project.json" --dir "$folder" --clobber
          test -s "$folder/project.json"
          echo "Encrypted asset downloaded. Size: $(stat -c%s "$folder/project.json") bytes"
      - name: Install minimal disassembly dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pefile==2024.8.26" "capstone==5.0.6" "ijson==3.4.0"
      - name: Analyze Endurance only, read-only
        run: |
          python cheats/endurance/analyze_endurance.py \
            --exe cheats/endurance/input/player.exe \
            --assets cheats/endurance/input \
            --output analysis-results/endurance
      - name: Trace Endurance through generic AGTK variable symbols
        run: |
          python cheats/endurance/trace_endurance.py \
            --exe cheats/endurance/input/player.exe \
            --out analysis-results/endurance
      - name: Trace callsites for AGTK variable lookup
        run: |
          python cheats/endurance/trace_variable_callers.py \
            --exe cheats/endurance/input/player.exe \
            --out analysis-results/endurance
      - name: Validate Weakfish decoder and scan project.json when supplied
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""
          for file in \
            cheats/endurance/input/Resources/data/project.json \
            cheats/endurance/input/project.json \
            cheats/endurance/input/project_decrypted.json ; do
            if [ -f "$file" ]; then PROJECT="$file"; break; fi
          done
          if [ -n "$PROJECT" ]; then
            python cheats/endurance/decode_project_weakfish.py \
              --self-test --input "$PROJECT" \
              --output analysis-results/endurance
          else
            python cheats/endurance/decode_project_weakfish.py \
              --self-test --output analysis-results/endurance
          fi
      - name: Publish compact evidence and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-audit-${{ github.run_id }}
          path: analysis-results/endurance/
          retention-days: 7
          if-no-files-found: error
