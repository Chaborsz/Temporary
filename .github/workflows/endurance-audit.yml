name: Endurance AGTK static audit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag with project.json asset'
        required: false
        type: string
  release:
    types: [published]
  push:
    paths:
      - "cheats/endurance/**"
      - ".github/workflows/endurance-audit.yml"

permissions:
  contents: read

concurrency:
  group: endurance-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download optional project input from GitHub Release (ZIP, 7z, JSON)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || 'fobs-build29-endurance-input' }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release specified: checking repository input."
            exit 0
          fi
          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          mkdir -p cheats/endurance/input
          chosen=""
          for name in project_data.zip project_data.7z project_decrypted.json project.json; do
            if grep -Fxq -- "$name" <<< "$names"; then chosen="$name"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::Release has no project_data.zip, project_data.7z, project_decrypted.json or project.json."
            exit 1
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$chosen" \
            --dir cheats/endurance/input --clobber
          test -s "cheats/endurance/input/$chosen"
          echo "Download verified: $chosen ($(stat -c%s "cheats/endurance/input/$chosen") bytes)"
      - name: Install minimal disassembly dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pefile==2024.8.26" "capstone==5.0.6" "ijson==3.4.0" "py7zr==1.0.0"
      - name: Unpack project JSON from ZIP or 7z, if provided
        shell: bash
        run: |
          set -euo pipefail
          python cheats/endurance/unpack_project_archive.py --self-test
          for archive in \
            cheats/endurance/input/project_data.zip \
            cheats/endurance/input/project_data.7z ; do
            if [ -s "$archive" ]; then
              python cheats/endurance/unpack_project_archive.py \
                --archive "$archive" --output-dir cheats/endurance/input
              break
            fi
          done
      - name: Analyze Endurance only, read-only
        run: |
          python cheats/endurance/analyze_endurance.py \
            --exe cheats/endurance/input/player.exe \
            --assets cheats/endurance/input \
            --output analysis-results/endurance
      - name: Trace Endurance through generic AGTK variable symbols
        run: |
          python cheats/endurance/trace_endurance.py \
            --exe cheats/endurance/input/player.exe \
            --out analysis-results/endurance
      - name: Trace callsites for AGTK variable lookup
        run: |
          python cheats/endurance/trace_variable_callers.py \
            --exe cheats/endurance/input/player.exe \
            --out analysis-results/endurance
      - name: Validate Weakfish decoder and scan project.json when supplied
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=""
          for file in \
            cheats/endurance/input/project_decrypted.json \
            cheats/endurance/input/project.json \
            cheats/endurance/input/Resources/data/project.json ; do
            if [ -f "$file" ]; then PROJECT="$file"; break; fi
          done
          if [ -n "$PROJECT" ]; then
            python cheats/endurance/decode_project_weakfish.py \
              --self-test --input "$PROJECT" \
              --output analysis-results/endurance
          else
            python cheats/endurance/decode_project_weakfish.py \
              --self-test --output analysis-results/endurance
          fi
      - name: Correlate Endurance project variable and ID 2054
        shell: bash
        run: |
          if [ -f cheats/endurance/input/project_decrypted.json ]; then
            python cheats/endurance/correlate_endurance_project.py \
              --project cheats/endurance/input/project_decrypted.json \
              --out analysis-results/endurance
          else
            echo "No decrypted project data for stage 5."
          fi
      - name: Inspect specific Endurance-variable writes and HUD actions
        shell: bash
        run: |
          if [ -f cheats/endurance/input/project_decrypted.json ]; then
            python cheats/endurance/audit_endurance_operations.py \
              --project cheats/endurance/input/project_decrypted.json \
              --out analysis-results/endurance
          fi
      - name: Publish compact evidence and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endurance-audit-${{ github.run_id }}
          path: analysis-results/endurance/
          retention-days: 7
          if-no-files-found: error
