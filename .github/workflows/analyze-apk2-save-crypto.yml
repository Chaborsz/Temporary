name: Analyze APK2 save crypto

on:
  push:
    paths:
      - '.github/workflows/analyze-apk2-save-crypto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK2 executable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 \
            --repo Chaborsz/Temporary \
            --pattern 'APK2-Win64-Shipping.exe' \
            --dir .
          sha256sum APK2-Win64-Shipping.exe

      - name: Install analysis libraries
        run: python3 -m pip install --quiet pefile capstone

      - name: Targeted PE and crypto analysis
        shell: bash
        run: |
          set -euo pipefail
          cat > analyze.py <<'PY'
          import pefile, re, json, hashlib, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'
          data=Path(fn).read_bytes()
          pe=pefile.PE(fn, fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase

          def foff_to_rva(off):
              for s in pe.sections:
                  a=s.PointerToRawData; b=a+s.SizeOfRawData
                  if a <= off < b: return s.VirtualAddress + (off-a)
              return None

          def rva_to_foff(rva):
              for s in pe.sections:
                  a=s.VirtualAddress; b=a+max(s.Misc_VirtualSize,s.SizeOfRawData)
                  if a <= rva < b: return s.PointerToRawData + (rva-a)
              return None

          lines=[]
          lines.append(f'SHA256 {hashlib.sha256(data).hexdigest()}')
          lines.append(f'SIZE {len(data)}')
          lines.append(f'IMAGEBASE 0x{ib:x}')
          lines.append('SECTIONS')
          for s in pe.sections:
              nm=s.Name.rstrip(b'\\0').decode(errors='replace')
              lines.append(f'  {nm:8} RVA=0x{s.VirtualAddress:x} VSZ=0x{s.Misc_VirtualSize:x} RAW=0x{s.PointerToRawData:x} RSZ=0x{s.SizeOfRawData:x} CH=0x{s.Characteristics:x}')

          lines.append('IMPORTS_CRYPTO_FILE')
          try:
              for e in pe.DIRECTORY_ENTRY_IMPORT:
                  dll=e.dll.decode(errors='replace')
                  hits=[]
                  for imp in e.imports:
                      n=(imp.name or b'').decode(errors='replace')
                      if any(k in n.lower() for k in ['crypt','bcrypt','aes','file','read','write']): hits.append(n)
                  if hits: lines.append('  '+dll+': '+', '.join(hits[:80]))
          except Exception as ex: lines.append('  ERR '+repr(ex))

          # Extract ASCII and UTF-16LE strings with offsets, keeping relevant candidates.
          relevant=[]
          pats=['defaultdata','savegame','saved','save data','encrypt','decrypt','aes','crypto','cipher','padding','pkcs','gvas','apk2','steam']
          for m in re.finditer(rb'[ -~]{5,}', data):
              s=m.group().decode('ascii','ignore')
              if any(p in s.lower() for p in pats): relevant.append((m.start(),'A',s[:300]))
          for m in re.finditer(rb'(?:[ -~]\\x00){5,}', data):
              try: s=m.group().decode('utf-16le')
              except: continue
              if any(p in s.lower() for p in pats): relevant.append((m.start(),'W',s[:300]))
          lines.append('RELEVANT_STRINGS')
          for off,typ,s in relevant[:4000]:
              r=foff_to_rva(off)
              lines.append(f'  OFF=0x{off:x} RVA={"0x%x"%r if r is not None else "NA"} {typ} {s!r}')

          # Exact AES S-box / inverse S-box constants.
          sbox=bytes.fromhex('')
          inv=bytes.fromhex('')
          lines.append('AES_TABLE_SCAN')
          for nm,const in [('SBOX',sbox),('INV_SBOX',inv)]:
              pos=[]; st=0
              while True:
                  i=data.find(const,st)
                  if i<0: break
                  pos.append(i); st=i+1
              lines.append(f'  {nm}: '+(', '.join(f'0x{x:x}' for x in pos) if pos else 'none'))

          # Disassemble executable sections. Capture AES-NI and RIP-relative xrefs to relevant strings.
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          str_targets={ib+r:(off,typ,s) for off,typ,s in relevant if (r:=foff_to_rva(off)) is not None}
          xrefs=[]; aesins=[]; calls=[]
          exec_secs=[s for s in pe.sections if s.Characteristics & 0x20000000]
          for sec in exec_secs:
              code=sec.get_data(); base=ib+sec.VirtualAddress
              for ins in md.disasm(code,base):
                  mn=ins.mnemonic.lower()
                  if mn.startswith('aes') or mn in ('pclmulqdq',):
                      aesins.append((ins.address,ins.mnemonic,ins.op_str))
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          tgt=ins.address+ins.size+op.mem.disp
                          if tgt in str_targets:
                              xrefs.append((ins.address,ins.mnemonic,ins.op_str,tgt,str_targets[tgt]))
          lines.append(f'AESNI_COUNT {len(aesins)}')
          for x in aesins[:1000]: lines.append('  0x%x: %s %s'%x)
          lines.append(f'STRING_XREF_COUNT {len(xrefs)}')
          for a,mn,op,tgt,meta in xrefs[:3000]:
              off,typ,s=meta
              lines.append(f'  0x{a:x}: {mn} {op} -> 0x{tgt:x} {typ} {s!r}')

          # Targeted disassembly windows around each unique xref address.
          lines.append('XREF_WINDOWS')
          seen=set()
          for a,_,_,_,meta in xrefs:
              if a in seen: continue
              seen.add(a)
              rva=a-ib; fo=rva_to_foff(max(0,rva-0x100))
              if fo is None: continue
              blob=data[fo:fo+0x300]
              start=a-0x100
              lines.append(f'--- around 0x{a:x} target={meta[2]!r} ---')
              for ins in md.disasm(blob,start):
                  mark='>>' if abs(ins.address-a)<=8 else '  '
                  lines.append(f'{mark} 0x{ins.address:x}: {ins.mnemonic:10} {ins.op_str}')

          Path('apk2-save-crypto-report.txt').write_text('\\n'.join(lines),encoding='utf-8',errors='replace')
          print('report lines',len(lines),'strings',len(relevant),'xrefs',len(xrefs),'aesni',len(aesins))
          PY
          python3 analyze.py
          wc -l apk2-save-crypto-report.txt
          grep -Ei 'DefaultData|Encrypt|Decrypt|AESNI_COUNT|SBOX|SaveGame|GVAS' apk2-save-crypto-report.txt | head -n 300 || true

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-crypto-report
          path: apk2-save-crypto-report.txt
          retention-days: 7
