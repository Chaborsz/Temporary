name: Analyze APK2 Save Crypto Deep

on:
  push:
    paths:
      - '.github/workflows/analyze-apk2-save-crypto.yml'
      - 'apk2-re/FindSaveCrypto.java'
  workflow_dispatch:

permissions:
  contents: read

env:
  APK2_TAG: apk2-mediafire-transfer-2026-10-18
  APK2_SHA256: ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940
  GHIDRA_TAG: Ghidra_12.1.4_build
  GHIDRA_ZIP: ghidra_12.1.4_PUBLIC_20260921.zip
  RIZIN_TAG: v0.9.1
  RIZIN_TAR: rizin-v0.9.1-static-x86_64.tar.xz

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified APK2 executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$APK2_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'APK2-Win64-Shipping.exe' --dir .
          echo "$APK2_SHA256  APK2-Win64-Shipping.exe" | sha256sum -c -
          test "$(xxd -p -l2 APK2-Win64-Shipping.exe)" = 4d5a
          stat -c 'APK2_SIZE=%s' APK2-Win64-Shipping.exe

      - name: Download Rizin 0.9.1 and Ghidra 12.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools out
          gh release download "$RIZIN_TAG" --repo rizinorg/rizin --pattern "$RIZIN_TAR" --dir tools
          gh release download "$GHIDRA_TAG" --repo NationalSecurityAgency/ghidra --pattern "$GHIDRA_ZIP" --dir tools
          tar -xJf "tools/$RIZIN_TAR" -C tools
          unzip -q "tools/$GHIDRA_ZIP" -d tools
          RZ="$(find tools -type f -name rizin -perm -111 | head -1)"
          RZBIN="$(find tools -type f -name rz-bin -perm -111 | head -1)"
          GH="$(find tools -type f -path '*/support/analyzeHeadless' | head -1)"
          test -x "$RZ"; test -x "$RZBIN"; test -x "$GH"
          echo "RZ=$RZ" >> "$GITHUB_ENV"
          echo "RZBIN=$RZBIN" >> "$GITHUB_ENV"
          echo "GH=$GH" >> "$GITHUB_ENV"
          "$RZ" -v | tee out/rizin-version.txt
          java -version 2>&1 | tee out/java-version.txt

      - name: Rizin targeted strings imports and xrefs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/rizin
          "$RZBIN" -I APK2-Win64-Shipping.exe > out/rizin/bin-info.txt 2>&1 || true
          "$RZBIN" -S APK2-Win64-Shipping.exe > out/rizin/sections.txt 2>&1 || true
          "$RZBIN" -i APK2-Win64-Shipping.exe > out/rizin/imports.txt 2>&1 || true
          "$RZBIN" -zz APK2-Win64-Shipping.exe 2>/dev/null | grep -Eai 'SaveGames/|SaveGamePipe|SaveGameSystem\.cpp|APKGameSaveData|APKSaveData|DefaultData|GVAS|CryptDecrypt|CryptCreateHash|BCryptGenRandom|encrypt|decrypt|AES' > out/rizin/target-strings.txt || true
          cat > /tmp/rzcmds <<'EOF'
          aa
          ?e === XREF %sSaveGames/%s.sav ===
          axt @ 0x149b17990
          ?e === XREF SaveGamePipe ===
          axt @ 0x149b302e8
          ?e === XREF SaveGameSystem.cpp(45) ===
          axt @ 0x149b30330
          ?e === XREF SaveGameSystem.cpp(18) ===
          axt @ 0x149b303f0
          ?e === XREF SaveGameSystem.cpp(100) ===
          axt @ 0x149b304b0
          ?e === XREF SaveGameSystem.cpp(72) ===
          axt @ 0x149b30570
          ?e === XREF SaveGameSystem.cpp(124) ===
          axt @ 0x149b30750
          ?e === XREF UAPKGameSaveDataVersionHandler ===
          axt @ 0x14a07d3b8
          ?e === XREF UAPKGameSaveDataHandler ===
          axt @ 0x14a07d3f8
          ?e === XREF RootSaveDirs ===
          axt @ 0x14a7e9578
          ?e === IMPORTS FILTER ===
          ii~CryptDecrypt
          ii~CryptCreateHash
          ii~CryptSetHashParam
          ii~CryptGetUserKey
          ii~BCryptGenRandom
          ii~CreateFile
          ii~ReadFile
          ii~WriteFile
          afl~Save
          q
          EOF
          timeout 1800 "$RZ" -2 -q -e scr.color=false -c "$(tr '\n' ';' < /tmp/rzcmds)" APK2-Win64-Shipping.exe > out/rizin/xrefs.txt 2>&1 || echo "RIZIN_EXIT=$?" >> out/rizin/xrefs.txt

      - name: Ghidra headless analysis and targeted decompile
        shell: bash
        run: |
          set +e
          mkdir -p out/ghidra /tmp/ghidra-project
          timeout 3300 "$GH" /tmp/ghidra-project APK2SaveCrypto \
            -import "$GITHUB_WORKSPACE/APK2-Win64-Shipping.exe" \
            -overwrite \
            -analysisTimeoutPerFile 2400 \
            -scriptPath "$GITHUB_WORKSPACE/apk2-re" \
            -postScript FindSaveCrypto.java \
            > out/ghidra/headless.txt 2>&1
          rc=$?
          echo "GHIDRA_EXIT=$rc" >> out/ghidra/headless.txt
          exit 0

      - name: Build compact checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# APK2 save crypto deep static-analysis checkpoint'
            echo
            echo "EXE_SHA256=$APK2_SHA256"
            echo "EXE_SIZE=$(stat -c %s APK2-Win64-Shipping.exe)"
            echo
            echo '## Rizin target strings'
            sed -n '1,600p' out/rizin/target-strings.txt 2>/dev/null || true
            echo
            echo '## Rizin xrefs'
            sed -n '1,2200p' out/rizin/xrefs.txt 2>/dev/null || true
            echo
            echo '## Ghidra targeted markers'
            grep -E '^(===|ASCII HIT|UTF16LE HIT|REF |REF_COUNT|FUNCTION_REF|NO_FUNCTION|SYMBOL |NO_SYMBOL|----- DECOMPILE|DECOMPILE_|PROGRAM=|IMAGE_BASE=|LANG=|GHIDRA_EXIT=)' out/ghidra/headless.txt 2>/dev/null | head -6000 || true
          } > out/CHECKPOINT.md
          du -h out/* out/rizin/* out/ghidra/* 2>/dev/null | sort -h > out/sizes.txt || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-crypto-deep-analysis
          path: out/
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
