name: Decompile APK2 save manager with Ghidra

on:
  push:
    paths:
      - '.github/workflows/decompile-apk2-save-manager-ghidra.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified executable and Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' \
            -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          curl -L --fail --retry 5 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' \
            -o ghidra.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip
          GHIDRA_DIR=$(find . -maxdepth 1 -type d -name 'ghidra_*' | head -n1)
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"
          mkdir -p ghidra_scripts ghidra_project analysis-results/apk2-ghidra-save-manager

      - name: Create targeted Ghidra decompiler script
        shell: bash
        run: |
          cat > ghidra_scripts/APK2TargetDecompile.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.symbol.SourceType;
          import java.io.*;

          public class APK2TargetDecompile extends GhidraScript {
              private Function ensureFunction(Address a, String name) throws Exception {
                  Function f = getFunctionAt(a);
                  if (f == null) {
                      disassemble(a);
                      f = createFunction(a, name);
                  }
                  if (f == null) f = getFunctionContaining(a);
                  return f;
              }
              public void run() throws Exception {
                  String[] targets = {
                      "1450ce860", "1450cea10", "1450ceb20", "1450cec30",
                      "1450ccfc0", "1450cce00", "1450ccec0",
                      "1450cd830", "144e60480"
                  };
                  File out = new File("analysis-results/apk2-ghidra-save-manager/decompiled.txt");
                  out.getParentFile().mkdirs();
                  PrintWriter pw = new PrintWriter(new FileWriter(out));
                  DecompInterface decomp = new DecompInterface();
                  decomp.toggleCCode(true);
                  decomp.toggleSyntaxTree(true);
                  decomp.setSimplificationStyle("decompile");
                  decomp.openProgram(currentProgram);
                  for (String s: targets) {
                      Address a = toAddr(s);
                      pw.println("\n===== TARGET 0x"+s+" =====");
                      Function f = ensureFunction(a, "APK2_target_"+s);
                      if (f == null) {
                          pw.println("NO_FUNCTION");
                          continue;
                      }
                      pw.println("FUNCTION="+f.getName()+" ENTRY="+f.getEntryPoint()+" BODY="+f.getBody());
                      DecompileResults r = decomp.decompileFunction(f, 120, monitor);
                      if (!r.decompileCompleted()) {
                          pw.println("DECOMPILE_FAILED: "+r.getErrorMessage());
                          continue;
                      }
                      DecompiledFunction df = r.getDecompiledFunction();
                      pw.println(df.getC());
                  }
                  decomp.dispose();
                  pw.close();
              }
          }
          JAVA

      - name: Import PE without global analysis and decompile targets
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$PWD/ghidra_project" APK2_Save_Targeted \
            -import "$PWD/APK2-Win64-Shipping.exe" \
            -noanalysis \
            -scriptPath "$PWD/ghidra_scripts" \
            -postScript APK2TargetDecompile.java \
            -deleteProject \
            > analysis-results/apk2-ghidra-save-manager/ghidra.log 2>&1
          sed -n '1,1200p' analysis-results/apk2-ghidra-save-manager/decompiled.txt || true

      - name: Commit Ghidra output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-ghidra-save-manager
          git commit -m 'Add targeted Ghidra decompile of APK2 save manager' || exit 0
          git pull --rebase origin main
          git push origin main
