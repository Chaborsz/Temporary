name: Clone Stage39 — identify observed target caller
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/clone_mode/audit_stage39_caller.py"
      - ".github/workflows/clone-stage39-caller.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pefile==2024.8.26 capstone==5.0.6
      - run: python experiments/clone_mode/audit_stage39_caller.py
