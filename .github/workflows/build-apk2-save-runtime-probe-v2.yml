name: Build APK2 Save Runtime Probe v2

on:
  push:
    paths:
      - '.github/workflows/build-apk2-save-runtime-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover source embedded in v1 workflow
        shell: pwsh
        run: |
          $raw = Get-Content '.github/workflows/build-apk2-save-runtime-probe.yml' -Raw
          $m1 = [regex]::Match($raw, "(?s)@'\r?\n(?<src>.*?)\r?\n\s*'@ \| Set-Content -Encoding UTF8 probe\.cpp")
          if (-not $m1.Success) { throw 'Could not recover probe.cpp from v1 workflow' }
          $src = ($m1.Groups['src'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          Set-Content -Path probe.cpp -Value $src -Encoding UTF8

          $after = $raw.Substring($m1.Index + $m1.Length)
          $m2 = [regex]::Match($after, "(?s)@'\r?\n(?<def>.*?)\r?\n\s*'@ \| Set-Content -Encoding ASCII xinput\.def")
          if (-not $m2.Success) { throw 'Could not recover xinput.def from v1 workflow' }
          $def = ($m2.Groups['def'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          Set-Content -Path xinput.def -Value $def -Encoding ASCII
          Write-Host "probe.cpp lines=$((Get-Content probe.cpp).Count)"
          Get-Content xinput.def

      - name: Locate MSVC and compile x64 proxy
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 2
          echo VSROOT=%VSROOT%
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          where cl
          cl /nologo /O2 /EHsc /LD probe.cpp /link /DEF:xinput.def /OUT:XINPUT1_3.dll

      - name: Verify exports and package
        shell: pwsh
        run: |
          $dump = & dumpbin /headers /exports XINPUT1_3.dll | Out-String
          $dump | Set-Content exports.txt
          if ($dump -notmatch 'XInputGetState' -or $dump -notmatch 'XInputSetState') { throw 'Missing XInput exports' }
          if ($dump -notmatch 'machine \(x64\)') { throw 'DLL is not x64' }
          Get-FileHash XINPUT1_3.dll -Algorithm SHA256 | Format-List | Out-File SHA256.txt
          @'
          APK2 Save Crypto Runtime Probe v2

          DIAGNOSTIC ONLY. It does not modify DefaultData.sav.

          1. If the APK2 Win64 folder already has XINPUT1_3.dll, back it up first.
          2. Copy XINPUT1_3.dll next to APK2-Win64-Shipping.exe.
          3. Keep the native PC DefaultData.sav installed for this diagnostic run.
          4. Start the game normally and let it reach/attempt the save-data load.
          5. Close the game after reaching the menu or after the loading attempt completes.
          6. Return every APK2_* file generated next to the EXE, especially:
             APK2_SaveCrypto_Runtime.log
             APK2_PC_decrypted_runtime.bin
             APK2_PC_cipher_runtime.bin
             APK2_GVAS_global_*.bin
          7. Remove this XINPUT1_3.dll after the diagnostic run.

          The proxy forwards XInputGetState (ordinal 2) and XInputSetState (ordinal 3) to the real System32 XINPUT1_3.dll. It hooks the game's ReadFile IAT, watches candidate save buffers, and scans runtime memory for GVAS/AES S-box evidence.
          '@ | Set-Content README_RUNTIME_PROBE.txt
          Compress-Archive -Path XINPUT1_3.dll,README_RUNTIME_PROBE.txt,SHA256.txt,exports.txt -DestinationPath APK2-SaveCrypto-RuntimeProbe-v2.zip -Force

      - name: Upload runtime probe
        uses: actions/upload-artifact@v4
        with:
          name: APK2-SaveCrypto-RuntimeProbe-v2
          path: APK2-SaveCrypto-RuntimeProbe-v2.zip
          retention-days: 7
