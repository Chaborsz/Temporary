name: Publish APK2 analysis summaries

on:
  push:
    paths:
      - '.github/workflows/publish-apk2-analysis-summaries.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download prior analysis artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xrefs /tmp/meta
          mkdir -p /tmp/xrefs /tmp/meta analysis
          gh run download 39182043471 --repo Chaborsz/Temporary -n apk2-static-save-xrefs -D /tmp/xrefs
          gh run download 39182129327 --repo Chaborsz/Temporary -n apk2-save-metadata -D /tmp/meta
          find /tmp/xrefs /tmp/meta -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Build compact xref summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# APK2 save xrefs — compact summary'
            echo
            echo '## Static scanner structural lines'
            grep -E '^(POINTER|POINTER_LEVEL|HITS|XREF)' /tmp/xrefs/static_xrefs.txt || true
            echo
            echo '## Caller addresses'
            cat /tmp/xrefs/callers.txt || true
            echo
            echo '## Rizin instructions of interest around discovered sites'
            grep -E '(^|[[:space:]])(call|lea|mov|movzx|movsxd|cmp|test|and|or|xor|shl|shr|add|sub|imul|idiv|jmp|je|jne|jz|jnz)[[:space:]]' /tmp/xrefs/rizin_sites.txt | head -n 4000 || true
          } > analysis/apk2-xrefs-summary.txt
          wc -l -c analysis/apk2-xrefs-summary.txt

      - name: Build compact metadata summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# APK2 save metadata — compact summary'
            echo
            echo '## Focused reflection / string matches'
            cat /tmp/meta/focused_strings.txt 2>/dev/null | grep -Ei 'APKSaveGame|APK.*Save|SaveGameManager|DefaultData|SaveData|EncryptData|DecryptData|FAES|AESKey|EncryptionKey|Save.*Key|Key.*Save|SaveGameSystem|Serialize|Cipher|Crypt|Hash|Backup|Broken|Version|SEGA|Steam' | head -n 5000 || true
            echo
            echo '## Metadata cluster matches'
            cat /tmp/meta/save_metadata.txt 2>/dev/null | grep -Ei 'save|data|encrypt|decrypt|crypt|aes|serial|default|slot|load|backup|broken|version|steam|sega|user|profile|key|hash|check|game' | head -n 5000 || true
          } > analysis/apk2-save-metadata-summary.txt
          wc -l -c analysis/apk2-save-metadata-summary.txt

      - name: Commit summaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/apk2-xrefs-summary.txt analysis/apk2-save-metadata-summary.txt
          if git diff --cached --quiet; then
            echo 'No summary changes'
          else
            git commit -m 'Add compact APK2 save analysis summaries'
            git push
          fi
