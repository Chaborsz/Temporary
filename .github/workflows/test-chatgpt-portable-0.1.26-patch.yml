name: Test ChatGPT Portable 0.1.26 native patch

on:
  push:
    paths:
      - 'chatgpt-portable-0.1.26/**'
      - '.github/workflows/test-chatgpt-portable-0.1.26-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Electron runtime
        shell: pwsh
        run: |
          $ver='46.0.0-nightly.20261016'
          $url="https://github.com/electron/nightlies/releases/download/v$ver/electron-v$ver-win32-x64.zip"
          Invoke-WebRequest $url -OutFile electron.zip
          $sha=(Get-FileHash electron.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '1d986c61270c82d205bb658153dff2f7850bd4ad702ef335e367dc0a7359f4a8') { throw "ZIP SHA mismatch $sha" }
          Expand-Archive electron.zip runtime
          $exeSha=(Get-FileHash runtime/electron.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeSha -ne '5008929104e3514ecfe5975ea6baa31b68607e898e0b0236733fa388dfc6d61b') { throw "EXE SHA mismatch $exeSha" }

      - name: Prepare exact patch payload and two portable inputs
        shell: pwsh
        run: |
          $payload='chatgpt-portable-0.1.26'
          New-Item -ItemType Directory -Force "$payload/App" | Out-Null
          Set-Content -LiteralPath "$payload/App/main.js" -Encoding utf8 -Value "const APP_VERSION = '0.1.26';"
          Set-Content -LiteralPath "$payload/App/preload.js" -Encoding utf8 -Value "console.log('preload-native-chromium-drop-v4-native-dragenter-delegate-installed');"
          Set-Content -LiteralPath "$payload/App/package.json" -Encoding utf8 -Value '{"version":"0.1.26"}'
          foreach($name in @('original','from0125')) {
            New-Item -ItemType Directory -Force "test/$name/resources/app" | Out-Null
            Copy-Item runtime/electron.exe "test/$name/ChatGPT Portable.exe"
          }
          # Reproduce exact 0.1.25 two-byte patch on second input.
          $p='test/from0125/ChatGPT Portable.exe'
          $fs=[IO.File]::Open($p,[IO.FileMode]::Open,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
          try { [void]$fs.Seek(0xA38EB2F,[IO.SeekOrigin]::Begin); $fs.WriteByte(0xB1); $fs.WriteByte(0x01); $fs.Flush($true) } finally { $fs.Dispose() }
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '5ef1227723cacd884b433e34589c2b63fd70bb30753cad18c0a60344dde6aa88'){ throw "0.1.25 reproduction SHA mismatch $sha" }

      - name: Parse exact PowerShell script
        shell: pwsh
        run: |
          $path='chatgpt-portable-0.1.26/PATCH-0.1.25-TO-0.1.26.ps1'
          $errors=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)
          if($errors.Count){ $errors | Format-List | Out-String | Write-Host; throw 'Parser errors' }

      - name: Apply over original runtime
        shell: pwsh
        run: |
          & ./chatgpt-portable-0.1.26/PATCH-0.1.25-TO-0.1.26.ps1 -PortablePath (Resolve-Path test/original)
          if($LASTEXITCODE -ne 0){ throw "patch exit $LASTEXITCODE" }
          $sha=(Get-FileHash 'test/original/ChatGPT Portable.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'){ throw "result SHA mismatch $sha" }

      - name: Apply over 0.1.25 runtime
        shell: pwsh
        run: |
          & ./chatgpt-portable-0.1.26/PATCH-0.1.25-TO-0.1.26.ps1 -PortablePath (Resolve-Path test/from0125)
          if($LASTEXITCODE -ne 0){ throw "patch exit $LASTEXITCODE" }
          $sha=(Get-FileHash 'test/from0125/ChatGPT Portable.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'){ throw "result SHA mismatch $sha" }

      - name: Verify bytes and idempotence
        shell: pwsh
        run: |
          foreach($root in @('test/original','test/from0125')) {
            $p="$root/ChatGPT Portable.exe"
            $b=[IO.File]::ReadAllBytes($p)
            $entry=(($b[0xA38EAE0..0xA38EAE4] | % {$_.ToString('X2')}) -join ' ')
            $old=(($b[0xA38EB2F..0xA38EB30] | % {$_.ToString('X2')}) -join ' ')
            if($entry -ne 'E9 FB 02 00 00'){ throw "entry bytes $entry" }
            if($old -ne '31 C9'){ throw "old patch bytes $old" }
            & ./chatgpt-portable-0.1.26/PATCH-0.1.25-TO-0.1.26.ps1 -PortablePath (Resolve-Path $root)
            $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'){ throw "idempotence SHA mismatch $sha" }
          }
