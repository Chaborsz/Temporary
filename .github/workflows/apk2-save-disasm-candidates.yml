name: APK2 Save Candidate Disassembly

on:
  push:
    paths:
      - '.github/workflows/apk2-save-disasm-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download verified EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern APK2-Win64-Shipping.exe --dir .
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip install --quiet pefile capstone

      - name: Map and disassemble exact candidate VAs
        shell: bash
        run: |
          set -euo pipefail
          cat > disasm.py <<'PY'
          import pefile, struct
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'
          data=Path(fn).read_bytes()
          pe=pefile.PE(fn,fast_load=False)
          ib=pe.OPTIONAL_HEADER.ImageBase
          cands=[
            0x1421deea0,0x143f131a0,0x143f12700,0x143f12380,
            0x143f17ac0,0x143f179c0,0x1434c90f0,
            0x143f12660,0x143f12430,0x143f12560,0x143f17ac0,
          ]
          secs=[]
          for s in pe.sections:
            nm=s.Name.rstrip(b'\0').decode(errors='replace')
            secs.append((nm,s.VirtualAddress,s.PointerToRawData,s.SizeOfRawData,max(s.Misc_VirtualSize,s.SizeOfRawData),s.Characteristics))
          def va2off(va):
            r=va-ib
            for nm,sr,raw,rsz,vsz,ch in secs:
              if sr<=r<sr+vsz:
                d=r-sr
                if d<rsz:return raw+d,nm,ch
            return None,None,None
          def target_desc(va):
            r=va-ib
            for nm,sr,raw,rsz,vsz,ch in secs:
              if sr<=r<sr+vsz:return f'{nm}+0x{r-sr:x}'
            return 'OUTSIDE'
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          out=[]
          out.append(f'IMAGEBASE=0x{ib:x}')
          for va in cands:
            off,sec,ch=va2off(va)
            out.append(f'\n===== CANDIDATE VA=0x{va:x} off={"0x%x"%off if off is not None else "NA"} sec={sec} ch={"0x%x"%ch if ch is not None else "NA"} =====')
            if off is None: continue
            # Print raw bytes at candidate and disassemble starting exactly at candidate.
            out.append('RAW64='+data[off:off+64].hex())
            count=0
            for ins in md.disasm(data[off:off+0x1200],va):
              ann=[]
              if ins.mnemonic.startswith('call') or ins.mnemonic.startswith('j'):
                for op in ins.operands:
                  if op.type==X86_OP_IMM:
                    ann.append('target='+target_desc(op.imm)+f'(0x{op.imm:x})')
              for op in ins.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  tgt=ins.address+ins.size+op.mem.disp
                  ann.append('rip='+target_desc(tgt)+f'(0x{tgt:x})')
              out.append(f'0x{ins.address:016x}: {ins.mnemonic:10} {ins.op_str:45} {" ".join(ann)}')
              count+=1
              if count>=1200:break
              if ins.mnemonic=='ret' and count>10:
                out.append('--- RET boundary ---')
                # continue a little to expose adjacent thunks, but not forever
                if count>250: break
          Path('candidate-disasm.txt').write_text('\n'.join(out),encoding='utf-8')
          print('lines',len(out))
          PY
          python3 disasm.py
          sed -n '1,5000p' candidate-disasm.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apk2-save-candidate-disasm
          path: candidate-disasm.txt
          retention-days: 3
