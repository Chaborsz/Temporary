name: Trace APK2 EncryptKey

on:
  push:
    paths:
      - '.github/workflows/apk2-encryptkey-trace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified executable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/APK2.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  /tmp/APK2.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p /tmp/out

      - name: Trace EncryptKey metadata and candidate code pointers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/out/apk2-encryptkey-trace.txt
          import pefile,struct,bisect
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64

          fn='/tmp/APK2.exe'; b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
            secs.append((s.VirtualAddress,max(s.Misc_VirtualSize,s.SizeOfRawData),s.PointerToRawData,s.SizeOfRawData,s.Name.rstrip(b'\0').decode('ascii','replace'),s.Characteristics))
          def off2va(off):
            for sr,vs,raw,rs,n,ch in secs:
              if raw<=off<raw+rs:return base+sr+(off-raw),n,ch
            return None,None,0
          def va2off(va):
            r=va-base
            for sr,vs,raw,rs,n,ch in secs:
              if sr<=r<sr+rs:return raw+(r-sr)
            return None
          def secinfo(va):
            r=va-base
            for sr,vs,raw,rs,n,ch in secs:
              if sr<=r<sr+vs:return n,ch
            return None,0
          funcs=[]
          for e in getattr(pe,'DIRECTORY_ENTRY_EXCEPTION',[]):
            st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
            if st<en:funcs.append((st,en,e.struct.UnwindData))
          funcs.sort(); starts=[f[0] for f in funcs]
          def containing(va):
            i=bisect.bisect_right(starts,va)-1
            return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64)

          def occurrences(needle):
            out=[]; p=0
            while True:
              i=b.find(needle,p)
              if i<0:break
              out.append(i); p=i+1
            return out

          targets={}
          for label,needle in [('EncryptKey_ASCII',b'EncryptKey\x00'),('UAPKSaveGameManager_UTF16','UAPKSaveGameManager'.encode('utf-16le'))]:
            print(f'=== {label} OCCURRENCES ===')
            for off in occurrences(needle):
              va,sn,ch=off2va(off)
              print(f'{label} file=0x{off:x} va=' + (f'0x{va:x}' if va else 'UNMAPPED') + f' section={sn}')
              if va:targets[va]=label

          # recursively locate absolute qword pointer slots in mapped data
          level=dict(targets); allnodes=dict(targets)
          for depth in range(1,5):
            new={}
            for t,label in level.items():
              pat=struct.pack('<Q',t); p=0
              while True:
                i=b.find(pat,p)
                if i<0:break
                va,sn,ch=off2va(i)
                if va and va not in allnodes and va not in new:
                  new[va]=f'ptr{depth}->{label}'
                  print(f'PTR depth={depth} slot=0x{va:x} file=0x{i:x} section={sn} -> 0x{t:x} {label}')
                p=i+1
            allnodes.update(new); level=new
            print(f'PTR_LEVEL {depth} new={len(new)} total={len(allnodes)}')
            if not new:break

          # descriptor neighborhoods around pointer slots: decode every aligned qword.
          print('\n=== POINTER SLOT NEIGHBORHOODS ===')
          exec_candidates=set()
          for va,label in sorted(allnodes.items()):
            if va in targets:continue
            off=va2off(va)
            if off is None:continue
            print(f'\nNODE 0x{va:x} {label}')
            lo=max(0,off-0x100); hi=min(len(b),off+0x180)
            for qoff in range((lo+7)&~7,hi-7,8):
              val=struct.unpack_from('<Q',b,qoff)[0]
              qva,_,_=off2va(qoff)
              vsn,vch=secinfo(val)
              extra=''
              if vsn:
                extra=f' -> {vsn}'
                if vch & 0x20000000:exec_candidates.add(val)
              if val or abs(qoff-off)<=0x30:
                print(f' Q 0x{qva:x} ({qoff-off:+#x}) = 0x{val:016x}{extra}')

          print('\n=== EXECUTABLE POINTER CANDIDATES FROM DESCRIPTORS ===')
          for va in sorted(exec_candidates):
            f=containing(va); print(f'CAND 0x{va:x} function=' + (f'0x{f[0]:x}-0x{f[1]:x}' if f else 'NO_PDATA'))

          print('\n=== CANDIDATE FUNCTION DISASSEMBLY ===')
          done=set()
          for va in sorted(exec_candidates):
            f=containing(va)
            if not f or f[0] in done or f[1]-f[0]>0x2000:continue
            done.add(f[0]); off=va2off(f[0])
            if off is None:continue
            print(f'\nFUNCTION 0x{f[0]:x}-0x{f[1]:x} seedptr=0x{va:x}')
            for ins in md.disasm(b[off:off+(f[1]-f[0])],f[0]):
              print(f'0x{ins.address:x}: {ins.mnemonic} {ins.op_str}')

          # raw neighborhoods around the two named strings for adjacent metadata/value clues
          print('\n=== RAW/PRINTABLE AROUND NAMED STRINGS ===')
          for va,label in targets.items():
            off=va2off(va); lo=max(0,off-0x200); hi=min(len(b),off+0x400)
            chunk=b[lo:hi]
            print(f'\nTARGET {label} va=0x{va:x} file=0x{off:x}')
            print('HEX',chunk.hex())
            print('ASCII',''.join(chr(x) if 32<=x<127 else '.' for x in chunk))
          PY
          wc -l -c /tmp/out/apk2-encryptkey-trace.txt

      - name: Publish EncryptKey trace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-encryptkey-trace.txt analysis/
          git add analysis/apk2-encryptkey-trace.txt
          git commit -m 'Trace APK2 EncryptKey property' || true
          git push origin HEAD:apk2-analysis-output
