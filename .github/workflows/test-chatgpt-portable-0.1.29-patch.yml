name: Test ChatGPT Portable 0.1.29 native patch

on:
  push:
    paths:
      - 'chatgpt-portable-0.1.29/**'
      - '.github/workflows/test-chatgpt-portable-0.1.29-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Electron runtime
        shell: pwsh
        run: |
          $v='46.0.0-nightly.20261016'
          $u="https://github.com/electron/nightlies/releases/download/v$v/electron-v$v-win32-x64.zip"
          Invoke-WebRequest $u -OutFile electron.zip
          if((Get-FileHash electron.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1d986c61270c82d205bb658153dff2f7850bd4ad702ef335e367dc0a7359f4a8'){throw 'zip sha'}
          Expand-Archive electron.zip runtime
          if((Get-FileHash runtime/electron.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5008929104e3514ecfe5975ea6baa31b68607e898e0b0236733fa388dfc6d61b'){throw 'exe sha'}

      - name: Prepare original and 0.1.25-0.1.28 inputs
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127','p128')){
            New-Item -ItemType Directory -Force "test/$n/resources/app"|Out-Null
            Copy-Item runtime/electron.exe "test/$n/ChatGPT Portable.exe"
          }
          function Patch([string]$p,[Int64]$o,[byte[]]$v){$b=[IO.File]::ReadAllBytes($p);[Array]::Copy($v,0,$b,$o,$v.Length);[IO.File]::WriteAllBytes($p,$b)}
          $p='test/p125/ChatGPT Portable.exe'; Patch $p 0xA38EB2F ([byte[]](0xB1,0x01))
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5ef1227723cacd884b433e34589c2b63fd70bb30753cad18c0a60344dde6aa88'){throw 'p125 sha'}
          $p='test/p126/ChatGPT Portable.exe'; Patch $p 0xA38EAE0 ([byte[]](0xE9,0xFB,0x02,0x00,0x00)); Patch $p 0xA38EB2F ([byte[]](0x31,0xC9))
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'){throw 'p126 sha'}
          $p='test/p127/ChatGPT Portable.exe'; Patch $p 0x6F80B70 ([byte[]](0x44,0x89,0xF3,0x83,0xE3,0x01))
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0c9be9f4d51978180afe65907401a6ee36f169b0615e99a36766287a2de7c8c8'){throw 'p127 sha'}
          $p='test/p128/ChatGPT Portable.exe'; Patch $p 0xA38EB2F ([byte[]](0xB1,0x01)); Patch $p 0xA38EE6D ([byte[]](0xE9,0x9E,0xF8,0xFF,0xFF,0x90,0x90,0x90,0x90)); Patch $p 0xA38E710 ([byte[]](0x8B,0x44,0x24,0x20,0x85,0xF6,0x0F,0x44,0xF0,0x89,0xF0,0xE9,0x56,0x07,0x00,0x00))
          if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd65be021ea56ff04228ee0780e7685cbe67db838cd7c331294729f641b07591f'){throw 'p128 sha'}

      - name: Parse exact PowerShell
        shell: pwsh
        run: |
          $e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'chatgpt-portable-0.1.29/PATCH-TO-0.1.29.ps1'),[ref]$null,[ref]$e)
          if($e.Count){$e|Format-List|Out-String|Write-Host;throw 'parser'}

      - name: Apply all supported inputs and verify exact result
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127','p128')){
            & ./chatgpt-portable-0.1.29/PATCH-TO-0.1.29.ps1 -PortablePath (Resolve-Path "test/$n")
            $p="test/$n/ChatGPT Portable.exe"
            $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne 'e62e5092c8650c2029d7fbc78ed09fbd2bb9f94ad6632d52b988b3f22b49f657'){throw "$n final $sha"}
            $b=[IO.File]::ReadAllBytes($p)
            $h=(($b[0xA38EE63..0xA38EE67]|%{$_.ToString('X2')}) -join ' ');if($h -ne 'E9 A8 F8 FF FF'){throw "$n hook $h"}
            $c1=(($b[0xA38E710..0xA38E71F]|%{$_.ToString('X2')}) -join ' ');if($c1 -ne '8B 87 C8 00 00 00 85 F6 0F 44 F0 E9 90 3D 00 00'){throw "$n cave1 $c1"}
            $c2=(($b[0xA3924B0..0xA3924BF]|%{$_.ToString('X2')}) -join ' ');if($c2 -ne '48 8D 4C 24 50 E9 AE C9 FF FF CC CC CC CC CC CC'){throw "$n cave2 $c2"}
            & ./chatgpt-portable-0.1.29/PATCH-TO-0.1.29.ps1 -PortablePath (Resolve-Path "test/$n")
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e62e5092c8650c2029d7fbc78ed09fbd2bb9f94ad6632d52b988b3f22b49f657'){throw "$n idempotence"}
          }
