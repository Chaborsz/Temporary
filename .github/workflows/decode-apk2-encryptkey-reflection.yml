name: Decode APK2 EncryptKey reflection

on:
  push:
    paths:
      - '.github/workflows/decode-apk2-encryptkey-reflection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified executable and decode reflection records
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' \
            -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-encryptkey-reflection
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect,json,string
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-encryptkey-reflection')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,
                           'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,
                           'name':s.Name.rstrip(b'\0').decode('ascii','replace')})
          def off2va(off):
              for s in secs:
                  if s['raw']<=off<s['raw']+s['sz']:
                      return base+s['rva']+(off-s['raw']),s['name']
              return None,None
          def va2off(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:
                      return s['raw']+(r-s['rva'])
              return None
          def sec_for_va(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']: return s['name']
              return None
          def read_cstr_va(va,limit=160):
              off=va2off(va)
              if off is None:return None
              raw=b[off:off+limit].split(b'\0',1)[0]
              if len(raw)<2:return None
              if all(32<=x<127 for x in raw):
                  try:return raw.decode('ascii')
                  except:return None
              return None
          def read_wstr_va(va,limit_chars=100):
              off=va2off(va)
              if off is None:return None
              chars=[]
              for i in range(limit_chars):
                  if off+2*i+1>=len(b):break
                  x=b[off+2*i]; y=b[off+2*i+1]
                  if x==0 and y==0:break
                  if y!=0 or not (32<=x<127):return None
                  chars.append(chr(x))
              return ''.join(chars) if len(chars)>=2 else None

          ranges=[
              ('PROP_DESCRIPTOR',0xa1dde30,0xa1ddf50),
              ('PROP_POINTER_ARRAY',0xa1dda20,0xa1deb20),
              ('CLASS_PARAMS',0xa1ded80,0xa1def40),
              ('CLASS_DATA2_PTR',0xb1ed180,0xb1ed480),
          ]
          with (out/'hex_dump.txt').open('w') as f:
              for name,lo,hi in ranges:
                  f.write(f'\n===== {name} file 0x{lo:x}-0x{hi:x} =====\n')
                  for p in range(lo,hi,16):
                      chunk=b[p:p+16]; asc=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
                      f.write(f'{p:08x}  {chunk.hex(" "):47s}  {asc}\n')

          with (out/'typed_dump.txt').open('w') as f:
              for name,lo,hi in ranges:
                  f.write(f'\n===== {name} =====\n')
                  start=lo-(lo%8)
                  for p in range(start,hi,8):
                      q=struct.unpack_from('<Q',b,p)[0]
                      d0,d1=struct.unpack_from('<II',b,p)
                      w0,w1,w2,w3=struct.unpack_from('<HHHH',b,p)
                      va,sec=off2va(p)
                      annot=[]
                      qsec=sec_for_va(q)
                      if qsec:
                          annot.append(f'PTR->{qsec}')
                          a=read_cstr_va(q); w=read_wstr_va(q)
                          if a:annot.append('ASCII='+repr(a))
                          if w:annot.append('WIDE='+repr(w))
                      f.write(f'file=0x{p:x} va={hex(va) if va else "NONE"} q=0x{q:016x} d=[0x{d0:08x},0x{d1:08x}] w=[{w0:#06x},{w1:#06x},{w2:#06x},{w3:#06x}] {" | ".join(annot)}\n')

          # Dump all absolute inbound pointers to descriptor-chain nodes with context.
          nodes={0x14a1d45f8:'EncryptKey_string',0x14a1dead0:'EncryptKey_descriptor',
                 0x14a1dea78:'EncryptKey_prop_array',0x14a1dee08:'EncryptKey_class_params',
                 0x14a1d45d0:'UAPKSaveGameManager_string',0x14b1edee0:'UAPKSaveGameManager_data2_slot'}
          inbound=[]
          for va,nm in nodes.items():
              needle=struct.pack('<Q',va); p=0
              while True:
                  i=b.find(needle,p)
                  if i<0:break
                  iva,isec=off2va(i); inbound.append((nm,va,i,iva,isec));p=i+1
          with (out/'inbound_pointers.txt').open('w') as f:
              for nm,tva,off,iva,isec in sorted(inbound,key=lambda x:x[2]):
                  f.write(f'target={nm}@0x{tva:x} file=0x{off:x} slot_va={hex(iva) if iva else "NONE"} section={isec}\n')

          # Locate nearby executable function pointers in class data2 neighborhood.
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
              if st<en:funcs.append((st,en))
          funcs=sorted(set(funcs)); starts=[a for a,b2 in funcs]
          fset=set(starts)
          def cfunc(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          fp=[]
          lo,hi=0xb1ed000,0xb1ee400
          for p in range(lo,hi-7,8):
              q=struct.unpack_from('<Q',b,p)[0]
              if q in fset:
                  iva,isec=off2va(p); fp.append((p,iva,isec,q,cfunc(q)))
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          with (out/'nearby_function_pointers.txt').open('w') as f:
              for p,iva,isec,q,fr in fp:
                  f.write(f'slot_file=0x{p:x} slot_va=0x{iva:x} section={isec} -> function=0x{q:x}-0x{fr[1]:x}\n')
                  off=va2off(q)
                  if off is None:continue
                  ins=list(md.disasm(b[off:off+min(fr[1]-q,0x180)],q))
                  for x in ins[:40]: f.write(f'  0x{x.address:x}: {x.mnemonic:9s} {x.op_str}\n')

          # Search for integer fields in descriptor likely to be plausible UObject offsets.
          # Report every aligned uint16/uint32 in the descriptor region in a useful range.
          with (out/'offset_candidates.txt').open('w') as f:
              for p in range(0xa1dde80,0xa1deb20,2):
                  u16=struct.unpack_from('<H',b,p)[0]
                  if 0x20 <= u16 <= 0x1000:
                      va,_=off2va(p)
                      f.write(f'u16 file=0x{p:x} va=0x{va:x} value=0x{u16:x} ({u16})\n')
              f.write('\nUINT32\n')
              for p in range(0xa1dde80,0xa1deb20,4):
                  u32=struct.unpack_from('<I',b,p)[0]
                  if 0x20 <= u32 <= 0x1000:
                      va,_=off2va(p)
                      f.write(f'u32 file=0x{p:x} va=0x{va:x} value=0x{u32:x} ({u32})\n')
          PY
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-encryptkey-reflection
          git commit -m 'Decode APK2 EncryptKey reflection metadata' || exit 0
          git pull --rebase origin main
          git push origin main
