name: Test ChatGPT Portable 0.1.30 native patch

on:
  push:
    paths:
      - 'chatgpt-portable-0.1.30/**'
      - '.github/workflows/test-chatgpt-portable-0.1.30-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Electron runtime
        shell: pwsh
        run: |
          $v='46.0.0-nightly.20261016'
          $u="https://github.com/electron/nightlies/releases/download/v$v/electron-v$v-win32-x64.zip"
          Invoke-WebRequest $u -OutFile electron.zip
          if((Get-FileHash electron.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1d986c61270c82d205bb658153dff2f7850bd4ad702ef335e367dc0a7359f4a8'){throw 'zip sha'}
          Expand-Archive electron.zip runtime
          if((Get-FileHash runtime/electron.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5008929104e3514ecfe5975ea6baa31b68607e898e0b0236733fa388dfc6d61b'){throw 'exe sha'}

      - name: Prepare exact patch payload and supported runtime inputs
        shell: pwsh
        run: |
          $payload='chatgpt-portable-0.1.30'
          New-Item -ItemType Directory -Force "$payload/App" | Out-Null
          Set-Content -LiteralPath "$payload/App/main.js" -Encoding utf8 -Value "const APP_VERSION = '0.1.30';"
          Set-Content -LiteralPath "$payload/App/preload.js" -Encoding utf8 -Value "console.log('preload-native-chromium-drop-v8-current-drag-state-seed-installed');"
          Set-Content -LiteralPath "$payload/App/package.json" -Encoding utf8 -Value '{"version":"0.1.30"}'
          foreach($n in @('orig','p125','p126','p127','p128','p129')){
            New-Item -ItemType Directory -Force "test/$n/resources/app" | Out-Null
            Copy-Item runtime/electron.exe "test/$n/ChatGPT Portable.exe"
          }
          function Put([byte[]]$b,[Int64]$o,[byte[]]$v){[Array]::Copy($v,0,$b,$o,$v.Length)}
          function SaveCheck([string]$n,[byte[]]$b,[string]$sha){
            $p="test/$n/ChatGPT Portable.exe";[IO.File]::WriteAllBytes($p,$b)
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne $sha){throw "$n reproduction $h"}
          }
          $orig=[IO.File]::ReadAllBytes('runtime/electron.exe')
          $b=[byte[]]$orig.Clone();Put $b 0xA38EB2F ([byte[]](0xB1,0x01));SaveCheck 'p125' $b '5ef1227723cacd884b433e34589c2b63fd70bb30753cad18c0a60344dde6aa88'
          $b=[byte[]]$orig.Clone();Put $b 0xA38EAE0 ([byte[]](0xE9,0xFB,0x02,0x00,0x00));Put $b 0xA38EB2F ([byte[]](0x31,0xC9));SaveCheck 'p126' $b 'a34d64d7af007b1a1068bc7694f86c0023d247c0f2a2dd8888d8c0eeddee4e6f'
          $b=[byte[]]$orig.Clone();Put $b 0x6F80B70 ([byte[]](0x44,0x89,0xF3,0x83,0xE3,0x01));SaveCheck 'p127' $b '0c9be9f4d51978180afe65907401a6ee36f169b0615e99a36766287a2de7c8c8'
          $b=[byte[]]$orig.Clone();Put $b 0xA38EB2F ([byte[]](0xB1,0x01));Put $b 0xA38EE6D ([byte[]](0xE9,0x9E,0xF8,0xFF,0xFF,0x90,0x90,0x90,0x90));Put $b 0xA38E710 ([byte[]](0x8B,0x44,0x24,0x20,0x85,0xF6,0x0F,0x44,0xF0,0x89,0xF0,0xE9,0x56,0x07,0x00,0x00));SaveCheck 'p128' $b 'd65be021ea56ff04228ee0780e7685cbe67db838cd7c331294729f641b07591f'
          $b=[byte[]]$orig.Clone();Put $b 0xA38EB2F ([byte[]](0xB1,0x01));Put $b 0xA38EE63 ([byte[]](0xE9,0xA8,0xF8,0xFF,0xFF));Put $b 0xA38E710 ([byte[]](0x8B,0x87,0xC8,0x00,0x00,0x00,0x85,0xF6,0x0F,0x44,0xF0,0xE9,0x90,0x3D,0x00,0x00));Put $b 0xA3924B0 ([byte[]](0x48,0x8D,0x4C,0x24,0x50,0xE9,0xAE,0xC9,0xFF,0xFF,0xCC,0xCC,0xCC,0xCC,0xCC,0xCC));SaveCheck 'p129' $b 'e62e5092c8650c2029d7fbc78ed09fbd2bb9f94ad6632d52b988b3f22b49f657'

      - name: Parse exact PowerShell patch
        shell: pwsh
        run: |
          $e=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'chatgpt-portable-0.1.30/PATCH-TO-0.1.30.ps1'),[ref]$null,[ref]$e)
          if($e.Count){$e|Format-List|Out-String|Write-Host;throw 'parser errors'}

      - name: Apply all supported inputs and verify exact result
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127','p128','p129')){
            & ./chatgpt-portable-0.1.30/PATCH-TO-0.1.30.ps1 -PortablePath (Resolve-Path "test/$n")
            $p="test/$n/ChatGPT Portable.exe"
            $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne '717355b1e73100c8ef481607cf9831ac7deae47110b836b91729655750c8f48a'){throw "$n final $sha"}
            $b=[IO.File]::ReadAllBytes($p)
            $enter=(($b[0xA38EB2F..0xA38EB30]|%{$_.ToString('X2')}) -join ' ');if($enter -ne 'B1 01'){throw "$n enter $enter"}
            $hook=(($b[0x6F800A8..0x6F800AC]|%{$_.ToString('X2')}) -join ' ');if($hook -ne 'E9 D3 1D 21 FD'){throw "$n state hook $hook"}
            $cave=(($b[0x4191E80..0x4191E9A]|%{$_.ToString('X2')}) -join ' ');if($cave -ne '41 8B 4E 10 83 E1 01 89 88 00 03 00 00 4D 85 E4 0F 84 2C E2 DE 02 E9 12 E2 DE 02'){throw "$n state cave $cave"}
            $over=(($b[0xA38EE63..0xA38EE67]|%{$_.ToString('X2')}) -join ' ');if($over -ne '48 8D 4C 24 50'){throw "$n over hook not original $over"}
            $conv=(($b[0xA38EE6D..0xA38EE75]|%{$_.ToString('X2')}) -join ' ');if($conv -ne '89 F1 E8 1C 07 00 00 89 C6'){throw "$n over conv not original $conv"}
            $upd=(($b[0x6F80B70..0x6F80B75]|%{$_.ToString('X2')}) -join ' ');if($upd -ne '8B 98 00 03 00 00'){throw "$n update not original $upd"}
          }

      - name: Verify idempotence
        shell: pwsh
        run: |
          foreach($n in @('orig','p125','p126','p127','p128','p129')){
            & ./chatgpt-portable-0.1.30/PATCH-TO-0.1.30.ps1 -PortablePath (Resolve-Path "test/$n")
            $sha=(Get-FileHash "test/$n/ChatGPT Portable.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne '717355b1e73100c8ef481607cf9831ac7deae47110b836b91729655750c8f48a'){throw "$n idempotence $sha"}
          }
