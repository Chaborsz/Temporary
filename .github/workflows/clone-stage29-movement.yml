name: Clone Stage29 - per-object movement audit
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/clone_mode/audit_movement_stage29.py"
      - ".github/workflows/clone-stage29-movement.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pefile==2024.8.26 capstone==5.0.6
      - run: python experiments/clone_mode/audit_movement_stage29.py
