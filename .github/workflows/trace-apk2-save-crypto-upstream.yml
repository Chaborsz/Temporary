name: Trace APK2 save crypto upstream

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-save-crypto-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and trace upstream
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-crypto-upstream
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          fn='APK2-Win64-Shipping.exe';out=Path('analysis-results/apk2-save-crypto-upstream')
          b=Path(fn).read_bytes();pe=pefile.PE(fn,fast_load=False);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
            secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(v):
            r=v-base
            for s in secs:
              if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def off2va(o):
            for s in secs:
              if s['raw']<=o<s['raw']+s['sz']:return base+s['rva']+(o-s['raw']),s['name']
          def cstr(v,lim=220):
            o=va2off(v)
            if o is None:return None
            x=b[o:o+lim].split(b'\0',1)[0]
            return x.decode('ascii','replace') if len(x)>1 and all(32<=c<127 for c in x) else None
          def wstr(v,lim=120):
            o=va2off(v)
            if o is None:return None
            z=[]
            for i in range(lim):
              if o+2*i+1>=len(b):break
              a,c=b[o+2*i],b[o+2*i+1]
              if a==0 and c==0:break
              if c or not 32<=a<127:return None
              z.append(chr(a))
            return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
            a=base+e.struct.BeginAddress;z=base+e.struct.EndAddress
            if a<z:funcs.append((a,z))
          funcs=sorted(set(funcs));starts=[a for a,z in funcs]
          def cf(v):
            i=bisect.bisect_right(starts,v)-1
            return funcs[i] if i>=0 and funcs[i][0]<=v<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          targets={0x14582d7da:'ENCRYPT_TASK_BODY',0x145846fe0:'ENCRYPT_WRAPPER',0x14582ca20:'CRYPTO_PARAM_CTOR',0x14582caa0:'ENCRYPT_HELPER',0x14582ce60:'DECRYPT_HELPER'}
          hits=[]
          for s in secs:
            if not(s['ch']&0x20000000):continue
            blob=b[s['raw']:s['raw']+s['sz']];sv=base+s['rva'];p=0
            while True:
              i=blob.find(b'\xe8',p)
              if i<0:break
              if i+5<=len(blob):
                rel=struct.unpack_from('<i',blob,i+1)[0];src=sv+i;dst=src+5+rel
                if dst in targets:hits.append((src,dst,targets[dst],cf(src)))
              p=i+1
          groups={}
          for h in hits:
            if h[3]:groups.setdefault(h[3],[]).append(h)
          with (out/'direct_upstream.txt').open('w',encoding='utf-8') as f:
            f.write(f'HITS={len(hits)} FUNCTIONS={len(groups)}\n')
            for (st,en),hs in sorted(groups.items()):
              o=va2off(st)
              if o is None or en-st>0x20000:continue
              ins=list(md.disasm(b[o:o+(en-st)],st));hm={x[0]:x for x in hs};hitadd=[x[0] for x in hs]
              f.write(f'\n===== FUNC 0x{st:x}-0x{en:x} size=0x{en-st:x} HITS={[(hex(a),nm) for a,d,nm,_ in hs]} =====\n')
              for x in ins:
                if not any(abs(x.address-h)<0x280 for h in hitadd):continue
                ann=[]
                if x.address in hm:ann.append('TARGET_CALL='+hm[x.address][2])
                if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                for op in x.operands:
                  if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                    d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d)
                    if a:ann.append('ASCII='+repr(a))
                    if w:ann.append('WIDE='+repr(w))
                  if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38,0x480,0x488):ann.append(f'DISP=0x{op.mem.disp:x}')
                f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')
          # Dump parameter constructor itself fully.
          fr=cf(0x14582ca20)
          with (out/'param_ctor.txt').open('w',encoding='utf-8') as f:
            f.write(f'PDATA={fr}\n')
            if fr:
              o=va2off(fr[0])
              for x in md.disasm(b[o:o+(fr[1]-fr[0])],fr[0]):
                ann=[]
                if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:ann.append(f'CALL->0x{x.operands[0].imm:x}')
                for op in x.operands:
                  if op.type==X86_OP_MEM and op.mem.disp in (0x8,0x10,0x18,0x20,0x28,0x30,0x38):ann.append(f'FIELD=0x{op.mem.disp:x}')
                f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')
          # Absolute function-pointer references, especially decrypt helper if scheduled via task/vtable.
          with (out/'absolute_function_ptrs.txt').open('w',encoding='utf-8') as f:
            for dst,nm in targets.items():
              nd=struct.pack('<Q',dst);p=0;cnt=0
              while True:
                i=b.find(nd,p)
                if i<0:break
                va,sec=off2va(i);cnt+=1
                f.write(f'{nm} target=0x{dst:x} ptr_file=0x{i:x} ptr_va={hex(va) if va else None} sec={sec}\n')
                if va:
                  lo=max(0,i-0x80);hi=min(len(b),i+0x100)
                  for q in range(lo-(lo%8),hi,8):
                    val=struct.unpack_from('<Q',b,q)[0];qva,qsec=off2va(q);a=cstr(val);w=wstr(val)
                    anns=[]
                    if a:anns.append('ASCII='+repr(a))
                    if w:anns.append('WIDE='+repr(w))
                    if cf(val):anns.append(f'FUNC={cf(val)}')
                    if anns:f.write(f'  slot=0x{qva:x} q=0x{val:x} '+' | '.join(anns)+'\n')
                p=i+1
              f.write(f'{nm}_ABS_PTR_COUNT={cnt}\n')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-crypto-upstream
          git commit -m 'Trace APK2 save crypto upstream' || exit 0
          git pull --rebase origin main
          git push origin main
