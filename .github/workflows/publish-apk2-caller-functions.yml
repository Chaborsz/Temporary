name: Resolve APK2 save xref caller functions

on:
  push:
    paths:
      - '.github/workflows/publish-apk2-caller-functions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch executable and resolve seeded sites through pdata
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' \
            -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-callers
          python3 - <<'PY'
          from pathlib import Path
          import pefile,bisect,json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-save-callers')
          data=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          seeds=[
            0x143e7ea4a,0x143e7ea4b,
            0x143f86151,0x143f86152,0x143f86e94,0x143f86e95,0x143f870b4,0x143f870b5,
            0x143f872d4,0x143f872d5,0x143f874e4,0x143f874e5,
            0x14424d07d,0x14424d07e,0x14424d2bc,0x14424d2bd,
            0x14582c591,0x14582c592,0x14582c75f,0x14582c760,0x14582c961,0x14582c962]
          expected={
            0x143e7ea4a:'SaveGames path',0x143e7ea4b:'SaveGames path',
            0x143f86151:'SaveGameSystem.cpp:124',0x143f86152:'SaveGameSystem.cpp:124',
            0x143f86e94:'SaveGameSystem.cpp:100',0x143f86e95:'SaveGameSystem.cpp:100',
            0x143f870b4:'SaveGameSystem.cpp:72',0x143f870b5:'SaveGameSystem.cpp:72',
            0x143f872d4:'SaveGameSystem.cpp:45',0x143f872d5:'SaveGameSystem.cpp:45',
            0x143f874e4:'SaveGameSystem.cpp:18',0x143f874e5:'SaveGameSystem.cpp:18',
            0x14424d07d:'SaveGameSystemModule',0x14424d07e:'SaveGameSystemModule',
            0x14424d2bc:'SaveGameSystemModule',0x14424d2bd:'SaveGameSystemModule',
            0x14582c591:'SEGA save path',0x14582c592:'SEGA save path',
            0x14582c75f:'SaveGames path',0x14582c760:'SaveGames path',
            0x14582c961:'SEGA save path',0x14582c962:'SEGA save path'}
          target_vas={
            0x149b18590:'SaveGames path',0x149b30ff0:'SaveGameSystem.cpp:18',0x149b30f30:'SaveGameSystem.cpp:45',
            0x149b31170:'SaveGameSystem.cpp:72',0x149b310b0:'SaveGameSystem.cpp:100',0x149b31350:'SaveGameSystem.cpp:124',
            0x149bcd740:'SaveGameSystemModule',0x14a4576a0:'SEGA save path'}
          secs=[]
          for s in pe.sections:
              secs.append((s.PointerToRawData,s.SizeOfRawData,s.VirtualAddress,s.Name.rstrip(b'\0').decode('ascii','replace')))
          def va2off(va):
              r=va-base
              for raw,sz,rva,nm in secs:
                  if rva<=r<rva+sz:return raw+(r-rva)
              return None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
              if st<en: funcs.append((st,en))
          funcs=sorted(set(funcs)); starts=[a for a,b in funcs]
          def cfunc(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          groups={}
          for s in seeds:
              groups.setdefault(cfunc(s),[]).append(s)
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          summaries=[]
          with (out/'functions.txt').open('w',encoding='utf-8') as f:
              for fr,ss in sorted(groups.items(), key=lambda x:(x[0] or (1<<64,))[0]):
                  if fr is None:
                      f.write('\n===== NO_PDATA '+','.join(hex(x) for x in ss)+' =====\n'); continue
                  st,en=fr; off=va2off(st)
                  f.write(f'\n===== FUNCTION 0x{st:x}-0x{en:x} size=0x{en-st:x} seeds={",".join(hex(x) for x in ss)} =====\n')
                  insns=list(md.disasm(data[off:off+(en-st)],st)) if off is not None else []
                  boundaries={i.address for i in insns}
                  valid=[s for s in ss if s in boundaries]
                  invalid=[s for s in ss if s not in boundaries]
                  f.write('VALID_INSN_SEEDS='+','.join(hex(x) for x in valid)+'\n')
                  f.write('INVALID_SHIFTED_SEEDS='+','.join(hex(x) for x in invalid)+'\n')
                  calls=[]; refs=[]
                  for ins in insns:
                      mark=''
                      if ins.address in ss: mark+=' <== SEEDED_XREF '+expected.get(ins.address,'')
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              dst=ins.address+ins.size+op.mem.disp
                              if dst in target_vas:
                                  mark+=f' <== VERIFIED_RIP_REF {target_vas[dst]}@0x{dst:x}'
                                  refs.append((ins.address,dst,target_vas[dst]))
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          calls.append(ins.operands[0].imm)
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:9s} {ins.op_str}{mark}\n')
                  f.write('CALL_TARGETS='+','.join(hex(x) for x in sorted(set(calls)))+'\n')
                  f.write('VERIFIED_TARGET_REFS='+','.join(f'{hex(a)}->{nm}@{hex(d)}' for a,d,nm in refs)+'\n')
                  summaries.append({'start':hex(st),'end':hex(en),'size':en-st,'valid_seeds':[hex(x) for x in valid],
                                    'invalid_seeds':[hex(x) for x in invalid],
                                    'refs':[{'insn':hex(a),'dst':hex(d),'name':nm} for a,d,nm in refs],
                                    'calls':[hex(x) for x in sorted(set(calls))]})
          (out/'summary.json').write_text(json.dumps(summaries,indent=2),encoding='utf-8')
          print(json.dumps(summaries,indent=2))
          PY
      - name: Commit reports robustly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-callers
          git commit -m 'Resolve APK2 save caller functions' || exit 0
          git pull --rebase origin main
          git push origin main
