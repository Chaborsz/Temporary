name: APK2 targeted save callgraph

on:
  push:
    paths:
      - '.github/workflows/apk2-targeted-callgraph.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch verified executable and tooling
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/APK2.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  /tmp/APK2.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone

      - name: Map xrefs to exact x64 runtime functions and recurse direct calls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          python3 - <<'PY' > /tmp/out/apk2-targeted-callgraph.txt
          import pefile, struct, bisect
          from pathlib import Path
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM

          fn='/tmp/APK2.exe'
          blob=Path(fn).read_bytes()
          pe=pefile.PE(fn, fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase

          seeds={
            0x14582c591:'SEGA_PATH_XREF_A',
            0x14582c961:'SEGA_PATH_XREF_B',
            0x143e7ea4a:'SAVEGAMES_PATH_XREF_A',
            0x14582c75f:'SAVEGAMES_PATH_XREF_B',
            0x143f86151:'SAVEGAMESYSTEM_CPP_124',
            0x143f86e94:'SAVEGAMESYSTEM_CPP_100',
            0x143f870b4:'SAVEGAMESYSTEM_CPP_72',
            0x143f872d4:'SAVEGAMESYSTEM_CPP_45',
            0x143f874e4:'SAVEGAMESYSTEM_CPP_18',
            0x14424d07d:'SAVEGAMESYSTEMMODULE_A',
            0x14424d2bc:'SAVEGAMESYSTEMMODULE_B',
          }

          sections=[]
          for s in pe.sections:
              sections.append((s.VirtualAddress, max(s.Misc_VirtualSize,s.SizeOfRawData), s.PointerToRawData, s.SizeOfRawData, s.Name.rstrip(b'\0').decode('ascii','replace'), s.Characteristics))
          def va_to_off(va):
              rva=va-base
              for srva,vsz,raw,rawsz,n,ch in sections:
                  if srva <= rva < srva+rawsz:
                      return raw+(rva-srva)
              return None
          def section_of_va(va):
              rva=va-base
              for srva,vsz,raw,rawsz,n,ch in sections:
                  if srva <= rva < srva+vsz:return n,ch
              return None,0

          funcs=[]
          if hasattr(pe,'DIRECTORY_ENTRY_EXCEPTION'):
              for e in pe.DIRECTORY_ENTRY_EXCEPTION:
                  st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
                  if st<en: funcs.append((st,en,e.struct.UnwindData))
          funcs.sort(); starts=[x[0] for x in funcs]
          def containing(va):
              i=bisect.bisect_right(starts,va)-1
              if i>=0 and funcs[i][0] <= va < funcs[i][1]:return funcs[i]
              return None
          def exact_func(va):
              i=bisect.bisect_left(starts,va)
              if i<len(funcs) and funcs[i][0]==va:return funcs[i]
              return containing(va)

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          def disasm_func(f):
              st,en,_=f; off=va_to_off(st)
              if off is None:return []
              size=min(en-st,0x20000)
              return list(md.disasm(blob[off:off+size],st))

          print(f'IMAGE_BASE 0x{base:x}')
          print(f'RUNTIME_FUNCTIONS {len(funcs)}')
          print('\n=== SEED FUNCTION MAP ===')
          root_funcs=[]
          for va,name in seeds.items():
              f=containing(va)
              if f:
                  print(f'{name} seed=0x{va:x} function=0x{f[0]:x}-0x{f[1]:x} size=0x{f[1]-f[0]:x} unwind=0x{f[2]:x}')
                  if f[0] not in root_funcs:root_funcs.append(f[0])
              else: print(f'{name} seed=0x{va:x} NO_PDATA_FUNCTION')

          # Direct-call graph up to depth 2 from every distinct seed function.
          seen=set(); frontier=[(x,0,'SEED') for x in root_funcs]
          print('\n=== TARGETED FUNCTIONS + DIRECT CALLS (depth<=2) ===')
          while frontier:
              st,depth,origin=frontier.pop(0)
              if st in seen or depth>2:continue
              seen.add(st); f=exact_func(st)
              if not f:continue
              sec,_=section_of_va(st)
              ins=disasm_func(f)
              print(f'\nFUNCTION start=0x{f[0]:x} end=0x{f[1]:x} size=0x{f[1]-f[0]:x} depth={depth} origin={origin} section={sec}')
              calls=[]
              for x in ins:
                  if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                      dst=x.operands[0].imm
                      dsec,dch=section_of_va(dst)
                      df=containing(dst)
                      if dsec and (dch & 0x20000000):
                          calls.append((x.address,dst,df[0] if df else None,df[1] if df else None,dsec))
              for ca,dst,fs,fe,dsec in calls:
                  if fs:
                      print(f' CALL 0x{ca:x} -> 0x{dst:x} function=0x{fs:x}-0x{fe:x} section={dsec}')
                      if depth<2 and fs not in seen:frontier.append((fs,depth+1,f'0x{f[0]:x}'))
                  else: print(f' CALL 0x{ca:x} -> 0x{dst:x} function=UNKNOWN section={dsec}')
              # full disassembly only for seed/root functions; enough context without exploding output
              if depth==0:
                  print(' DISASM_BEGIN')
                  for x in ins:
                      print(f'  0x{x.address:x}: {x.mnemonic} {x.op_str}')
                  print(' DISASM_END')

          # Find direct CALL sites anywhere in executable sections to each seed function start.
          print('\n=== CALLERS OF SEED FUNCTIONS (E8 rel32 scan) ===')
          targets=set(root_funcs)
          callers=[]
          for srva,vsz,raw,rawsz,n,ch in sections:
              if not (ch & 0x20000000):continue
              secva=base+srva; d=memoryview(blob)[raw:raw+rawsz]
              for i in range(0,max(0,len(d)-5)):
                  if d[i]!=0xE8:continue
                  rel=struct.unpack_from('<i',d,i+1)[0]
                  src=secva+i; dst=src+5+rel
                  if dst in targets:
                      cf=containing(src)
                      callers.append((src,dst,cf[0] if cf else 0,cf[1] if cf else 0,n))
          for src,dst,fs,fe,n in callers:
              print(f'CALLER call=0x{src:x} target=0x{dst:x} caller_function=0x{fs:x}-0x{fe:x} section={n}')
          print('CALLER_COUNT',len(callers))
          PY
          wc -l -c /tmp/out/apk2-targeted-callgraph.txt

      - name: Dump strings surrounding APK save manager metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/out/apk2-save-manager-nearby-strings.txt
          from pathlib import Path
          b=Path('/tmp/APK2.exe').read_bytes()
          center=0x0a1d39d0
          lo=max(0,center-0x18000); hi=min(len(b),center+0x18000)
          rows=[]
          i=lo
          while i<hi:
              if 32<=b[i]<127:
                  j=i
                  while j<hi and 32<=b[j]<127:j+=1
                  if j-i>=3: rows.append((i,'A',b[i:j].decode('ascii','replace')))
                  i=j
              else:i+=1
          for parity in (0,1):
              i=lo+((parity-lo)&1)
              while i+1<hi:
                  if 32<=b[i]<127 and b[i+1]==0:
                      j=i; cc=[]
                      while j+1<hi and 32<=b[j]<127 and b[j+1]==0:
                          cc.append(chr(b[j]));j+=2
                      if len(cc)>=3:rows.append((i,'W',''.join(cc)))
                      i=j
                  else:i+=2
          for off,t,s in sorted(rows):
              print(f'{off:#x}\t{t}\t{s[:500]}')
          PY
          wc -l -c /tmp/out/apk2-save-manager-nearby-strings.txt

      - name: Publish results to analysis branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-targeted-callgraph.txt analysis/
          cp /tmp/out/apk2-save-manager-nearby-strings.txt analysis/
          git add analysis/apk2-targeted-callgraph.txt analysis/apk2-save-manager-nearby-strings.txt
          git commit -m 'Add targeted APK2 save callgraph' || true
          git push origin HEAD:apk2-analysis-output
