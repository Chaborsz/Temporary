name: Clone Stage15 - native spawn and JS entrypoints
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/clone_mode/audit_js_entrypoints.py"
      - "experiments/clone_mode/audit_spawn_abi.py"
      - "experiments/clone_mode/audit_spawn_abi18.py"
      - ".github/workflows/clone-stage15-symbols.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pefile==2024.8.26 capstone==5.0.6
      - run: python experiments/clone_mode/audit_js_entrypoints.py
      - run: python experiments/clone_mode/audit_spawn_abi.py
      - run: python experiments/clone_mode/audit_spawn_abi18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-stage15-exports-${{ github.run_id }}
          path: experiments/clone_mode/analysis/*.json
          retention-days: 7
          if-no-files-found: ignore
