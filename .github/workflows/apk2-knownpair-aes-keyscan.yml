name: APK2 Known-Pair AES Raw Key Scan

on:
  push:
    paths:
      - '.github/workflows/apk2-knownpair-aes-keyscan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        bits: [128, 192, 256]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download verified APK2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern APK2-Win64-Shipping.exe --dir .
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -

      - name: Build known-pair scanner
        env:
          BITS: ${{ matrix.bits }}
        shell: bash
        run: |
          cat > scan.c <<'C'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <openssl/aes.h>
          #ifndef BITS
          #error BITS required
          #endif
          #define KEYLEN (BITS/8)
          static const unsigned char ct[16]={0xb3,0x31,0x9b,0x16,0x1c,0x89,0x0f,0xd7,0x67,0xe9,0x33,0xd0,0x80,0x74,0x3a,0xc6};
          static const unsigned char pt[16]={0x0d,0x00,0x00,0x00,0x42,0x6f,0x6f,0x6c,0x50,0x72,0x6f,0x70,0x65,0x72,0x74,0x79};
          static void hx(const unsigned char*p,size_t n){for(size_t i=0;i<n;i++)printf("%02x",p[i]);}
          int main(int argc,char**argv){
            int fd=open(argv[1],O_RDONLY);struct stat st;fstat(fd,&st);size_t n=st.st_size;
            unsigned char*b=mmap(NULL,n,PROT_READ,MAP_PRIVATE,fd,0);if(b==MAP_FAILED)return 2;
            AES_KEY k;unsigned char out[16];unsigned long long hits=0,tested=0;
            for(size_t off=0;off+KEYLEN<=n;off++){
              AES_set_decrypt_key(b+off,BITS,&k);AES_decrypt(ct,out,&k);tested++;
              if(!memcmp(out,pt,16)){printf("AES%d HIT off=0x%zx key=",BITS,off);hx(b+off,KEYLEN);puts("");fflush(stdout);hits++;}
              if((off&0x3ffffff)==0)fprintf(stderr,"AES%d progress=0x%zx tested=%llu hits=%llu\n",BITS,off,tested,hits);
            }
            fprintf(stderr,"AES%d DONE size=%zu tested=%llu hits=%llu\n",BITS,n,tested,hits);return 0;
          }
          C
          gcc -O3 -march=native -Wno-deprecated-declarations -DBITS=$BITS scan.c -lcrypto -o scan

      - name: Scan every byte offset
        env:
          BITS: ${{ matrix.bits }}
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f 'ELAPSED=%e CPU=%P MAXRSS=%MKB' ./scan APK2-Win64-Shipping.exe > "knownpair-aes${BITS}-hits.txt" 2> "knownpair-aes${BITS}.log"
          cat "knownpair-aes${BITS}.log"
          cat "knownpair-aes${BITS}-hits.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-knownpair-aes${{ matrix.bits }}-keyscan
          path: |
            knownpair-aes${{ matrix.bits }}-hits.txt
            knownpair-aes${{ matrix.bits }}.log
          retention-days: 3
