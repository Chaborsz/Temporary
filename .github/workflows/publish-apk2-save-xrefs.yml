name: Publish APK2 save xref analysis

on:
  push:
    paths:
      - '.github/workflows/publish-apk2-save-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified executable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' \
            -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save

      - name: Resolve direct and indirect xrefs and containing x64 functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile, struct, bisect, json
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64, CS_GRP_CALL, CS_GRP_JUMP
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP

          FN='APK2-Win64-Shipping.exe'
          OUT=Path('analysis-results/apk2-save')
          data=Path(FN).read_bytes()
          pe=pefile.PE(FN, fast_load=False)
          base=pe.OPTIONAL_HEADER.ImageBase

          named={
            0x14a4570f8:'DefaultData',
            0x14a1d45d0:'UAPKSaveGameManager',
            0x14a1cf718:'UAPKSaveGameLibrary',
            0x14a1cf7a6:'sUAPKSaveGame',
            0x14a45c290:'SaveGameManager Is Busy No Save',
            0x149b30ee8:'SaveGamePipe',
            0x149bcd740:'SaveGameSystemModule',
            0x14a4576a0:'SEGA save path format',
            0x149b18590:'SaveGames path format',
            0x149b30ff0:'SaveGameSystem.cpp:18',
            0x149b30f30:'SaveGameSystem.cpp:45',
            0x149b31170:'SaveGameSystem.cpp:72',
            0x149b310b0:'SaveGameSystem.cpp:100',
            0x149b31350:'SaveGameSystem.cpp:124',
            0x149ff7e60:'APKSaveGame_SetVersion',
            0x149ff7eb8:'APKSaveGame_SetBroken',
            0x149ff7f10:'APKSaveGame_SetDifferentVersionDataForceLoad',
          }

          secs=[]
          for s in pe.sections:
              secs.append({
                  'raw':s.PointerToRawData,'rawsz':s.SizeOfRawData,
                  'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),
                  'ch':s.Characteristics,
                  'name':s.Name.rstrip(b'\0').decode('ascii','replace')})

          def off2va(off):
              for s in secs:
                  if s['raw'] <= off < s['raw']+s['rawsz']:
                      return base+s['rva']+(off-s['raw']),s['name']
              return None,None

          def va2off(va):
              rva=va-base
              for s in secs:
                  if s['rva'] <= rva < s['rva']+s['rawsz']:
                      return s['raw']+(rva-s['rva'])
              return None

          # x64 exception table gives reliable function boundaries for most compiled functions.
          funcs=[]
          try:
              for e in pe.DIRECTORY_ENTRY_EXCEPTION:
                  st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
                  if st < en:
                      funcs.append((st,en))
          except Exception as exc:
              print('exception directory parse failed',repr(exc))
          funcs=sorted(set(funcs))
          fstarts=[x[0] for x in funcs]

          def containing_func(va):
              i=bisect.bisect_right(fstarts,va)-1
              if i>=0 and funcs[i][0] <= va < funcs[i][1]:
                  return funcs[i]
              return None

          # Find absolute pointers to each target, recursively up to 3 levels.
          targets=dict(named)
          pointer_rows=[]
          for level in range(1,4):
              new={}
              for tva,tname in list(targets.items()):
                  needle=struct.pack('<Q',tva); pos=0
                  while True:
                      off=data.find(needle,pos)
                      if off<0: break
                      sva,sec=off2va(off)
                      if sva is not None:
                          pointer_rows.append((level,sva,tva,tname,sec,off))
                          if sva not in targets and sva not in new:
                              new[sva]=f'ptr{level}->{tname}'
                      pos=off+1
              targets.update(new)
              if not new: break

          with (OUT/'pointer_chain.txt').open('w',encoding='utf-8') as f:
              for level,sva,tva,tname,sec,off in sorted(set(pointer_rows)):
                  f.write(f'level={level} slot=0x{sva:x} -> 0x{tva:x} target={tname} section={sec} file=0x{off:x}\n')
              f.write(f'FINAL_TARGET_COUNT={len(targets)}\n')

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          hits=[]
          # Disassemble executable sections accurately and inspect RIP-relative memory operands.
          for s in secs:
              if not (s['ch'] & 0x20000000) or not s['rawsz']:
                  continue
              blob=data[s['raw']:s['raw']+s['rawsz']]
              secva=base+s['rva']
              for ins in md.disasm(blob,secva):
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          dst=ins.address+ins.size+op.mem.disp
                          if dst in targets:
                              hits.append((ins.address,dst,targets[dst],s['name'],ins.mnemonic,ins.op_str))

          hits=sorted(set(hits))
          with (OUT/'xrefs.txt').open('w',encoding='utf-8') as f:
              f.write(f'XREF_COUNT={len(hits)}\n')
              for src,dst,nm,sec,mn,ops in hits:
                  cf=containing_func(src)
                  fr=f'0x{cf[0]:x}-0x{cf[1]:x}' if cf else 'UNKNOWN'
                  f.write(f'XREF src=0x{src:x} dst=0x{dst:x} target={nm} section={sec} function={fr} :: {mn} {ops}\n')

          hit_funcs={containing_func(h[0]) for h in hits}
          hit_funcs.discard(None)

          # Dump each containing function in full and inventory immediate call targets.
          calls={}
          with (OUT/'xref_functions.txt').open('w',encoding='utf-8') as f:
              for st,en in sorted(hit_funcs):
                  off=va2off(st)
                  if off is None: continue
                  blob=data[off:off+(en-st)]
                  f.write(f'\n===== FUNCTION 0x{st:x}-0x{en:x} size=0x{en-st:x} =====\n')
                  cset=[]
                  for ins in md.disasm(blob,st):
                      marker=''
                      for src,dst,nm,sec,mn,ops in hits:
                          if ins.address==src: marker=f'  <== XREF {nm}'
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:8s} {ins.op_str}{marker}\n')
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==2: # IMM
                          tgt=ins.operands[0].imm
                          cset.append(tgt)
                  calls[(st,en)]=sorted(set(cset))
                  f.write('CALL_TARGETS: '+', '.join(f'0x{x:x}' for x in sorted(set(cset)))+'\n')

          # Dump one hop of called functions, bounded to sane function sizes.
          onehop=[]
          for fr,cset in calls.items():
              for c in cset:
                  cf=containing_func(c)
                  if cf and cf not in hit_funcs and cf not in onehop and 0 < cf[1]-cf[0] <= 0x6000:
                      onehop.append(cf)
          onehop=sorted(onehop)
          with (OUT/'onehop_callees.txt').open('w',encoding='utf-8') as f:
              f.write(f'ONEHOP_FUNCTION_COUNT={len(onehop)}\n')
              for st,en in onehop:
                  off=va2off(st)
                  if off is None: continue
                  f.write(f'\n===== CALLEE 0x{st:x}-0x{en:x} size=0x{en-st:x} =====\n')
                  for ins in md.disasm(data[off:off+(en-st)],st):
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:8s} {ins.op_str}\n')

          summary={
              'image_base':hex(base),
              'exception_function_count':len(funcs),
              'named_target_count':len(named),
              'recursive_target_count':len(targets),
              'xref_count':len(hits),
              'xref_function_count':len(hit_funcs),
              'onehop_function_count':len(onehop),
              'xref_functions':[{'start':hex(a),'end':hex(b),'size':b-a} for a,b in sorted(hit_funcs)]
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit reports to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Publish APK2 save xref analysis'
            git push
          fi
