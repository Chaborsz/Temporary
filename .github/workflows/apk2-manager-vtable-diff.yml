name: APK2 SaveGameManager vtable diff
on:
  push:
    paths: ['.github/workflows/apk2-manager-vtable-diff.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Compare vtables
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/a.exe
          python3 -m pip -q install pefile capstone
          mkdir -p /tmp/out
          python3 - <<'PY' > /tmp/out/apk2-manager-vtable-diff.txt
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM
          b=Path('/tmp/a.exe').read_bytes(); pe=pefile.PE('/tmp/a.exe',fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections: secs.append((s.VirtualAddress,s.SizeOfRawData,s.PointerToRawData,s.Name.rstrip(b'\0').decode('ascii','replace'),s.Characteristics))
          def vo(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return raw+r-sr
          def si(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return n,ch
            return None,0
          fs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
            s=base+e.struct.BeginAddress; e2=base+e.struct.EndAddress
            if s<e2: fs.append((s,e2))
          fs.sort(); starts=[x[0] for x in fs]
          def cf(v):
            i=bisect.bisect_right(starts,v)-1
            return fs[i] if i>=0 and fs[i][0]<=v<fs[i][1] else None
          def q(v): return struct.unpack_from('<Q',b,vo(v))[0]
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          derived=0x14a1deb08; basevt=0x149dd8d58
          print('DERIVED_VTABLE',hex(derived),'BASE_VTABLE',hex(basevt))
          diffs=[]
          for i in range(160):
            dv=q(derived+i*8); bv=q(basevt+i*8); dsn,dch=si(dv); bsn,bch=si(bv)
            if i<8 or dv!=bv:
              print(f'SLOT {i:03d} off=0x{i*8:03x} derived=0x{dv:x} {dsn} base=0x{bv:x} {bsn} same={dv==bv}')
            if dv!=bv and (dch&0x20000000): diffs.append((i,dv,bv))
            # stop after a long non-code tail beyond plausible UObject vtable
            if i>40 and not (dch&0x20000000) and not (bch&0x20000000):
              if all(not(si(q(derived+j*8))[1]&0x20000000) for j in range(i,min(i+5,160))): break
          print('\nDIFF_EXEC_COUNT',len(diffs))
          seen=set()
          for slot,dv,bv in diffs:
            f=cf(dv); key=f[0] if f else dv
            if key in seen: continue
            seen.add(key)
            st=f[0] if f else dv; en=f[1] if f else dv+0x400; o=vo(st)
            print(f'\n=== DERIVED OVERRIDE slot={slot} ptr=0x{dv:x} baseptr=0x{bv:x} func=0x{st:x}-0x{en:x} ===')
            if o is None:continue
            for ins in md.disasm(b[o:o+min(en-st,0x3000)],st):
              tags=[]
              for op in ins.operands:
                if op.type==X86_OP_MEM:
                  disp=op.mem.disp
                  if disp in (0x30,0x38,0x40,0x48,0x4c,0x50): tags.append('MANAGER_FIELD_'+hex(disp))
              print(f'0x{ins.address:x}: {ins.mnemonic} {ins.op_str}'+((' ; '+','.join(tags)) if tags else ''))
          PY
          wc -l -c /tmp/out/apk2-manager-vtable-diff.txt
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-manager-vtable-diff.txt analysis/
          git add analysis/apk2-manager-vtable-diff.txt
          git commit -m 'Compare APK2 save manager vtable' || true
          git push origin HEAD:apk2-analysis-output
