name: Decode UAPKSaveGameManager ClassParams
on:
  push:
    paths: ['.github/workflows/apk2-manager-classparams.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Decode class params
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/a.exe
          python3 -m pip -q install pefile capstone
          mkdir -p /tmp/out
          python3 - <<'PY' > /tmp/out/apk2-manager-classparams.txt
          import pefile,struct,bisect
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          b=Path('/tmp/a.exe').read_bytes(); pe=pefile.PE('/tmp/a.exe',fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections: secs.append((s.VirtualAddress,s.SizeOfRawData,s.PointerToRawData,s.Name.rstrip(b'\0').decode('ascii','replace'),s.Characteristics))
          def vo(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return raw+r-sr
          def si(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return n,ch
            return None,0
          def q(v): return struct.unpack_from('<Q',b,vo(v))[0]
          def u32(v): return struct.unpack_from('<I',b,vo(v))[0]
          def cstr(v,lim=300):
            o=vo(v)
            if o is None:return None
            z=b.find(b'\0',o,o+lim)
            if z<0:z=o+lim
            x=b[o:z]
            try:return x.decode('utf-8')
            except:return repr(x)
          fs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
            s=base+e.struct.BeginAddress;e2=base+e.struct.EndAddress
            if s<e2:fs.append((s,e2))
          fs.sort();ss=[x[0] for x in fs]
          def cf(v):
            i=bisect.bisect_right(ss,v)-1
            return fs[i] if i>=0 and fs[i][0]<=v<fs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64)
          cp=0x14a1dede0
          print(f'CLASSPARAMS 0x{cp:x}')
          labels=['ClassNoRegisterFunc','ClassConfigNameUTF8','CppClassInfo','DependencySingletonFuncArray','FunctionLinkArray','PropertyArray','ImplementedInterfaceArray']
          for i,l in enumerate(labels):
            v=q(cp+i*8); sn,ch=si(v)
            extra=''
            if l=='ClassConfigNameUTF8' and v:extra=f' str={cstr(v)!r}'
            print(f'+0x{i*8:02x} {l}=0x{v:x} sec={sn} exec={bool(ch&0x20000000)}{extra}')
          packed=u32(cp+0x38); flags=u32(cp+0x3c)
          ndeps=packed&0xf; nfunc=(packed>>4)&0x7ff; nprop=(packed>>15)&0x7ff; nint=(packed>>26)&0x3f
          print(f'+0x38 packed=0x{packed:08x} deps={ndeps} funcs={nfunc} props={nprop} interfaces={nint}')
          print(f'+0x3c ClassFlags=0x{flags:08x}')
          print(f'+0x40 q=0x{q(cp+0x40):x}')
          print(f'+0x48 q=0x{q(cp+0x48):x}')
          deps=q(cp+0x18); fi=q(cp+0x20); pa=q(cp+0x28)
          print('\n=== DEPENDENCIES ===')
          for i in range(ndeps):
            fn=q(deps+i*8);print(i,hex(fn),cf(fn))
          print('\n=== FUNCTIONS ===')
          funcs=[]
          for i in range(nfunc):
            fn=q(fi+i*16); nm=q(fi+i*16+8); name=cstr(nm)
            funcs.append((fn,name))
            print(f'{i}: thunk=0x{fn:x} nameptr=0x{nm:x} name={name!r} pdata={cf(fn)}')
          print('\n=== PROPERTIES ===')
          for i in range(nprop):
            d=q(pa+i*8); namep=q(d); rep=q(d+8); pflags=q(d+0x10); typeobj=q(d+0x18); setter=q(d+0x20); getter=q(d+0x28); tail=q(d+0x30)
            # Type/object is packed flags + object flags: low byte EPropertyGenFlags.
            gen=typeobj&0xff; obj=(typeobj>>32)&0xffffffff
            arr=tail&0xffff; off=(tail>>16)&0xffff; nmeta=(tail>>32)&0xffff
            print(f'{i}: desc=0x{d:x} name={cstr(namep)!r} rep=0x{rep:x} PropertyFlags=0x{pflags:016x} GenFlags=0x{gen:02x} ObjectFlags=0x{obj:08x} setter=0x{setter:x} getter=0x{getter:x} ArrayDim={arr} Offset=0x{off:x} NumMeta={nmeta}')
          print('\n=== UFUNCTION THUNK DISASSEMBLY ===')
          for fn,name in funcs:
            f=cf(fn); start=f[0] if f else fn; end=f[1] if f else fn+0x300; o=vo(start)
            print(f'\nFUNCTION {name!r} thunk=0x{fn:x} range=0x{start:x}-0x{end:x}')
            if o is None:continue
            for ins in md.disasm(b[o:o+min(end-start,0x1000)],start): print(f'0x{ins.address:x}: {ins.mnemonic} {ins.op_str}')
          PY
          wc -l -c /tmp/out/apk2-manager-classparams.txt
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-manager-classparams.txt analysis/
          git add analysis/apk2-manager-classparams.txt
          git commit -m 'Decode UAPKSaveGameManager ClassParams' || true
          git push origin HEAD:apk2-analysis-output
