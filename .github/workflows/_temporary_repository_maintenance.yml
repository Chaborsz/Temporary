name: Repository maintenance
on:
  push:
    paths:
      - '.github/workflows/_temporary_repository_maintenance.yml'
permissions:
  actions: write
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove previous cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/42823543911"
          echo 'PRIOR_CLEANUP_RUN_REMOVED'
