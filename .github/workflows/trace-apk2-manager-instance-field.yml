name: Trace APK2 manager instance field

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-manager-instance-field.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find all validated accesses to outer plus 0x488
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-manager-instance-field
          python3 - <<'PY'
          from pathlib import Path
          import pefile,bisect,struct
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM,X86_REG_RIP,X86_OP_IMM

          fn='APK2-Win64-Shipping.exe';out=Path('analysis-results/apk2-manager-instance-field')
          b=Path(fn).read_bytes();pe=pefile.PE(fn,fast_load=False);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def off2va(o):
              for s in secs:
                  if s['raw']<=o<s['raw']+s['sz']:return base+s['rva']+(o-s['raw'])
          def va2off(v):
              r=v-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def cstr(v,lim=160):
              o=va2off(v)
              if o is None:return None
              x=b[o:o+lim].split(b'\0',1)[0]
              return x.decode('ascii','replace') if len(x)>1 and all(32<=c<127 for c in x) else None
          def wstr(v,lim=100):
              o=va2off(v)
              if o is None:return None
              z=[]
              for i in range(lim):
                  if o+2*i+1>=len(b):break
                  a,c=b[o+2*i],b[o+2*i+1]
                  if a==0 and c==0:break
                  if c or not 32<=a<127:return None
                  z.append(chr(a))
              return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              a=base+e.struct.BeginAddress;z=base+e.struct.EndAddress
              if a<z:funcs.append((a,z))
          funcs=sorted(set(funcs));starts=[a for a,z in funcs]
          def cf(v):
              i=bisect.bisect_right(starts,v)-1
              return funcs[i] if i>=0 and funcs[i][0]<=v<funcs[i][1] else None

          # Raw search for little-endian disp32 0x488 / 0x480, then validate via Capstone.
          needle488=struct.pack('<I',0x488);needle480=struct.pack('<I',0x480)
          cand_funcs=set();raw_hits=[]
          for s in secs:
              if not(s['ch']&0x20000000):continue
              blob=b[s['raw']:s['raw']+s['sz']]
              for val,needle in ((0x488,needle488),(0x480,needle480)):
                  p=0
                  while True:
                      i=blob.find(needle,p)
                      if i<0:break
                      # instruction start can be up to ~8 bytes before displacement
                      around=base+s['rva']+max(0,i-8)
                      for delta in range(0,9):
                          v=around+delta;fr=cf(v)
                          if fr:cand_funcs.add(fr)
                      raw_hits.append((val,s['raw']+i))
                      p=i+1
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          valid=[]
          with (out/'field_users.txt').open('w',encoding='utf-8') as f:
              f.write(f'RAW_DISP_HITS={len(raw_hits)} CAND_FUNCS={len(cand_funcs)}\n')
              for st,en in sorted(cand_funcs):
                  if en-st>0x20000:continue
                  o=va2off(st)
                  if o is None:continue
                  ins=list(md.disasm(b[o:o+(en-st)],st));hits=[]
                  for x in ins:
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.disp in (0x480,0x488):
                              hits.append((x.address,op.mem.disp,x.mnemonic,x.op_str))
                  if not hits:continue
                  valid.append((st,en,hits))
                  f.write(f'\n===== FUNC 0x{st:x}-0x{en:x} size=0x{en-st:x} HITS={hits} =====\n')
                  # Print whole small funcs, or +/-0x100 around hits for large funcs.
                  hitadd={h[0] for h in hits}
                  for x in ins:
                      near=any(abs(x.address-h)<0x140 for h in hitadd)
                      if not near:continue
                      ann=[]
                      if x.address in hitadd:ann.append('INSTANCE_FIELD_HIT')
                      if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38):ann.append(f'KEYFIELD_CAND disp=0x{op.mem.disp:x}')
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d)
                              if a:ann.append(f'ASCII={a!r}')
                              if w:ann.append(f'WIDE={w!r}')
                      f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')
          (out/'function_starts.txt').write_text(''.join(f'0x{st:x}\n' for st,en,h in valid))
          print('validated field-user funcs',len(valid))
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-manager-instance-field
          git commit -m 'Trace APK2 runtime save manager instance field' || exit 0
          git pull --rebase origin main
          git push origin main
