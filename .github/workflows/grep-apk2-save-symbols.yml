name: Grep APK2 save symbols

on:
  push:
    paths:
      - '.github/workflows/grep-apk2-save-symbols.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - name: Download executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern 'APK2-Win64-Shipping.exe' --dir .
      - name: Extract targeted strings
        shell: bash
        run: |
          set -euo pipefail
          RX='DefaultData|SaveData|SaveGame|SaveLoad|SaveFile|LoadSave|LoadGame|SaveManager|Storage|Serialize|Deserialize|Encrypt|Decrypt|Cipher|FAES|AES_KEY|AESKey|EncryptionKey|SetBroken|OutOfLocalStorage'
          strings -a -t x -n 4 APK2-Win64-Shipping.exe | grep -Ei "$RX" > save_symbols_ascii.txt || true
          strings -a -e l -t x -n 4 APK2-Win64-Shipping.exe | grep -Ei "$RX" > save_symbols_utf16.txt || true
          echo ASCII=$(wc -l < save_symbols_ascii.txt) UTF16=$(wc -l < save_symbols_utf16.txt)
          sed -n '1,500p' save_symbols_ascii.txt
          sed -n '1,500p' save_symbols_utf16.txt
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-symbols
          path: |
            save_symbols_ascii.txt
            save_symbols_utf16.txt
          retention-days: 7
