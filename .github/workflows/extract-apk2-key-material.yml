name: Extract APK2 key material

on:
  push:
    paths:
      - '.github/workflows/extract-apk2-key-material.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK2 executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern 'APK2-Win64-Shipping.exe' --dir .
      - name: Install PE parser
        run: python3 -m pip install --quiet pefile
      - name: Extract candidate sections and literal keys
        shell: bash
        run: |
          set -euo pipefail
          cat > extract.py <<'PY'
          import pefile,re,base64,binascii,hashlib
          from pathlib import Path
          fn='APK2-Win64-Shipping.exe'; data=Path(fn).read_bytes(); pe=pefile.PE(fn)
          out=Path('key-material'); out.mkdir(exist_ok=True)
          wanted={'.rdata','.data2','.srdata'}
          manifest=[]
          for s in pe.sections:
              name=s.Name.rstrip(b'\0').decode(errors='replace')
              if name in wanted:
                  b=s.get_data()
                  p=out/(name.strip('.')+'.bin')
                  p.write_bytes(b)
                  manifest.append(f'{name} file={p.name} raw_off=0x{s.PointerToRawData:x} rva=0x{s.VirtualAddress:x} size={len(b)} sha256={hashlib.sha256(b).hexdigest()}')
          # Printable strings can carry keys even when unaligned or outside the chosen sections.
          seen=set(); rows=[]
          def add(kind,off,key,src):
              if len(key) not in (16,24,32): return
              h=key.hex()
              t=(len(key),h)
              if t in seen:return
              seen.add(t); rows.append(f'{len(key)}\t{kind}\t0x{off:x}\t{h}\t{src[:180]!r}')
          for m in re.finditer(rb'[ -~]{16,256}',data):
              b=m.group(); txt=b.decode('ascii','ignore')
              # Sliding literal bytes, all AES key sizes.
              for L in (16,24,32):
                  if len(b)>=L:
                      for i in range(0,len(b)-L+1): add('ascii',m.start()+i,b[i:i+L],txt)
              # Hex-encoded keys.
              for hm in re.finditer(r'(?i)(?<![0-9a-f])(?:[0-9a-f]{32}|[0-9a-f]{48}|[0-9a-f]{64})(?![0-9a-f])',txt):
                  try:add('hex',m.start()+hm.start(),bytes.fromhex(hm.group()),txt)
                  except:pass
              # Base64 candidates.
              for bm in re.finditer(r'(?<![A-Za-z0-9+/])[A-Za-z0-9+/]{22,44}={0,2}(?![A-Za-z0-9+/])',txt):
                  try:
                      q=bm.group(); q += '='*((4-len(q)%4)%4); dec=base64.b64decode(q,validate=True); add('b64',m.start()+bm.start(),dec,txt)
                  except:pass
          # UTF-16LE printable strings -> UTF-8 key bytes.
          for m in re.finditer(rb'(?:[ -~]\x00){16,128}',data):
              try: txt=m.group().decode('utf-16le'); b=txt.encode('utf-8')
              except: continue
              for L in (16,24,32):
                  if len(b)>=L:
                      for i in range(len(b)-L+1): add('utf16-ascii',m.start(),b[i:i+L],txt)
          (out/'literal_candidates.tsv').write_text('\n'.join(rows),encoding='utf-8')
          (out/'manifest.txt').write_text('\n'.join(manifest)+f'\nliteral_candidates={len(rows)}\n',encoding='utf-8')
          print('\n'.join(manifest)); print('literal candidates',len(rows))
          PY
          python3 extract.py
          du -h key-material/*
      - name: Upload key material
        uses: actions/upload-artifact@v4
        with:
          name: apk2-key-material
          path: key-material/
          retention-days: 7
