name: AoE2DE 54800 P3O Monolithic RC12

on:
  pull_request:
    branches:
      - aoe2de-54800-internal-camera-resolver
    paths:
      - 'aoe2de-camera-resolver/**'
      - '.github/workflows/aoe2de-54800-camera-resolver.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Apply RC12 parity patch
        working-directory: aoe2de-camera-resolver
        run: python3 patch_rc12.py
      - name: Build and validate
        working-directory: aoe2de-camera-resolver
        run: |
          x86_64-w64-mingw32-gcc -shared -O2 -s -include windowsx.h -Wl,--no-insert-timestamp -Wl,--dynamicbase -Wl,--nxcompat -o version.dll proxy.c resolver_monolithic_rc10.c version.def -luser32 -lgdi32
          x86_64-w64-mingw32-objdump -p version.dll > pe.txt
          strings -el version.dll > strings-wide.txt || true
          strings version.dll > strings-ascii.txt
          sha256sum version.dll > SHA256.txt
          for n in GetFileVersionInfoA GetFileVersionInfoByHandle GetFileVersionInfoExA GetFileVersionInfoExW GetFileVersionInfoSizeA GetFileVersionInfoSizeExA GetFileVersionInfoSizeExW GetFileVersionInfoSizeW GetFileVersionInfoW VerFindFileA VerFindFileW VerInstallFileA VerInstallFileW VerLanguageNameA VerLanguageNameW VerQueryValueA VerQueryValueW; do grep -q "$n" pe.txt; done
          grep -q 'DLL Name: KERNEL32.dll' pe.txt
          grep -q 'DLL Name: USER32.dll' pe.txt
          grep -q 'DLL Name: GDI32.dll' pe.txt
          grep -q 'ONE_DLL=TRUE BACKEND_DLL=FALSE' strings-ascii.txt
          grep -q 'UI_LINEAGE=P3N_RC3_FIX1_RC4_RC5' strings-ascii.txt
          grep -q 'P3O_SPAWN=SUCCESS' strings-ascii.txt
          grep -q 'P3O_INSERT visible=' strings-ascii.txt
          grep -q 'CAT_SCHEMA exact name=' strings-ascii.txt
          grep -q 'schema=Catalog/categories' strings-ascii.txt
          grep -q 'AoE2DE_P3O_54800_MONOLITHIC_RC12.log' strings-wide.txt
          echo '=== DLL SHA256 ==='
          cat SHA256.txt
          echo '=== EXPORTS ==='
          grep -E 'GetFileVersionInfo|VerFindFile|VerInstallFile|VerLanguageName|VerQueryValue' pe.txt | tail -n 17
      - name: Upload only version.dll
        uses: actions/upload-artifact@v4
        with:
          name: AoE2DE_P3O_VIKING_SAGAS_54800_MONOLITHIC_RC12
          path: aoe2de-camera-resolver/version.dll
          if-no-files-found: error
