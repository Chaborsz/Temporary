name: Trace APK2 SaveGameManager vtable

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-savemanager-vtable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch executable and analysis libs
        run: |
          curl -fL --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip install --quiet pefile capstone
      - name: Decode vtable and scan methods
        shell: bash
        run: |
          mkdir reports
          cat > trace.py <<'PY'
          import pefile,struct
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          pe=pefile.PE('APK2-Win64-Shipping.exe'); data=Path('APK2-Win64-Shipping.exe').read_bytes(); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          VT=0x14a1deb08
          def va2off(va):
              r=va-base
              try:return pe.get_offset_from_rva(r)
              except:return None
          def executable(va):
              r=va-base
              for s in pe.sections:
                  if s.VirtualAddress<=r<s.VirtualAddress+max(s.Misc_VirtualSize,s.SizeOfRawData):
                      return bool(s.Characteristics & 0x20000000)
              return False
          vo=va2off(VT)
          out=[f'IMAGE_BASE=0x{base:x}',f'VTABLE=0x{VT:x} off={vo:#x}']
          methods=[]
          for i in range(0,160):
              if vo is None or vo+i*8+8>len(data):break
              q=struct.unpack_from('<Q',data,vo+i*8)[0]
              ex=executable(q)
              out.append(f'VT[{i:03d}] +0x{i*8:03x} = 0x{q:016x} executable={int(ex)}')
              if ex:methods.append((i,q))
              elif i>20 and q==0: break
          out.append('\n===== METHOD DISASSEMBLY / +0x30 ACCESSES =====')
          seen=set(); interesting=[]
          for idx,va in methods:
              if va in seen:continue
              seen.add(va);off=va2off(va)
              if off is None:continue
              insns=[]; plus=[]; calls=[]
              for n,ins in enumerate(md.disasm(data[off:off+0x1800],va)):
                  insns.append(ins)
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.disp==0x30:
                          plus.append(ins)
                      if op.type==X86_OP_IMM and ins.mnemonic in ('call','jmp'):
                          t=op.imm
                          if base<=t<base+pe.OPTIONAL_HEADER.SizeOfImage:calls.append(t)
                  if n>8 and ins.mnemonic=='ret':break
                  if n>=700:break
              if plus:
                  interesting.append((idx,va,plus,calls,insns))
                  out.append(f'\n--- VT[{idx}] 0x{va:x} PLUS30={len(plus)} calls={len(calls)} ---')
                  for ins in insns:
                      mark=' ***PLUS30***' if ins in plus else ''
                      out.append(f'0x{ins.address:016x} {ins.bytes.hex():24} {ins.mnemonic:9} {ins.op_str}{mark}')
          out.append('\n===== INTERESTING CALLEES ONE LEVEL =====')
          callees=[]
          for idx,va,plus,calls,insns in interesting:
              for c in calls:
                  if c not in callees:callees.append(c)
          for c in callees[:300]:
              off=va2off(c)
              if off is None:continue
              plus=[];insns=[]
              for n,ins in enumerate(md.disasm(data[off:off+0x1000],c)):
                  insns.append(ins)
                  if any(op.type==X86_OP_MEM and op.mem.disp==0x30 for op in ins.operands):plus.append(ins)
                  if n>6 and ins.mnemonic=='ret':break
                  if n>=400:break
              if plus:
                  out.append(f'\n--- CALLEE 0x{c:x} PLUS30={len(plus)} ---')
                  for ins in insns:
                      mark=' ***PLUS30***' if ins in plus else ''
                      out.append(f'0x{ins.address:016x} {ins.bytes.hex():24} {ins.mnemonic:9} {ins.op_str}{mark}')
          Path('reports/savemanager_vtable.txt').write_text('\n'.join(out))
          print('\n'.join(out[:2500]))
          print('methods',len(methods),'unique',len(seen),'interesting',len(interesting))
          PY
          python3 trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: apk2-savemanager-vtable-trace
          path: reports/savemanager_vtable.txt
          retention-days: 7
