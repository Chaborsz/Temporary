name: Inspect APK2 xref artifact

on:
  push:
    paths:
      - '.github/workflows/inspect-apk2-xref-artifact.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download prior xref artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh run download 39182043471 --repo Chaborsz/Temporary -n apk2-static-save-xrefs -D artifact
          find artifact -maxdepth 2 -type f -printf '%P %s bytes\n'

      - name: Print static xrefs and callers
        shell: bash
        run: |
          set -euo pipefail
          echo '===== STATIC XREFS ====='
          cat artifact/static_xrefs.txt
          echo '===== CALLERS ====='
          cat artifact/callers.txt
          echo '===== RIZIN SITES ====='
          cat artifact/rizin_sites.txt || true
