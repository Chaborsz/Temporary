name: Trace APK2 save manager constructor

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-save-manager-constructor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch executable and trace constructor/callees
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-manager-constructor
          python3 - <<'PY'
          from pathlib import Path
          import pefile,bisect,struct,json
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-save-manager-constructor')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def secva(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']:return s['name']
          def cstr(va,lim=160):
              off=va2off(va)
              if off is None:return None
              raw=b[off:off+lim].split(b'\0',1)[0]
              if len(raw)>1 and all(32<=x<127 for x in raw):
                  try:return raw.decode()
                  except:return None
          def wstr(va,lim=100):
              off=va2off(va)
              if off is None:return None
              z=[]
              for i in range(lim):
                  if off+2*i+1>=len(b):break
                  x,y=b[off+2*i],b[off+2*i+1]
                  if x==0 and y==0:break
                  if y or not 32<=x<127:return None
                  z.append(chr(x))
              return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress;en=base+e.struct.EndAddress
              if st<en:funcs.append((st,en))
          funcs=sorted(set(funcs));starts=[x[0] for x in funcs]
          def cf(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          root=0x1450d58c0
          queue=[root];seen=set();depth={root:0}; records=[]
          with (out/'constructor_tree.txt').open('w',encoding='utf-8') as f:
              while queue:
                  seed=queue.pop(0)
                  if seed in seen:continue
                  seen.add(seed);fr=cf(seed)
                  if not fr:
                      f.write(f'NO_PDATA 0x{seed:x}\n');continue
                  st,en=fr;off=va2off(st)
                  if off is None:continue
                  insns=list(md.disasm(b[off:off+(en-st)],st))
                  f.write(f'\n===== DEPTH {depth.get(seed,0)} FUNCTION 0x{st:x}-0x{en:x} seed=0x{seed:x} size=0x{en-st:x} =====\n')
                  calls=[]
                  for ins in insns:
                      ann=[]
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          dst=ins.operands[0].imm; cfr=cf(dst); calls.append(dst);ann.append(f'CALL 0x{dst:x} pdata={cfr}')
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              dst=ins.address+ins.size+op.mem.disp; a=cstr(dst);w=wstr(dst);s=secva(dst)
                              x=f'RIP 0x{dst:x} {s}'
                              if a:x+=f' ASCII={a!r}'
                              if w:x+=f' WIDE={w!r}'
                              ann.append(x)
                      # highlight all accesses using displacement +0x30 / +0x38 / +0x40 / +0x48 / +0x50
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38,0x40,0x48,0x50):
                              ann.append(f'OBJECT_OFFSET_CANDIDATE disp=0x{op.mem.disp:x}')
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:9s} {ins.op_str}' + ((' ; '+' | '.join(ann)) if ann else '')+'\n')
                  f.write('CALLS='+','.join(hex(x) for x in sorted(set(calls)))+'\n')
                  d=depth.get(seed,0)
                  if d<2:
                      for dst in calls:
                          cfr=cf(dst)
                          if cfr and 0<cfr[1]-cfr[0]<=0x3000 and dst not in seen:
                              depth[dst]=d+1;queue.append(dst)
          # scan full executable for direct calls TO InternalConstructor, which may reveal wrappers
          refs=[]
          needle=root
          # simple capstone only around executable functions that contain call rel32 raw target root
          # call target formula E8 rel32
          for s in secs:
              raw=s['raw'];buf=memoryview(b)[raw:raw+s['sz']];secbase=base+s['rva']
              pos=0
              while True:
                  i=bytes(buf).find(b'\xe8',pos)
                  if i<0:break
                  if i+5<=len(buf):
                      rel=struct.unpack_from('<i',buf,i+1)[0];src=secbase+i;dst=src+5+rel
                      if dst==root:refs.append(src)
                  pos=i+1
          (out/'callers_of_internalconstructor.txt').write_text('\n'.join(hex(x) for x in refs)+'\n')
          PY
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-manager-constructor
          git commit -m 'Trace APK2 save manager constructor' || exit 0
          git pull --rebase origin main
          git push origin main
