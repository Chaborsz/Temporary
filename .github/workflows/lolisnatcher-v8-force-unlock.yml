name: Force unlock LoliSnatcher v8 concurrency

on:
  push:
    paths:
      - ".github/workflows/lolisnatcher-v8-force-unlock.yml"

permissions:
  contents: read

concurrency:
  group: lolisnatcher-windows-portable-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - run: echo "v8 concurrency group released"
