name: APK2 save xrefs v3

on:
  push:
    paths:
      - '.github/workflows/analyze-apk2-save-xrefs-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch verified APK2 and Rizin
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          curl -L --fail --retry 5 'https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz' -o rizin.tar.xz
          echo '9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf  rizin.tar.xz' | sha256sum -c -
          mkdir rizin && tar -xJf rizin.tar.xz -C rizin
          echo "RIZIN=$(find rizin -type f -name rizin -perm -111 | head -n1)" >> "$GITHUB_ENV"
          mkdir -p report

      - name: Direct Rizin xrefs in one command
        shell: bash
        run: |
          set -euo pipefail
          CMD='aa;aar'
          for VA in \
            0x14a4570f8 0x14a1d45d0 0x14a1cf718 0x14a1cf7a6 \
            0x14a45c290 0x149b30ee8 0x149bcd740 0x14a4576a0 \
            0x149b18590 0x149b30ff0 0x149b30f30 0x149b31170 \
            0x149b310b0 0x149b31350 0x149ff7e60 0x149ff7eb8 0x149ff7f10
          do
            CMD="$CMD;axt @ $VA"
          done
          CMD="$CMD;q"
          timeout 30m "$RIZIN" -q -e bin.strings=false -c "$CMD" APK2-Win64-Shipping.exe > report/01_rizin_xrefs.txt 2>&1 || true
          sed -n '1,1200p' report/01_rizin_xrefs.txt

      - name: Static x64 RIP-relative xref scan including pointer indirection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install pefile capstone
          python3 - <<'PY' | tee report/02_static_xrefs.txt
          from pathlib import Path
          import pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64

          fn='APK2-Win64-Shipping.exe'
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=True); base=pe.OPTIONAL_HEADER.ImageBase
          named={
            0x14a4570f8:'DefaultData',
            0x14a1d45d0:'UAPKSaveGameManager',
            0x14a1cf718:'UAPKSaveGameLibrary',
            0x14a1cf7a6:'sUAPKSaveGame',
            0x14a45c290:'SaveGameManager Is Busy No Save',
            0x149b30ee8:'SaveGamePipe',
            0x149bcd740:'SaveGameSystemModule',
            0x14a4576a0:'SEGA save path fmt',
            0x149b18590:'SaveGames path fmt',
            0x149b30ff0:'SaveGameSystem.cpp:18',
            0x149b30f30:'SaveGameSystem.cpp:45',
            0x149b31170:'SaveGameSystem.cpp:72',
            0x149b310b0:'SaveGameSystem.cpp:100',
            0x149b31350:'SaveGameSystem.cpp:124',
            0x149ff7e60:'APKSaveGame_SetVersion',
            0x149ff7eb8:'APKSaveGame_SetBroken',
            0x149ff7f10:'APKSaveGame_SetDifferentVersionDataForceLoad',
          }
          secs=[]
          for s in pe.sections:
              name=s.Name.rstrip(b'\0').decode('ascii','replace')
              secs.append({'name':name,'raw':s.PointerToRawData,'rawsz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':s.Misc_VirtualSize,'ch':s.Characteristics})
          def off2va(off):
              for s in secs:
                  if s['raw'] <= off < s['raw']+s['rawsz']:
                      return base+s['rva']+(off-s['raw']),s['name']
              return None,None
          def va2off(va):
              rva=va-base
              for s in secs:
                  if s['rva'] <= rva < s['rva']+s['rawsz']:
                      return s['raw']+(rva-s['rva'])
              return None

          # Find absolute pointer slots pointing at target strings/metadata.
          pointer_targets=dict(named)
          ptr_slots={}
          for t,nm in named.items():
              needle=struct.pack('<Q',t); pos=0; count=0
              while True:
                  i=b.find(needle,pos)
                  if i<0: break
                  va,sec=off2va(i)
                  if va:
                      ptr_slots[va]=f'ptr->{nm}'
                      print(f'PTR target={nm} slot_va=0x{va:x} file=0x{i:x} section={sec}')
                  count+=1; pos=i+1
              print(f'PTRCOUNT {nm} {count}')
          all_targets={**pointer_targets,**ptr_slots}

          # Scan executable sections for common x86-64 RIP-relative memory operands.
          hits=[]
          for s in secs:
              if not (s['ch'] & 0x20000000):
                  continue
              data=memoryview(b)[s['raw']:s['raw']+s['rawsz']]
              secva=base+s['rva']; i=0; L=len(data)
              while i+7<=L:
                  # REX + opcode + ModRM(r/m=101, mod=00) + disp32
                  rex=data[i]
                  if 0x40 <= rex <= 0x4f and data[i+1] in (0x8d,0x8b,0x89,0x3b,0x39,0x33,0x31,0x23,0x21,0x0b,0x09):
                      modrm=data[i+2]
                      if (modrm & 0xc7)==0x05:
                          disp=struct.unpack_from('<i',data,i+3)[0]
                          src=secva+i; dst=src+7+disp
                          if dst in all_targets:
                              hits.append((src,dst,s['name'],all_targets[dst],i,s['raw']))
                  # no REX: opcode + ModRM + disp32
                  if data[i] in (0x8d,0x8b,0x89,0x3b,0x39,0x33,0x31,0x23,0x21,0x0b,0x09):
                      modrm=data[i+1]
                      if (modrm & 0xc7)==0x05:
                          disp=struct.unpack_from('<i',data,i+2)[0]
                          src=secva+i; dst=src+6+disp
                          if dst in all_targets:
                              hits.append((src,dst,s['name'],all_targets[dst],i,s['raw']))
                  i+=1

          md=Cs(CS_ARCH_X86,CS_MODE_64)
          for src,dst,sec,nm,idx,rawbase in sorted(set(hits)):
              off=va2off(src)
              lo=max(0,off-32); chunk=b[lo:min(len(b),off+64)]
              context=[]
              ctxva=src-(off-lo)
              for ins in md.disasm(chunk,ctxva):
                  if src-24 <= ins.address <= src+32:
                      context.append(f'0x{ins.address:x}: {ins.mnemonic} {ins.op_str}')
              print(f'XREF src=0x{src:x} -> dst=0x{dst:x} {nm} section={sec}')
              for x in context: print('   ',x)
          print('XREF_COUNT',len(set(hits)))

          with open('report/caller_vas.txt','w') as f:
              for src,*_ in sorted(set(hits)):
                  f.write(f'0x{src:x}\n')
          PY

      - name: Rizin disassembly around discovered callers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t VAS < report/caller_vas.txt || true
          CMD=''
          N=0
          for VA in "${VAS[@]}"; do
            [ -z "$VA" ] && continue
            START=$(python3 -c "print(hex(int('$VA',16)-0x80))")
            CMD="$CMD;pd 100 @ $START"
            N=$((N+1)); [ "$N" -ge 120 ] && break
          done
          if [ "$N" -gt 0 ]; then
            "$RIZIN" -q -e bin.strings=false -c "${CMD#;};q" APK2-Win64-Shipping.exe > report/03_callers_disasm.txt 2>&1 || true
          else
            echo 'No caller addresses found' > report/03_callers_disasm.txt
          fi
          sed -n '1,2000p' report/03_callers_disasm.txt

      - name: Upload xref reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-xrefs-v3
          path: report/
          retention-days: 7
