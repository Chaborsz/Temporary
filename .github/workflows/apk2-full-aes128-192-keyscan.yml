name: APK2 Full AES128 AES192 Raw Key Scan

on:
  push:
    paths:
      - '.github/workflows/apk2-full-aes128-192-keyscan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyscan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download verified APK2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download apk2-mediafire-transfer-2026-10-18 --repo Chaborsz/Temporary --pattern APK2-Win64-Shipping.exe --dir .
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -

      - name: Build scanner
        shell: bash
        run: |
          cat > scan.c <<'C'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <openssl/aes.h>
          static const unsigned char ct[16]={0xc8,0x6a,0xc0,0xc8,0x41,0xad,0x93,0xf7,0xa3,0x27,0xdb,0xe1,0x87,0x50,0x27,0x35};
          static void hx(const unsigned char*p,size_t n){for(size_t i=0;i<n;i++)printf("%02x",p[i]);}
          int main(int argc,char**argv){
            if(argc!=2)return 2;
            int fd=open(argv[1],O_RDONLY); struct stat st; fstat(fd,&st); size_t n=st.st_size;
            unsigned char*b=mmap(NULL,n,PROT_READ,MAP_PRIVATE,fd,0); if(b==MAP_FAILED)return 2;
            AES_KEY k; unsigned char out[16]; unsigned long long h128=0,h192=0;
            for(size_t off=0;off+24<=n;off++){
              if(off+16<=n){AES_set_decrypt_key(b+off,128,&k); AES_decrypt(ct,out,&k); if(!memcmp(out,"GVAS",4)){printf("AES128 HIT off=0x%zx key=",off);hx(b+off,16);printf(" plain=");hx(out,16);puts("");h128++;}}
              AES_set_decrypt_key(b+off,192,&k); AES_decrypt(ct,out,&k); if(!memcmp(out,"GVAS",4)){printf("AES192 HIT off=0x%zx key=",off);hx(b+off,24);printf(" plain=");hx(out,16);puts("");h192++;}
              if((off & 0x3ffffff)==0)fprintf(stderr,"progress=0x%zx h128=%llu h192=%llu\n",off,h128,h192);
            }
            fprintf(stderr,"DONE size=%zu h128=%llu h192=%llu\n",n,h128,h192); return 0;
          }
          C
          gcc -O3 -march=native -Wno-deprecated-declarations scan.c -lcrypto -o scan

      - name: Scan every offset
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -f 'ELAPSED=%e CPU=%P MAXRSS=%MKB' ./scan APK2-Win64-Shipping.exe > aes128-192-hits.txt 2> aes128-192.log
          cat aes128-192.log
          cat aes128-192-hits.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-full-aes128-192-keyscan
          path: |
            aes128-192-hits.txt
            aes128-192.log
          retention-days: 3
