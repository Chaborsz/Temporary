name: Disassemble APK2 EncryptKey initializer chain

on:
  push:
    paths:
      - '.github/workflows/disasm-apk2-encryptkey-init-capstone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch executable and tools
        run: |
          curl -fL --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip install --quiet pefile capstone
      - name: Follow direct constructor calls
        shell: bash
        run: |
          mkdir reports
          cat > trace.py <<'PY'
          import pefile
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM
          pe=pefile.PE('APK2-Win64-Shipping.exe'); data=Path('APK2-Win64-Shipping.exe').read_bytes(); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          seeds=[0x1450d58c0,0x144cd2430,0x14119c740,0x141433f00]
          todo=[(x,0) for x in seeds]; seen=set(); out=[]
          while todo:
              va,depth=todo.pop(0)
              if va in seen or depth>3: continue
              seen.add(va)
              rva=va-base
              try: off=pe.get_offset_from_rva(rva)
              except Exception as e: out.append(f'UNMAPPED 0x{va:x} {e!r}');continue
              out.append(f'\n===== VA 0x{va:x} depth={depth} off=0x{off:x} =====')
              blob=data[off:off+0xa00]
              count=0
              for ins in md.disasm(blob,va):
                  out.append(f'0x{ins.address:016x} {ins.bytes.hex():24} {ins.mnemonic:9} {ins.op_str}')
                  count+=1
                  if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                      target=ins.operands[0].imm
                      if base<=target<base+pe.OPTIONAL_HEADER.SizeOfImage:
                          out.append(f'    DIRECT_CALL -> 0x{target:x}')
                          if depth<2: todo.append((target,depth+1))
                  if count>=320: break
                  if ins.mnemonic=='ret' and count>4: break
          Path('reports/constructor_chain.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
          python3 trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: apk2-encryptkey-init-capstone
          path: reports/constructor_chain.txt
          retention-days: 7
