name: Release APK2 Save Probe

on:
  push:
    paths:
      - '.github/workflows/release-apk2-save-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build read-only probes
        shell: cmd
        run: |
          mkdir dist
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE apk2-save-probe\APK2SaveProbe.cpp /Fe:dist\APK2SaveProbe.exe bcrypt.lib
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE apk2-save-probe\APK2FStringKeyProbe.cpp /Fe:dist\APK2FStringKeyProbe.exe bcrypt.lib crypt32.lib
      - name: Verify expected binaries and hashes
        shell: powershell
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name)  $($_.Length) bytes  sha256=$h"
          } | Tee-Object -FilePath dist\SHA256.txt
      - name: Publish public release
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk2-save-probe-v1 dist\APK2FStringKeyProbe.exe dist\APK2SaveProbe.exe dist\SHA256.txt --title "APK2 Save Encryption Probe v1" --notes "Read-only runtime probes for Demon Slayer Hinokami Chronicles 2 save encryption research. APK2FStringKeyProbe.exe validates UAPKSaveGameManager EncryptKey candidates by requiring AES-256 decryption of the native PC save to begin with GVAS. The probes request PROCESS_VM_READ only; they do not inject code or write process memory." --repo Chaborsz/Temporary
