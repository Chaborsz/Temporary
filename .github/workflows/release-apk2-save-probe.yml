name: Release APK2 Save Probe

on:
  push:
    paths:
      - '.github/workflows/release-apk2-save-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build read-only probes
        shell: cmd
        run: |
          mkdir dist
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE apk2-save-probe\APK2SaveProbe.cpp /Fe:dist\APK2SaveProbe.exe bcrypt.lib
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE apk2-save-probe\APK2FStringKeyProbe.cpp /Fe:dist\APK2FStringKeyProbe.exe bcrypt.lib crypt32.lib
      - name: Verify expected binaries and hashes
        shell: powershell
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$($_.Name)  $($_.Length) bytes  sha256=$h"
          } | Tee-Object -FilePath dist\SHA256.txt
      - name: Publish public release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='apk2-save-probe-v1'
          $notes=@'
          Read-only runtime probes for Demon Slayer -Kimetsu no Yaiba- The Hinokami Chronicles 2 PC save encryption research.

          APK2FStringKeyProbe.exe is the primary probe. It uses the recovered UAPKSaveGameManager::EncryptKey FString layout and validates candidate AES-256 keys by requiring the native PC save to decrypt to GVAS.

          The probes request PROCESS_VM_READ only and do not inject code or write process memory.
          '@
          gh release view $tag --repo Chaborsz/Temporary *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\APK2FStringKeyProbe.exe dist\APK2SaveProbe.exe dist\SHA256.txt --clobber --repo Chaborsz/Temporary
          } else {
            gh release create $tag dist\APK2FStringKeyProbe.exe dist\APK2SaveProbe.exe dist\SHA256.txt --title 'APK2 Save Encryption Probe v1' --notes $notes --repo Chaborsz/Temporary
          }
