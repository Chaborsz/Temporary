name: Inspect APK2 save task table

on:
  push:
    paths:
      - '.github/workflows/inspect-apk2-save-task-table.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified executable and inspect task table
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-task-table
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP
          fn='APK2-Win64-Shipping.exe';out=Path('analysis-results/apk2-save-task-table')
          b=Path(fn).read_bytes();pe=pefile.PE(fn,fast_load=False);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
            secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(v):
            r=v-base
            for s in secs:
              if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def off2va(o):
            for s in secs:
              if s['raw']<=o<s['raw']+s['sz']:return base+s['rva']+(o-s['raw']),s['name']
          def secva(v):
            r=v-base
            for s in secs:
              if s['rva']<=r<s['rva']+s['vsz']:return s['name']
          def cstr(v,lim=220):
            o=va2off(v)
            if o is None:return None
            x=b[o:o+lim].split(b'\0',1)[0]
            if len(x)>1 and all(32<=c<127 for c in x):
              try:return x.decode()
              except:return None
          def wstr(v,lim=140):
            o=va2off(v)
            if o is None:return None
            z=[]
            for i in range(lim):
              if o+2*i+1>=len(b):break
              a,c=b[o+2*i],b[o+2*i+1]
              if a==0 and c==0:break
              if c or not 32<=a<127:return None
              z.append(chr(a))
            return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
            a=base+e.struct.BeginAddress;z=base+e.struct.EndAddress
            if a<z:funcs.append((a,z))
          funcs=sorted(set(funcs));starts=[a for a,z in funcs]
          def cf(v):
            i=bisect.bisect_right(starts,v)-1
            return funcs[i] if i>=0 and funcs[i][0]<=v<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True

          # Dump qword table and any strings around 0x14A457900..0x14A457B00
          with (out/'table.txt').open('w',encoding='utf-8') as f:
            for va in range(0x14a457880,0x14a457b80,8):
              o=va2off(va)
              if o is None:continue
              q=struct.unpack_from('<Q',b,o)[0];anns=[]
              s=secva(q)
              if s:anns.append(f'PTR->{s}:0x{q:x}')
              fr=cf(q)
              if fr:anns.append(f'FUNC={fr}')
              a=cstr(q);w=wstr(q)
              if a:anns.append('ASCII='+repr(a))
              if w:anns.append('WIDE='+repr(w))
              f.write(f'0x{va:x} q=0x{q:016x} '+' | '.join(anns)+'\n')

          # ASCII/UTF16 strings in raw +/- 0x4000 bytes around the table.
          center=va2off(0x14a457a00);lo=max(0,center-0x5000);hi=min(len(b),center+0x5000)
          rows=[];i=lo
          while i<hi:
            if 32<=b[i]<127:
              j=i
              while j<hi and 32<=b[j]<127:j+=1
              if j-i>=3:rows.append((i,'A',b[i:j].decode('ascii','replace')))
              i=j
            else:i+=1
          for parity in (0,1):
            i=lo+((parity-lo)&1)
            while i+1<hi:
              if 32<=b[i]<127 and b[i+1]==0:
                j=i;z=[]
                while j+1<hi and 32<=b[j]<127 and b[j+1]==0:z.append(chr(b[j]));j+=2
                if len(z)>=3:rows.append((i,'W',''.join(z)))
                i=j
              else:i+=2
          with (out/'nearby_strings.txt').open('w',encoding='utf-8') as f:
            for o,t,s in sorted(set(rows)):
              va,sec=off2va(o);f.write(f'file=0x{o:x} va={hex(va) if va else None} {t} {s}\n')

          # Dump every real function pointer found in table once, plus nearby calls and string refs.
          targets=[]
          for va in range(0x14a457880,0x14a457b80,8):
            o=va2off(va)
            if o is None:continue
            q=struct.unpack_from('<Q',b,o)[0];fr=cf(q)
            if fr and fr not in targets and 0<fr[1]-fr[0]<=0x5000:targets.append(fr)
          with (out/'methods.txt').open('w',encoding='utf-8') as f:
            for st,en in sorted(targets):
              o=va2off(st);f.write(f'\n===== FUNC 0x{st:x}-0x{en:x} size=0x{en-st:x} =====\n')
              for x in md.disasm(b[o:o+(en-st)],st):
                ann=[]
                if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                for op in x.operands:
                  if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                    d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d)
                    if a:ann.append('ASCII='+repr(a))
                    if w:ann.append('WIDE='+repr(w))
                  if op.type==X86_OP_MEM and op.mem.disp in (0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x48):ann.append(f'DISP=0x{op.mem.disp:x}')
                f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')
          PY
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-task-table
          git commit -m 'Inspect APK2 save task function table' || exit 0
          git pull --rebase origin main
          git push origin main
