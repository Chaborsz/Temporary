name: Dump APK2 save metadata

on:
  push:
    paths:
      - '.github/workflows/dump-apk2-save-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch verified executable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          mkdir report

      - name: Extract strings around save-related metadata clusters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee report/save_metadata.txt
          from pathlib import Path
          b=Path('APK2-Win64-Shipping.exe').read_bytes()
          ranges=[
            ('APK_REFLECTION',0x09f00000,0x0a300000),
            ('SAVE_SYSTEM',0x09a00000,0x09d80000),
            ('DEFAULTDATA_PATH',0x0a400000,0x0a500000),
          ]
          def ascii_runs(lo,hi,minlen=4):
            out=[]; i=lo
            while i<hi:
              if 32<=b[i]<127:
                j=i
                while j<hi and 32<=b[j]<127:j+=1
                if j-i>=minlen:out.append((i,b[i:j].decode('ascii','replace'),'A'))
                i=j
              else:i+=1
            return out
          def utf16_runs(lo,hi,minchars=4):
            out=[]
            for parity in (0,1):
              i=lo+((parity-lo)&1)
              while i+1<hi:
                if 32<=b[i]<127 and b[i+1]==0:
                  j=i
                  chars=[]
                  while j+1<hi and 32<=b[j]<127 and b[j+1]==0:
                    chars.append(chr(b[j]));j+=2
                  if len(chars)>=minchars:out.append((i,''.join(chars),'W'))
                  i=j
                else:i+=2
            return out
          for name,lo,hi in ranges:
            print('\n===== RANGE',name,hex(lo),hex(hi),'=====')
            rows=ascii_runs(lo,hi)+utf16_runs(lo,hi)
            rows.sort()
            for off,s,typ in rows:
              low=s.lower()
              if any(k in low for k in ['save','data','encrypt','decrypt','crypt','aes','serial','default','slot','load','backup','broken','version','steam','sega','user','profile','key','hash','check','game']):
                print(f'{off:#x}\t{typ}\t{s[:400]}')
          PY

      - name: Whole-file focused strings with offsets
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== ASCII ==='
            strings -a -t x -n 4 APK2-Win64-Shipping.exe | grep -Ei 'APKSaveGame|APK.*Save|SaveGameManager|DefaultData|SaveData|EncryptData|DecryptData|FAES|AESKey|EncryptionKey|Save.*Key|Key.*Save|SaveGameSystem' | head -n 3000 || true
            echo '=== UTF16 ==='
            strings -el -t x -n 4 APK2-Win64-Shipping.exe | grep -Ei 'APKSaveGame|APK.*Save|SaveGameManager|DefaultData|SaveData|EncryptData|DecryptData|FAES|AESKey|EncryptionKey|Save.*Key|Key.*Save|SaveGameSystem' | head -n 3000 || true
          } | tee report/focused_strings.txt

      - name: Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk2-save-metadata
          path: report/
          retention-days: 7
