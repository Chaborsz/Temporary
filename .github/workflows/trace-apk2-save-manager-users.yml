name: Trace APK2 save manager users

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-save-manager-users.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find callers and nearby field accesses
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-manager-users
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-save-manager-users')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def secva(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']:return s['name']
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress;en=base+e.struct.EndAddress
              if st<en:funcs.append((st,en))
          funcs=sorted(set(funcs));starts=[x[0] for x in funcs]
          def cf(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None
          def cstr(va,lim=180):
              off=va2off(va)
              if off is None:return None
              raw=b[off:off+lim].split(b'\0',1)[0]
              if len(raw)>1 and all(32<=x<127 for x in raw):
                  try:return raw.decode()
                  except:return None
          def wstr(va,lim=100):
              off=va2off(va)
              if off is None:return None
              z=[]
              for i in range(lim):
                  if off+2*i+1>=len(b):break
                  a,c=b[off+2*i],b[off+2*i+1]
                  if a==0 and c==0:break
                  if c or not 32<=a<127:return None
                  z.append(chr(a))
              return ''.join(z) if len(z)>1 else None

          call_targets={0x1450ce860:'Manager_GetPrivateStaticClass',0x1450ceb20:'Manager_StaticClassShort',0x1450d58c0:'Manager_InternalConstructor',0x1450ceb50:'Manager_VTableEntry0'}
          global_targets={0x14b876998:'Manager_UClassGlobal',0x14a1deb08:'Manager_VTable',0x14a1dead0:'EncryptKey_PropertyDescriptor'}
          callers=[]
          riprefs=[]
          # raw E8 direct-call scan, efficient
          for s in secs:
              if not(s['ch']&0x20000000):continue
              blob=b[s['raw']:s['raw']+s['sz']]; secbase=base+s['rva']; pos=0
              while True:
                  i=blob.find(b'\xe8',pos)
                  if i<0:break
                  if i+5<=len(blob):
                      rel=struct.unpack_from('<i',blob,i+1)[0];src=secbase+i;dst=src+5+rel
                      if dst in call_targets:callers.append((src,dst,call_targets[dst],cf(src)))
                  pos=i+1
          # byte-level RIP scan to exact globals, then validate from pdata function boundaries
          ops={0x8d,0x8b,0x89,0x39,0x3b,0x31,0x33,0x21,0x23,0x09,0x0b,0x85,0x83,0x81,0xff}
          rawrefs=[]
          for s in secs:
              if not(s['ch']&0x20000000):continue
              buf=memoryview(b)[s['raw']:s['raw']+s['sz']];secbase=base+s['rva'];L=len(buf)
              for i in range(max(0,L-8)):
                  if 0x40<=buf[i]<=0x4f and buf[i+1] in ops and (buf[i+2]&0xc7)==5:
                      disp=struct.unpack_from('<i',buf,i+3)[0];src=secbase+i;dst=src+7+disp
                      if dst in global_targets:rawrefs.append((src,dst,global_targets[dst],cf(src)))
                  if buf[i] in ops and (buf[i+1]&0xc7)==5:
                      disp=struct.unpack_from('<i',buf,i+2)[0];src=secbase+i;dst=src+6+disp
                      if dst in global_targets:rawrefs.append((src,dst,global_targets[dst],cf(src)))
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          grouped={}
          for src,dst,nm,fr in callers+rawrefs:
              if fr:grouped.setdefault(fr,[]).append((src,dst,nm))
          valid_funcs=[]
          with (out/'manager_users.txt').open('w',encoding='utf-8') as f:
              for fr,refs in sorted(grouped.items()):
                  st,en=fr;off=va2off(st)
                  if off is None or en-st>0x12000:continue
                  insns=list(md.disasm(b[off:off+(en-st)],st));imap={x.address:x for x in insns}
                  good=[]
                  for src,dst,nm in refs:
                      ins=imap.get(src)
                      if not ins:continue
                      ok=False
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM and ins.operands[0].imm==dst:ok=True
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP and ins.address+ins.size+op.mem.disp==dst:ok=True
                      if ok:good.append((src,dst,nm))
                  if not good:continue
                  valid_funcs.append(fr)
                  f.write(f'\n===== USER FUNC 0x{st:x}-0x{en:x} size=0x{en-st:x} refs={good} =====\n')
                  goodmap={x[0]:x for x in good}
                  for ins in insns:
                      ann=[]
                      if ins.address in goodmap:ann.append(f'MANAGER_REF {goodmap[ins.address][2]} ->0x{goodmap[ins.address][1]:x}')
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          ann.append(f'CALL->0x{ins.operands[0].imm:x} pdata={cf(ins.operands[0].imm)}')
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              dst=ins.address+ins.size+op.mem.disp;a=cstr(dst);w=wstr(dst)
                              if a or w:
                                  z=f'RIPSTR 0x{dst:x}'
                                  if a:z+=f' ASCII={a!r}'
                                  if w:z+=f' WIDE={w!r}'
                                  ann.append(z)
                          if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38):ann.append(f'FIELD30_CAND disp=0x{op.mem.disp:x}')
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:9s} {ins.op_str}' + ((' ; '+' | '.join(ann)) if ann else '')+'\n')
          (out/'user_function_starts.txt').write_text(''.join(f'0x{x[0]:x}\n' for x in sorted(set(valid_funcs))))
          print('direct callers',len(callers),'raw global refs',len(rawrefs),'validated funcs',len(set(valid_funcs)))
          PY
      - name: Commit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-manager-users
          git commit -m 'Trace APK2 save manager users' || exit 0
          git pull --rebase origin main
          git push origin main
