name: Pinpoint APK2 FAES and save owner

on:
  push:
    paths:
      - '.github/workflows/apk2-pinpoint-faes-owner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified executable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-pinpoint

      - name: Pinpoint FAES functions, callers, and owner registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-pinpoint')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(v):
              r=v-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']: return s['raw']+(r-s['rva'])
          def off2va(o):
              for s in secs:
                  if s['raw']<=o<s['raw']+s['sz']: return base+s['rva']+(o-s['raw']),s['name']
              return None,None
          def secva(v):
              r=v-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']:return s['name']
          def cstr(v,lim=200):
              o=va2off(v)
              if o is None:return None
              x=b[o:o+lim].split(b'\0',1)[0]
              if len(x)>1 and all(32<=c<127 for c in x):
                  try:return x.decode()
                  except:return None
          def wstr(v,lim=120):
              o=va2off(v)
              if o is None:return None
              z=[]
              for i in range(lim):
                  if o+2*i+1>=len(b):break
                  a,c=b[o+2*i],b[o+2*i+1]
                  if a==0 and c==0:break
                  if c or not 32<=a<127:return None
                  z.append(chr(a))
              return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              a=base+e.struct.BeginAddress;z=base+e.struct.EndAddress
              if a<z:funcs.append((a,z))
          funcs=sorted(set(funcs)); starts=[a for a,z in funcs]
          def cf(v):
              i=bisect.bisect_right(starts,v)-1
              return funcs[i] if i>=0 and funcs[i][0]<=v<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True

          # ---- exact AES/FAES candidates ----
          aes_targets=[0x1412a18e0,0x1412a1dc0]
          with (out/'faes_functions.txt').open('w',encoding='utf-8') as f:
              for seed in aes_targets:
                  fr=cf(seed)
                  f.write(f'\n===== AES TARGET seed=0x{seed:x} pdata={fr} =====\n')
                  if not fr:continue
                  st,en=fr;o=va2off(st)
                  ins=list(md.disasm(b[o:o+(en-st)],st))
                  for x in ins:
                      ann=[]
                      if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                          ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d);s=secva(d)
                              q=f'RIP->0x{d:x}({s})'
                              if a:q+=f' ASCII={a!r}'
                              if w:q+=f' WIDE={w!r}'
                              ann.append(q)
                      f.write(f'0x{x.address:x}: {x.mnemonic:10s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')

          # Direct E8 callers to exact candidates, grouped by caller function.
          hits=[]
          for s in secs:
              if not(s['ch']&0x20000000):continue
              blob=b[s['raw']:s['raw']+s['sz']];sv=base+s['rva'];p=0
              while True:
                  i=blob.find(b'\xe8',p)
                  if i<0:break
                  if i+5<=len(blob):
                      rel=struct.unpack_from('<i',blob,i+1)[0];src=sv+i;dst=src+5+rel
                      if dst in aes_targets:hits.append((src,dst,cf(src)))
                  p=i+1
          groups={}
          for h in hits:
              if h[2]:groups.setdefault(h[2],[]).append(h)
          with (out/'faes_callers.txt').open('w',encoding='utf-8') as f:
              f.write(f'DIRECT_CALLS={len(hits)} CALLER_FUNCS={len(groups)}\n')
              for (st,en),hs in sorted(groups.items()):
                  o=va2off(st)
                  if o is None or en-st>0x10000:continue
                  ins=list(md.disasm(b[o:o+(en-st)],st));hm={x[0]:x for x in hs}
                  f.write(f'\n===== CALLER 0x{st:x}-0x{en:x} size=0x{en-st:x} HITS={[(hex(a),hex(d)) for a,d,_ in hs]} =====\n')
                  for x in ins:
                      near=any(abs(x.address-h[0])<0x180 for h in hs)
                      if not near:continue
                      ann=[]
                      if x.address in hm:ann.append(f'FAES_CALL->0x{hm[x.address][1]:x}')
                      if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                          ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d)
                              if a:ann.append(f'ASCII={a!r}')
                              if w:ann.append(f'WIDE={w!r}')
                          if op.type==X86_OP_MEM and op.mem.disp in (0x30,0x38,0x480,0x488):ann.append(f'DISP=0x{op.mem.disp:x}')
                      f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')

          # ---- owner constructor registration via absolute pointer ----
          owner_ctor=0x144fd8575
          needle=struct.pack('<Q',owner_ctor); ptrs=[];p=0
          while True:
              i=b.find(needle,p)
              if i<0:break
              va,sec=off2va(i);ptrs.append((i,va,sec));p=i+1
          with (out/'owner_registration.txt').open('w',encoding='utf-8') as f:
              f.write(f'OWNER_CTOR=0x{owner_ctor:x} ABS_PTRS={len(ptrs)}\n')
              for off,va,sec in ptrs:
                  f.write(f'\n===== PTR file=0x{off:x} va={hex(va) if va else None} sec={sec} =====\n')
                  lo=max(0,off-0x100);hi=min(len(b),off+0x180)
                  for qoff in range(lo-(lo%8),hi,8):
                      q=struct.unpack_from('<Q',b,qoff)[0];qva,qsec=off2va(qoff);anns=[]
                      ds=secva(q)
                      if ds:anns.append(f'PTR->{ds}:0x{q:x}')
                      a=cstr(q);w=wstr(q)
                      if a:anns.append(f'ASCII={a!r}')
                      if w:anns.append(f'WIDE={w!r}')
                      f.write(f'file=0x{qoff:x} va={hex(qva) if qva else None} q=0x{q:016x} '+ ' | '.join(anns)+'\n')
          PY

      - name: Commit pinpoint reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-pinpoint
          git commit -m 'Pinpoint APK2 FAES and save owner registration' || exit 0
          git pull --rebase origin main
          git push origin main
