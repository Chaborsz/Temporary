name: Build APK2 Save Runtime Probe v3

on:
  push:
    paths:
      - '.github/workflows/build-apk2-save-runtime-probe-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover and patch runtime probe source
        shell: pwsh
        run: |
          $raw = Get-Content '.github/workflows/build-apk2-save-runtime-probe.yml' -Raw
          $m1 = [regex]::Match($raw, "(?s)@'\r?\n(?<src>.*?)\r?\n\s*'@ \| Set-Content -Encoding UTF8 probe\.cpp")
          if (-not $m1.Success) { throw 'Could not recover probe.cpp' }
          $src = ($m1.Groups['src'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"

          $old = @'
          static void DumpBytes(const wchar_t* name, const void* p, size_t n) {
            FILE* f=nullptr; _wfopen_s(&f,OutPath(name).c_str(),L"wb"); if(!f)return;
            __try { std::fwrite(p,1,n,f); } __except(EXCEPTION_EXECUTE_HANDLER) {}
            std::fclose(f);
          }
          '@
          $new = @'
          static void DumpBytes(const wchar_t* name, const void* p, size_t n) {
            std::wstring path=OutPath(name);
            FILE* f=nullptr; _wfopen_s(&f,path.c_str(),L"wb"); if(!f)return;
            const size_t CH=0x10000; unsigned char tmp[CH]; size_t off=0;
            while(off<n){SIZE_T got=0;size_t want=(n-off)<CH?(n-off):CH;
              if(!ReadProcessMemory(GetCurrentProcess(),(const unsigned char*)p+off,tmp,want,&got)||got==0)break;
              std::fwrite(tmp,1,got,f);off+=got;if(got<want)break;}
            std::fclose(f);
          }
          '@
          if (-not $src.Contains($old.Trim())) { throw 'DumpBytes block not found for patch' }
          $src = $src.Replace($old.Trim(), $new.Trim())
          Set-Content probe.cpp -Value $src -Encoding UTF8

          $after = $raw.Substring($m1.Index + $m1.Length)
          $m2 = [regex]::Match($after, "(?s)@'\r?\n(?<def>.*?)\r?\n\s*'@ \| Set-Content -Encoding ASCII xinput\.def")
          if (-not $m2.Success) { throw 'Could not recover xinput.def' }
          $def = ($m2.Groups['def'].Value -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`r`n"
          Set-Content xinput.def -Value $def -Encoding ASCII
          Write-Host "probe.cpp lines=$((Get-Content probe.cpp).Count)"

      - name: Locate MSVC and compile x64 proxy
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSROOT=%%i
          if not defined VSROOT exit /b 2
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /O2 /EHsc /LD probe.cpp /link /DEF:xinput.def /OUT:XINPUT1_3.dll

      - name: Verify and package
        shell: pwsh
        run: |
          $dump = & dumpbin /headers /exports XINPUT1_3.dll | Out-String
          $dump | Set-Content exports.txt
          if ($dump -notmatch 'XInputGetState' -or $dump -notmatch 'XInputSetState') { throw 'Missing XInput exports' }
          if ($dump -notmatch 'machine \(x64\)') { throw 'Not x64' }
          Get-FileHash XINPUT1_3.dll -Algorithm SHA256 | Format-List | Out-File SHA256.txt
          @'
          APK2 Save Crypto Runtime Probe v3
          Diagnostic only; it does not write or replace DefaultData.sav.

          Copy XINPUT1_3.dll next to APK2-Win64-Shipping.exe, run the game with the native PC save, let save loading complete/attempt, close the game, then return every generated APK2_* file. Remove the DLL after the diagnostic run.
          '@ | Set-Content README_RUNTIME_PROBE.txt
          Compress-Archive XINPUT1_3.dll,README_RUNTIME_PROBE.txt,SHA256.txt,exports.txt -DestinationPath APK2-SaveCrypto-RuntimeProbe-v3.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: APK2-SaveCrypto-RuntimeProbe-v3
          path: APK2-SaveCrypto-RuntimeProbe-v3.zip
          retention-days: 7
