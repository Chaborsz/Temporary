name: APK2 targeted Ghidra decompile
on:
  push:
    paths: ['.github/workflows/apk2-ghidra-targeted.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch verified APK2 and Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  /tmp/APK2-Win64-Shipping.exe' | sha256sum -c -
          curl -L --fail --retry 5 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o /tmp/ghidra.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  /tmp/ghidra.zip' | sha256sum -c -
          rm -rf /tmp/ghidra-dist
          mkdir -p /tmp/ghidra-dist
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra-dist
          GHIDRA=$(find /tmp/ghidra-dist -maxdepth 2 -type d -name 'ghidra_12.1.4_PUBLIC*' -print -quit)
          test -n "$GHIDRA"
          test -x "$GHIDRA/support/analyzeHeadless"
          echo "GHIDRA=$GHIDRA" >> "$GITHUB_ENV"
          mkdir -p /tmp/ghidra-scripts /tmp/out /tmp/ghidra-proj
      - name: Write targeted decompiler script
        shell: bash
        run: |
          cat > /tmp/ghidra-scripts/APK2TargetDecompiler.java <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.app.cmd.disassemble.DisassembleCommand;
          import ghidra.app.cmd.function.CreateFunctionCmd;
          import ghidra.app.decompiler.DecompInterface;
          import ghidra.app.decompiler.DecompileResults;
          import ghidra.program.model.address.Address;
          import ghidra.program.model.address.AddressSet;
          import ghidra.program.model.listing.Function;
          import java.io.*;

          public class APK2TargetDecompiler extends GhidraScript {
            public void run() throws Exception {
              String outPath = getScriptArgs()[0];
              String[][] specs = {
                {"UAPKSaveGameManager_InternalCtor","1450d58c0","1450d5906"},
                {"CFManagerObject_BaseCtor","144d03fc0","144d04042"},
                {"ManagerRegistry_Ctor","144fd8575","144fd8794"},
                {"ManagerRegistry_InitLookup","1452dc8d0","1452dd180"},
                {"UAPKSaveGameManager_StaticClass","1450ce860","1450ce90d"},
                {"UAPKSaveGameManager_ZConstruct","1450ceb20","1450ceb4e"}
              };
              PrintWriter out = new PrintWriter(new FileWriter(outPath));
              out.println("PROGRAM=" + currentProgram.getName());
              out.println("IMAGE_BASE=" + currentProgram.getImageBase());
              DecompInterface dec = new DecompInterface();
              dec.toggleCCode(true);
              dec.toggleSyntaxTree(true);
              dec.openProgram(currentProgram);
              for (String[] s : specs) {
                Address start = toAddr(s[1]);
                Address end = toAddr(s[2]);
                out.println("\n===== " + s[0] + " " + start + "-" + end + " =====");
                AddressSet set = new AddressSet(start, end);
                new DisassembleCommand(start, set, true).applyTo(currentProgram, monitor);
                Function f = getFunctionAt(start);
                if (f == null) {
                  CreateFunctionCmd c = new CreateFunctionCmd(start);
                  c.applyTo(currentProgram, monitor);
                  f = getFunctionAt(start);
                }
                if (f == null) {
                  out.println("NO_FUNCTION");
                  continue;
                }
                try { f.setName(s[0], ghidra.program.model.symbol.SourceType.USER_DEFINED); } catch (Exception e) {}
                out.println("FUNCTION=" + f.getName() + " BODY=" + f.getBody());
                DecompileResults r = dec.decompileFunction(f, 120, monitor);
                if (!r.decompileCompleted() || r.getDecompiledFunction() == null) {
                  out.println("DECOMPILE_FAILED=" + r.getErrorMessage());
                } else {
                  out.println(r.getDecompiledFunction().getC());
                }
              }
              dec.dispose();
              out.close();
            }
          }
          JAVA
      - name: Import PE and decompile only target functions
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA/support/analyzeHeadless" /tmp/ghidra-proj APK2 \
            -import /tmp/APK2-Win64-Shipping.exe \
            -noanalysis \
            -scriptPath /tmp/ghidra-scripts \
            -postScript APK2TargetDecompiler.java /tmp/out/apk2-ghidra-targeted.txt \
            -deleteProject \
            > /tmp/out/ghidra-headless.log 2>&1
          echo '=== GHIDRA OUTPUT SIZE ==='
          wc -l -c /tmp/out/apk2-ghidra-targeted.txt /tmp/out/ghidra-headless.log
          echo '=== TARGETED HEAD ==='
          sed -n '1,500p' /tmp/out/apk2-ghidra-targeted.txt
      - name: Publish Ghidra result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-ghidra-targeted.txt analysis/ 2>/dev/null || true
          cp /tmp/out/ghidra-headless.log analysis/ 2>/dev/null || true
          git add analysis/apk2-ghidra-targeted.txt analysis/ghidra-headless.log 2>/dev/null || true
          git commit -m 'Add targeted Ghidra APK2 decompilation' || true
          git push origin HEAD:apk2-analysis-output
