name: Decode UAPKSaveGameLibrary reflection
on:
  push:
    paths: ['.github/workflows/apk2-save-library-reflection.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Decode SaveGameLibrary
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/a.exe
          python3 -m pip -q install pefile capstone
          mkdir -p /tmp/out
          python3 - <<'PY' > /tmp/out/apk2-save-library-reflection.txt
          import pefile,struct,bisect
          from pathlib import Path
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM,X86_REG_RIP,X86_REG_RDX,X86_OP_IMM
          b=Path('/tmp/a.exe').read_bytes();pe=pefile.PE('/tmp/a.exe',fast_load=False);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:secs.append((s.VirtualAddress,s.SizeOfRawData,s.PointerToRawData,s.Name.rstrip(b'\0').decode('ascii','replace'),s.Characteristics))
          def vo(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return raw+r-sr
          def ov(o):
            for sr,sz,raw,n,ch in secs:
              if raw<=o<raw+sz:return base+sr+(o-raw),n,ch
            return None,None,0
          def si(v):
            r=v-base
            for sr,sz,raw,n,ch in secs:
              if sr<=r<sr+sz:return n,ch
            return None,0
          def q(v):return struct.unpack_from('<Q',b,vo(v))[0]
          def d(v):return struct.unpack_from('<I',b,vo(v))[0]
          def cstr(v):
            o=vo(v)
            if o is None:return '<unmapped>'
            z=b.find(b'\0',o,o+500);z=o+500 if z<0 else z
            return b[o:z].decode('utf-8','replace')
          fs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
            s=base+e.struct.BeginAddress;e2=base+e.struct.EndAddress
            if s<e2:fs.append((s,e2))
          fs.sort();starts=[x[0] for x in fs]
          def cf(v):
            i=bisect.bisect_right(starts,v)-1
            return fs[i] if i>=0 and fs[i][0]<=v<fs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          classes={0x14a1cf718:'UAPKSaveGameLibrary',0x14a1d45d0:'UAPKSaveGameManager'}
          def extract_cp(zfn):
            f=cf(zfn);st=f[0] if f else zfn;en=f[1] if f else zfn+0x80;o=vo(st)
            if o is None:return None
            ins=list(md.disasm(b[o:o+min(en-st,0x200)],st))
            for x in ins:
              if x.mnemonic=='lea' and len(x.operands)>=2 and x.operands[0].reg==X86_REG_RDX and x.operands[1].type==X86_OP_MEM and x.operands[1].mem.base==X86_REG_RIP:
                return x.address+x.size+x.operands[1].mem.disp
            return None
          def decode_cp(cp,label):
            print(f'\n===== CLASSPARAMS {label} 0x{cp:x} =====')
            vals=[q(cp+i*8) for i in range(7)]
            labs=['ClassNoRegister','Config','CppInfo','Deps','FuncInfo','Props','Interfaces']
            for n,v in zip(labs,vals):print(n,hex(v),repr(cstr(v)) if n=='Config' and v else '')
            p=d(cp+0x38);flags=d(cp+0x3c);nd=p&0xf;nf=(p>>4)&0x7ff;np=(p>>15)&0x7ff;ni=(p>>26)&0x3f
            print('COUNTS deps',nd,'funcs',nf,'props',np,'interfaces',ni,'ClassFlags',hex(flags),'packed',hex(p))
            funcs=[]
            if vals[4]:
              for i in range(min(nf,128)):
                fn=q(vals[4]+i*16);nm=q(vals[4]+i*16+8);name=cstr(nm);funcs.append((fn,name));print('FUNC',i,hex(fn),repr(name),'pdata',cf(fn))
            if vals[5]:
              for i in range(min(np,128)):
                desc=q(vals[5]+i*8);nm=cstr(q(desc));to=q(desc+0x18);tail=q(desc+0x30)
                print('PROP',i,hex(desc),repr(nm),'gen',hex(to&0xff),'offset',hex((tail>>16)&0xffff),'arraydim',tail&0xffff)
            return funcs
          allfunc=[]
          for nameva,label in classes.items():
            pat=struct.pack('<Q',nameva);pos=0
            print(f'\n===== REGISTRATION POINTERS {label} nameVA=0x{nameva:x} =====')
            while True:
              i=b.find(pat,pos)
              if i<0:break
              sva,sn,ch=ov(i);print('NAMEPTR_SLOT',hex(sva) if sva else None,'file',hex(i),'sec',sn)
              if sva:
                for back in (16,8):
                  cand=q(sva-back);cs,cch=si(cand);print(' PREV',back,hex(cand),'sec',cs,'exec',bool(cch&0x20000000),'pdata',cf(cand))
                zfn=q(sva-16);cp=extract_cp(zfn);print(' ZFUNC',hex(zfn),'CLASSPARAMS',hex(cp) if cp else None)
                if cp:
                  funcs=decode_cp(cp,label);allfunc.extend((fn,label+'::'+nm) for fn,nm in funcs)
              pos=i+1
          print('\n===== UFUNCTION THUNKS + DIRECT CALLS =====')
          for fn,name in allfunc:
            f=cf(fn);st=f[0] if f else fn;en=f[1] if f else fn+0x300;o=vo(st)
            print(f'\n--- {name} thunk=0x{fn:x} range=0x{st:x}-0x{en:x} ---')
            if o is None:continue
            for x in md.disasm(b[o:o+min(en-st,0x1200)],st):
              extra=''
              if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:
                dst=x.operands[0].imm;extra=' DIRECT_CALL='+hex(dst)+' target_pdata='+repr(cf(dst))
              print(f'0x{x.address:x}: {x.mnemonic} {x.op_str}{extra}')
          PY
          wc -l -c /tmp/out/apk2-save-library-reflection.txt
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-save-library-reflection.txt analysis/
          git add analysis/apk2-save-library-reflection.txt
          git commit -m 'Decode APK save library reflection' || true
          git push origin HEAD:apk2-analysis-output
