name: Endurance ID2047 — x86 version.dll TEST
on:
  workflow_dispatch:
  push:
    paths:
      - "cheats/endurance/dll/**"
      - ".github/workflows/endurance-dll-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Compile 32-bit DLL and forwarder smoke test with MSVC (static CRT)
        shell: cmd
        run: |
          for /f "delims=" %%V in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do @set "VSROOT=%%V"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 2
          mkdir dist
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /LD /Fe:dist\version.dll cheats\endurance\dll\endurance2047_version.cpp /link /DEF:cheats\endurance\dll\version_proxy.def /OUT:dist\version.dll
          if errorlevel 1 exit /b 3
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /Fe:dist\proxy_smoke.exe cheats\endurance\dll\proxy_smoke.cpp /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 4
          cl /nologo /std:c++17 /W4 /O2 /MT /EHsc /Fe:dist\hook_smoke.exe cheats\endurance\dll\hook_smoke.cpp /link /SUBSYSTEM:CONSOLE
          if errorlevel 1 exit /b 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit PE architecture, exported names, and original method prologue
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          @'
          import pefile,hashlib
          exe='cheats/endurance/input/player.exe'
          assert hashlib.sha256(open(exe,'rb').read()).hexdigest()=='02a59baab7a4c941f9a01f485082396d61e750a41dc955cff895bef5395441ea'
          pe=pefile.PE(exe)
          assert pe.FILE_HEADER.Machine==0x14c
          rva=0x1e8760
          off=pe.get_offset_from_rva(rva)
          head=pe.__data__[off:off+6]
          assert head==bytes.fromhex('55 8b ec 83 e4 c0'),head.hex()
          dll=pefile.PE('dist/version.dll')
          assert dll.FILE_HEADER.Machine==0x14c,dll.FILE_HEADER.Machine
          assert dll.is_dll()
          exports={e.name.decode('ascii') for e in dll.DIRECTORY_ENTRY_EXPORT.symbols if e.name}
          needed={'GetFileVersionInfoSizeW','GetFileVersionInfoW','VerQueryValueW'}
          assert needed<=exports,needed-exports
          print('DLL_PE32_X86_PASS',len(exports),'exports')
          print('PLAYER_EXPORT_TARGET_PROLOGUE_PASS',head.hex())
          print('DLL_SIZE_BYTES',__import__('os').stat('dist/version.dll').st_size)
          '@ | python -
      - name: Run x86 proxy DLL and real Windows version API smoke test
        shell: cmd
        run: |
          cd dist
          proxy_smoke.exe
          if errorlevel 1 exit /b 1
          if not exist Endurance2047.log exit /b 2
          findstr /C:"GUARD_FAIL" Endurance2047.log
          if errorlevel 1 exit /b 3
          echo DLL_FOREIGN_PROCESS_GUARD_PASS
      - name: Verify 32-bit original-call ABI and exclusive 2047 filter
        shell: cmd
        run: dist\hook_smoke.exe
      - name: Store DLL and installation instructions
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Endurance-2047-VERSION-DLL-TEST-${{ github.run_id }}
          path: |
            dist/version.dll
            cheats/endurance/dll/README.md
          retention-days: 14
          if-no-files-found: error
