name: Identify APK2 save owner class

on:
  push:
    paths:
      - '.github/workflows/identify-apk2-save-owner-class.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace constructor and vtable references to class registration
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-save-owner-class
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM,X86_REG_RIP,X86_OP_IMM
          fn='APK2-Win64-Shipping.exe';out=Path('analysis-results/apk2-save-owner-class')
          b=Path(fn).read_bytes();pe=pefile.PE(fn,fast_load=False);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,'vsz':max(s.Misc_VirtualSize,s.SizeOfRawData),'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode(errors='replace')})
          def va2off(v):
              r=v-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:return s['raw']+(r-s['rva'])
          def secva(v):
              r=v-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['vsz']:return s['name']
          def cstr(v,lim=180):
              o=va2off(v)
              if o is None:return None
              x=b[o:o+lim].split(b'\0',1)[0]
              return x.decode('ascii','replace') if len(x)>1 and all(32<=c<127 for c in x) else None
          def wstr(v,lim=120):
              o=va2off(v)
              if o is None:return None
              z=[]
              for i in range(lim):
                  if o+2*i+1>=len(b):break
                  a,c=b[o+2*i],b[o+2*i+1]
                  if a==0 and c==0:break
                  if c or not 32<=a<127:return None
                  z.append(chr(a))
              return ''.join(z) if len(z)>1 else None
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              a=base+e.struct.BeginAddress;z=base+e.struct.EndAddress
              if a<z:funcs.append((a,z))
          funcs=sorted(set(funcs));starts=[a for a,z in funcs]
          def cf(v):
              i=bisect.bisect_right(starts,v)-1
              return funcs[i] if i>=0 and funcs[i][0]<=v<funcs[i][1] else None
          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          targets={0x144fd8575:'Owner_InternalConstructor',0x14a086760:'Owner_VTable0',0x14a086bc0:'Owner_VTable1'}
          candidates=[]
          # Direct calls to constructor plus validated RIP references to exact targets.
          for s in secs:
              if not(s['ch']&0x20000000):continue
              blob=b[s['raw']:s['raw']+s['sz']];sv=base+s['rva']
              # E8 calls
              p=0
              while True:
                  i=blob.find(b'\xe8',p)
                  if i<0:break
                  if i+5<=len(blob):
                      rel=struct.unpack_from('<i',blob,i+1)[0];src=sv+i;dst=src+5+rel
                      if dst in targets:candidates.append((src,dst,targets[dst],cf(src),'CALL'))
                  p=i+1
              # target-specific displacement scan; only inspect functions around matching disp values
              for dst,nm in targets.items():
                  # search each instruction via capstone only in pdata funcs near raw candidate rel values is cumbersome;
                  # raw scan common LEA/MOV RIP forms 48 8d/8b 05 disp32 over section bytes
                  for prefix in (b'\x48\x8d\x05',b'\x48\x8d\x0d',b'\x48\x8d\x15',b'\x48\x8d\x1d',b'\x48\x8d\x35',b'\x48\x8d\x3d',b'\x48\x8b\x05',b'\x4c\x8d\x05',b'\x4c\x8d\x0d'):
                      p=0
                      while True:
                          i=blob.find(prefix,p)
                          if i<0:break
                          if i+7<=len(blob):
                              rel=struct.unpack_from('<i',blob,i+3)[0];src=sv+i;actual=src+7+rel
                              if actual==dst:candidates.append((src,dst,nm,cf(src),'RIP'))
                          p=i+1
          groups={}
          for c in candidates:
              if c[3]:groups.setdefault(c[3],[]).append(c)
          with (out/'owner_refs.txt').open('w',encoding='utf-8') as f:
              f.write(f'CANDIDATES={len(candidates)} FUNCTIONS={len(groups)}\n')
              for (st,en),rows in sorted(groups.items()):
                  o=va2off(st)
                  if o is None or en-st>0x10000:continue
                  ins=list(md.disasm(b[o:o+(en-st)],st));imap={x.address:x for x in ins};good=[]
                  for src,dst,nm,fr,typ in rows:
                      x=imap.get(src)
                      if not x:continue
                      ok=False
                      if typ=='CALL' and x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM and x.operands[0].imm==dst:ok=True
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP and x.address+x.size+op.mem.disp==dst:ok=True
                      if ok:good.append((src,dst,nm,typ))
                  if not good:continue
                  f.write(f'\n===== FUNC 0x{st:x}-0x{en:x} size=0x{en-st:x} REFS={good} =====\n')
                  gm={x[0]:x for x in good}
                  for x in ins:
                      ann=[]
                      if x.address in gm:ann.append('OWNER_REF='+gm[x.address][2])
                      if x.mnemonic=='call' and x.operands and x.operands[0].type==X86_OP_IMM:ann.append(f'CALL->0x{x.operands[0].imm:x} pdata={cf(x.operands[0].imm)}')
                      for op in x.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              d=x.address+x.size+op.mem.disp;a=cstr(d);w=wstr(d)
                              if a:ann.append('ASCII='+repr(a))
                              if w:ann.append('WIDE='+repr(w))
                      f.write(f'0x{x.address:x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' | '.join(ann)) if ann else '')+'\n')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-owner-class
          git commit -m 'Identify APK2 class owning save manager instance' || exit 0
          git pull --rebase origin main
          git push origin main
