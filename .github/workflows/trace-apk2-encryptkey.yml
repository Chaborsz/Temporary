name: Trace APK2 EncryptKey

on:
  push:
    paths:
      - '.github/workflows/trace-apk2-encryptkey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace EncryptKey and manager metadata into code
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 \
            'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' \
            -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          python3 -m pip -q install pefile capstone
          mkdir -p analysis-results/apk2-encryptkey
          python3 - <<'PY'
          from pathlib import Path
          import pefile,struct,bisect,json,re,string
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64
          from capstone.x86 import X86_OP_MEM,X86_REG_RIP,X86_OP_IMM

          fn='APK2-Win64-Shipping.exe'; out=Path('analysis-results/apk2-encryptkey')
          b=Path(fn).read_bytes(); pe=pefile.PE(fn,fast_load=False); base=pe.OPTIONAL_HEADER.ImageBase
          secs=[]
          for s in pe.sections:
              secs.append({'raw':s.PointerToRawData,'sz':s.SizeOfRawData,'rva':s.VirtualAddress,
                           'ch':s.Characteristics,'name':s.Name.rstrip(b'\0').decode('ascii','replace')})
          def off2va(off):
              for s in secs:
                  if s['raw']<=off<s['raw']+s['sz']:
                      return base+s['rva']+(off-s['raw']),s['name']
              return None,None
          def va2off(va):
              r=va-base
              for s in secs:
                  if s['rva']<=r<s['rva']+s['sz']:
                      return s['raw']+(r-s['rva'])
              return None

          # Locate literal names exactly and map to VA.
          literal_specs=[('EncryptKey',b'EncryptKey'),('UAPKSaveGameManager','UAPKSaveGameManager'.encode('utf-16le')),
                         ('DefaultData','DefaultData'.encode('utf-16le'))]
          named={}; locrows=[]
          for label,needle in literal_specs:
              pos=0; idx=0
              while True:
                  off=b.find(needle,pos)
                  if off<0:break
                  va,sec=off2va(off)
                  locrows.append((label,off,va,sec))
                  if va is not None: named[va]=label if idx==0 else f'{label}#{idx}'
                  idx+=1; pos=off+1
          with (out/'literal_locations.txt').open('w') as f:
              for label,off,va,sec in locrows:
                  f.write(f'{label} file=0x{off:x} va={hex(va) if va else "NONE"} section={sec}\n')

          # Raw context around EncryptKey, both ASCII and qword interpretation.
          with (out/'encryptkey_context.txt').open('w') as f:
              for label,off,va,sec in locrows:
                  if not label.startswith('EncryptKey'): continue
                  lo=max(0,off-0x300); hi=min(len(b),off+0x500)
                  f.write(f'===== {label} file=0x{off:x} va={hex(va)} sec={sec} =====\n')
                  for p in range(lo,hi,16):
                      chunk=b[p:p+16]
                      asc=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
                      f.write(f'{p:08x}  {chunk.hex(" ")}  {asc}\n')

          # Recursively collect absolute pointer slots to literals (4 levels).
          targets=dict(named); prows=[]
          for level in range(1,5):
              new={}
              for tva,tname in list(targets.items()):
                  needle=struct.pack('<Q',tva); p=0
                  while True:
                      off=b.find(needle,p)
                      if off<0:break
                      sva,sec=off2va(off)
                      if sva is not None:
                          prows.append((level,sva,tva,tname,sec,off))
                          if sva not in targets and sva not in new:new[sva]=f'ptr{level}->{tname}'
                      p=off+1
              targets.update(new)
              if not new:break
          with (out/'pointer_chain.txt').open('w') as f:
              for row in sorted(set(prows)):
                  level,sva,tva,tname,sec,off=row
                  f.write(f'level={level} slot=0x{sva:x} -> 0x{tva:x} {tname} sec={sec} file=0x{off:x}\n')

          # PDATA boundaries.
          funcs=[]
          for e in pe.DIRECTORY_ENTRY_EXCEPTION:
              st=base+e.struct.BeginAddress; en=base+e.struct.EndAddress
              if st<en:funcs.append((st,en))
          funcs=sorted(set(funcs)); starts=[x[0] for x in funcs]
          def cfunc(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None

          # Fast byte-level RIP-relative scan to literal/pointer targets.
          ops={0x8d,0x8b,0x89,0x39,0x3b,0x31,0x33,0x21,0x23,0x09,0x0b,0x85,0x83,0x81,0xff}
          candidates=[]
          for s in secs:
              if not (s['ch'] & 0x20000000):continue
              buf=memoryview(b)[s['raw']:s['raw']+s['sz']]; secva=base+s['rva']; L=len(buf)
              for i in range(max(0,L-8)):
                  if 0x40<=buf[i]<=0x4f and buf[i+1] in ops and (buf[i+2]&0xc7)==0x05:
                      disp=struct.unpack_from('<i',buf,i+3)[0]; src=secva+i; dst=src+7+disp
                      if dst in targets:candidates.append((src,dst,targets[dst],s['name']))
                  if buf[i] in ops and (buf[i+1]&0xc7)==0x05:
                      disp=struct.unpack_from('<i',buf,i+2)[0]; src=secva+i; dst=src+6+disp
                      if dst in targets:candidates.append((src,dst,targets[dst],s['name']))
          candidates=sorted(set(candidates))

          # Validate candidates by disassembling from real function starts.
          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          valid=[]; grouped={}
          for src,dst,nm,sec in candidates:
              fr=cfunc(src)
              if fr:grouped.setdefault(fr,[]).append((src,dst,nm,sec))
          with (out/'validated_functions.txt').open('w') as f:
              for (st,en),rows in sorted(grouped.items()):
                  off=va2off(st)
                  if off is None:continue
                  insns=list(md.disasm(b[off:off+(en-st)],st)); imap={x.address:x for x in insns}
                  good=[]
                  for src,dst,nm,sec in rows:
                      ins=imap.get(src)
                      if not ins:continue
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              actual=ins.address+ins.size+op.mem.disp
                              if actual==dst:good.append((src,dst,nm,ins.mnemonic,ins.op_str))
                  if not good:continue
                  valid.extend((st,en,*g) for g in good)
                  f.write(f'\n===== FUNCTION 0x{st:x}-0x{en:x} size=0x{en-st:x} =====\n')
                  gadd={x[0]:x for x in good}; calls=[]
                  for ins in insns:
                      mark=''
                      if ins.address in gadd:
                          q=gadd[ins.address]; mark=f' <== REF {q[2]} @0x{q[1]:x}'
                      if ins.mnemonic=='call' and ins.operands and ins.operands[0].type==X86_OP_IMM:
                          calls.append(ins.operands[0].imm)
                      f.write(f'0x{ins.address:x}: {ins.mnemonic:9s} {ins.op_str}{mark}\n')
                  f.write('CALL_TARGETS='+','.join(hex(x) for x in sorted(set(calls)))+'\n')

          with (out/'validated_refs.txt').open('w') as f:
              for st,en,src,dst,nm,mn,ops2 in valid:
                  f.write(f'function=0x{st:x}-0x{en:x} src=0x{src:x} dst=0x{dst:x} target={nm} :: {mn} {ops2}\n')
              f.write(f'VALID_COUNT={len(valid)}\n')

          # Inventory plausible key literals: exactly 32 printable ASCII bytes or 64 hex chars.
          printable=set(bytes(string.printable,'ascii'))
          seen=set(); keyrows=[]
          for m in re.finditer(rb'(?<![0-9A-Fa-f])[0-9A-Fa-f]{64}(?![0-9A-Fa-f])',b):
              s=m.group().decode();
              if (m.start(),s) not in seen:keyrows.append((m.start(),'HEX64',s));seen.add((m.start(),s))
          # Null-terminated printable strings length 32 exactly.
          for m in re.finditer(rb'(?<![ -~])[ -~]{32}\x00',b):
              s=m.group()[:-1].decode('ascii','replace')
              if (m.start(),s) not in seen:keyrows.append((m.start(),'ASCII32',s));seen.add((m.start(),s))
          with (out/'candidate_key_literals.txt').open('w') as f:
              for off,typ,s in keyrows:
                  va,sec=off2va(off)
                  f.write(f'{typ} file=0x{off:x} va={hex(va) if va else "NONE"} sec={sec} {s}\n')
          print('literal locations',locrows)
          print('pointer slots',len(prows),'candidate refs',len(candidates),'validated refs',len(valid),'key literals',len(keyrows))
          PY
      - name: Commit trace reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-encryptkey
          git commit -m 'Trace APK2 EncryptKey references' || exit 0
          git pull --rebase origin main
          git push origin main
