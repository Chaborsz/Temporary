name: LoliSnatcher Windows x64 True Portable v8

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "LoliSnatcher_Droid branch, tag, or commit"
        required: true
        default: "master"
        type: string
      flutter_version:
        description: "Flutter SDK version"
        required: true
        default: "3.47.3"
        type: string
  push:
    paths:
      - ".github/scripts/lolisnatcher_true_portable_patch.py"
      - ".github/scripts/lolisnatcher_v4_patch.py"
      - ".github/scripts/lolisnatcher_v5_login_cloudflare_patch.py"
      - ".github/scripts/lolisnatcher_v6_nginx_antiddos_patch.py"
      - ".github/scripts/lolisnatcher_v7_native_inappbrowser_patch.py"
      - ".github/scripts/lolisnatcher_v7_import_fix.py"
      - ".github/scripts/lolisnatcher_v8_compressed_visual_cache_patch.py"
      - ".github/scripts/lolisnatcher_v8_cache_path_label_fix.py"
      - ".github/scripts/lolisnatcher_v8_webp_thumbnail_cache_patch.py"
      - ".github/scripts/lolisnatcher_v8_danbooru_login_dialog_patch.py"
      - ".github/scripts/lolisnatcher_v8_4_apikey_first_auth_patch.py"
      - ".github/scripts/lolisnatcher_v8_5_verified_danbooru_login_patch.py"
      - ".github/scripts/lolisnatcher_v8_6_danbooru_login_validation_patch.py"
      - ".github/scripts/lolisnatcher_v8_7_danbooru_challenge_auth_patch.py"
      - ".github/scripts/lolisnatcher_v8_8_danbooru_identity_diagnostic_patch.py"
      - ".github/scripts/lolisnatcher_v8_9_gallery_freeze_hotfix.py"
      - ".github/scripts/lolisnatcher_v8_10_bounded_visual_pipeline.py"
      - ".github/scripts/lolisnatcher_v8_11_freeze_rootcause_patch.py"
      - ".github/scripts/lolisnatcher_v8_12_visual_cache_integrity_patch.py"
      - ".github/scripts/lolisnatcher_v8_13_danbooru_page_batch_patch.py"
      - ".github/scripts/lolisnatcher_v8_14_incremental_catalog_merge_patch.py"
      - ".github/scripts/lolisnatcher_v8_15_strict_db_only_visual_cache_patch.py"
      - ".github/scripts/lolisnatcher_v8_16_visual_decode_and_tag_idle_patch.py"
      - ".github/scripts/lolisnatcher_v8_17_sqlite_batching_patch.py"
      - ".github/scripts/lolisnatcher_v11_generic_danbooru_auth.py"
      - ".github/scripts/lolisnatcher_sync_esmx.py"

permissions:
  contents: write

concurrency:
  group: lolisnatcher-windows-portable-v8-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / True Portable v8.17 / Canonical Release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    steps:
      - name: Checkout builder scripts
        uses: actions/checkout@v5
        with:
          path: builder
          fetch-depth: 1

      - name: Checkout LoliSnatcher source
        uses: actions/checkout@v5
        with:
          repository: NO-ob/LoliSnatcher_Droid
          ref: ${{ inputs.source_ref || 'master' }}
          path: LoliSnatcher_Droid
          fetch-depth: 1

      - name: Read source metadata
        id: meta
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $versionLine = (Get-Content pubspec.yaml | Select-String '^version:\s*' | Select-Object -First 1).Line
          if ($versionLine -notmatch '^version:\s*([^\s+]+)\+(\d+)') { throw "Could not parse version: $versionLine" }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "build=$($Matches[2])" >> $env:GITHUB_OUTPUT

      - name: Apply portable patches through v8.17
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          python ..\builder\.github\scripts\lolisnatcher_true_portable_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v4_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v5_login_cloudflare_patch.py
          $path = 'lib\src\widgets\webview\webview_page.dart'
          $text = Get-Content $path -Raw
          $old = '          await webViewController.dispose();'
          $new = '          webViewController.dispose();'
          if (-not $text.Contains($old)) { throw 'Expected v5 WebView dispose call was not found' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -Encoding UTF8 -NoNewline
          python ..\builder\.github\scripts\lolisnatcher_v6_nginx_antiddos_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v7_native_inappbrowser_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v7_import_fix.py
          python ..\builder\.github\scripts\lolisnatcher_v8_compressed_visual_cache_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v8_cache_path_label_fix.py
          python ..\builder\.github\scripts\lolisnatcher_v8_webp_thumbnail_cache_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v11_generic_danbooru_auth.py
          'PATCH_CHAIN_V8_17=PASS'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.47.3' }}
          cache: false

      - name: Enable Windows desktop
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          dart --version

      - name: Install dependencies
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: flutter pub get

      - name: Verify image dependency
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          $lock = Get-Content pubspec.lock -Raw
          if ($lock -notmatch '(?ms)^  image:\s+.*?version: "4\.10\.2"') { throw 'image 4.10.2 was not resolved' }
          'IMAGE_4_10_2=PASS'

      - name: Verify PR2838 plugin resolution
        shell: bash
        working-directory: LoliSnatcher_Droid
        run: |
          python - <<'PY'
          from pathlib import Path
          expected='832d6517b50b3b8094d2658800aa84ee5b9294bf'
          lock=Path('pubspec.lock').read_text(encoding='utf-8')
          if expected not in lock:
              raise SystemExit('PR2838 commit missing from pubspec.lock')
          print('PR2838=PASS')
          PY

      - name: Sync current es-MX from POEditor
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: python ..\builder\.github\scripts\lolisnatcher_sync_esmx.py

      - name: Regenerate Slang localization
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          dart run slang
          $generated = Get-Content lib\gen\strings_es_MX.g.dart -Raw
          if (-not $generated.Contains('class Translations$settings$es_MX')) { throw 'Generated es-MX missing' }
          'ES_MX_GENERATED=PASS'

      - name: Analyze patched Dart source
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          dart format lib/main.dart lib/src/boorus/danbooru_handler.dart lib/src/handlers/booru_handler.dart lib/src/handlers/tag_handler.dart lib/src/handlers/database_handler.dart lib/src/handlers/service_handler.dart lib/src/utils/logger.dart lib/src/handlers/secure_storage_handler.dart lib/src/pages/settings/language_page.dart lib/src/pages/settings/booru_page.dart lib/src/pages/settings/booru_edit_page.dart lib/src/pages/settings/save_cache_page.dart lib/src/widgets/webview/webview_page.dart lib/src/widgets/image/custom_network_image.dart lib/src/widgets/image/image_viewer.dart lib/src/widgets/thumbnail/thumbnail.dart lib/src/services/image_writer.dart lib/src/services/image_writer_isolate.dart lib/src/services/compressed_visual_cache.dart lib/src/services/portable_media_policy.dart lib/src/utils/tools.dart lib/src/utils/dio_network.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src/boorus/danbooru_handler.dart lib/src/handlers/booru_handler.dart lib/src/handlers/tag_handler.dart lib/src/handlers/database_handler.dart lib/src/handlers/service_handler.dart lib/src/utils/logger.dart lib/src/handlers/secure_storage_handler.dart lib/src/pages/settings/language_page.dart lib/src/pages/settings/booru_page.dart lib/src/pages/settings/booru_edit_page.dart lib/src/pages/settings/save_cache_page.dart lib/src/widgets/webview/webview_page.dart lib/src/widgets/image/custom_network_image.dart lib/src/widgets/image/image_viewer.dart lib/src/widgets/thumbnail/thumbnail.dart lib/src/services/image_writer.dart lib/src/services/image_writer_isolate.dart lib/src/services/compressed_visual_cache.dart lib/src/services/portable_media_policy.dart lib/src/utils/tools.dart lib/src/utils/dio_network.dart

      - name: Build Windows x64 Release
        id: build
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          flutter build windows --release
          $exe = 'build\windows\x64\runner\Release\lolisnatcher.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }

      - name: Package True Portable v8.17 build
        id: package
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.3' }}
        run: |
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $outDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $dataDir = Join-Path $releaseDir 'Data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          @"
          LoliSnatcher TRUE PORTABLE Windows x64 - v8.17

          Runtime invariants:
          - Danbooru login/API-key validation from v8.8 is retained.
          - Windows catalog requests thumbnailURL only; samples are viewer-only and memory-only.
          - Persistent visual thumbnails are DB-only in Data\LoliSnatcher\cache\visual_cache.db.
          - Loose thumbnails/samples paths are forbidden and legacy loose folders are purged.
          - WebP runtime conversion is disabled; thumbnail source bytes are stored in the DB.
          - Danbooru page merge is incremental (merge_ms expected near 0).
          - Windows visual thumbnail load/decode pipeline is serialized (max 1).
          - Typed tag persistence is coalesced after 2.5s quiet and now uses true SQLite bulk lookup/batches.
          - Thumbnail BLOB persistence is coalesced into SQLite batches (max 16 / 100 ms).
          - Performance diagnostics are written to Data\performance-stalls.log; slow visual DB batches emit VISUAL_DB_BATCH.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dataDir 'PORTABLE-README.txt')
          @(
            "PROJECT=LoliSnatcher_Droid"
            "SOURCE_SHA=$env:SOURCE_SHA"
            "VERSION=$env:VERSION+$env:BUILD_NUMBER"
            "FLUTTER_VERSION=$env:FLUTTER_VERSION"
            "TARGET=windows-x64"
            "CONFIGURATION=Release"
            "PORTABLE_MODE=TRUE"
            "PATCH_LEVEL=TRUE_PORTABLE_V8_17"
            "WORKFLOW_LINE=V8_CANONICAL"
            "DANBOORU_AUTH=V8_8_VERIFIED_LOGIN"
            "VISUAL_CACHE=.\Data\LoliSnatcher\cache\visual_cache.db"
            "VISUAL_CACHE_MODE=DB_ONLY_SOURCE_BYTES"
            "LOOSE_THUMBNAILS_SAMPLES=FORBIDDEN"
            "WINDOWS_GRID_PREVIEW=THUMBNAIL_ONLY"
            "FULLRES_VIEWER_CACHE=MEMORY_ONLY"
            "WINDOWS_VISUAL_PIPELINE_MAX=1"
            "DANBOORU_INCREMENTAL_MERGE=TRUE"
            "TAG_IDLE_COALESCE_MS=2500"
            "TAG_SQLITE_MODE=TRUE_BULK_LOOKUP_BATCH"
            "TAG_SQLITE_LOOKUP_CHUNK=400"
            "VISUAL_DB_BATCH_MAX=16"
            "VISUAL_DB_COALESCE_MS=100"
            "PERFORMANCE_STALL_LOG=.\Data\performance-stalls.log"
            "ENABLED_LOCALE=es_MX"
            "INAPPWEBVIEW_WINDOWS_FIX=FULL_PR2838_832d6517b50b3b8094d2658800aa84ee5b9294bf"
            "WORKFLOW_RUN=${{ github.run_id }}"
          ) | Set-Content -Encoding UTF8 (Join-Path $releaseDir 'BUILD-INFO.txt')
          $zipName = "LoliSnatcher-$env:VERSION+$env:BUILD_NUMBER-Windows-x64-TruePortable.zip"
          $zipPath = Join-Path $outDir $zipName
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ASCII (Join-Path $outDir "$zipName.sha256")
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "SHA256=$hash"

      - name: Publish canonical True Portable v8.17 prerelease
        id: release
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.3' }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = "lolisnatcher-windows-trueportable-$env:VERSION-$env:BUILD_NUMBER"
          $zipPath = Join-Path $PWD "dist\$env:ZIP_NAME"
          $hashPath = "$zipPath.sha256"
          $title = "LoliSnatcher $env:VERSION+$env:BUILD_NUMBER Windows x64 True Portable v8.17"
          $notes = @"
          Unofficial TRUE PORTABLE Windows x64 build - canonical v8.17.

          v8.17 retains verified Danbooru authentication, strict DB-only thumbnails, memory-only samples/full-resolution viewer data, incremental Danbooru page merge and the serialized Windows visual pipeline. It replaces per-tag SQLite round-trips with true bulk lookup/batched writes and coalesces thumbnail BLOB persistence into bounded SQLite batches. Slow visual DB batches are reported as VISUAL_DB_BATCH in Data\performance-stalls.log.

          v7 remains a superseded historical workflow with a separate tag/asset namespace and cannot overwrite this release.

          Upstream commit: $env:SOURCE_SHA
          Flutter: $env:FLUTTER_VERSION
          "@
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath $hashPath --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload canonical v8 assets' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          } else {
            gh release create $tag $zipPath $hashPath --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }

          $apiPath = "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $releaseJson = gh api $apiPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read canonical release metadata' }
          $remoteRelease = $releaseJson | ConvertFrom-Json
          $remoteAsset = $remoteRelease.assets | Where-Object { $_.name -eq $env:ZIP_NAME } | Select-Object -First 1
          if ($null -eq $remoteAsset) { throw "Canonical ZIP asset missing: $env:ZIP_NAME" }
          $remoteDigest = [string]$remoteAsset.digest
          if ($remoteDigest -ne "sha256:$env:EXPECTED_SHA") {
            throw "Canonical asset digest mismatch: remote=$remoteDigest expected=sha256:$env:EXPECTED_SHA"
          }
          $remoteBody = [string]$remoteRelease.body
          if ($remoteBody -notmatch 'canonical v8\.17') { throw 'Canonical release notes do not identify v8.17' }
          'V8_17_CANONICAL_ASSET_DIGEST=PASS'
          'V8_17_RELEASE_IDENTITY=PASS'

          $releaseUrl = [string]$remoteRelease.html_url
          "release_url=$releaseUrl" >> $env:GITHUB_OUTPUT

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## LoliSnatcher Windows x64 True Portable v8.17
          - Build: `${{ steps.build.outcome }}`
          - Patch level: TRUE_PORTABLE_V8_17
          - Verified Danbooru auth: retained
          - Windows visual cache: SQLite DB-only
          - Loose samples/thumbnails: forbidden + purge
          - Performance diagnostics: Data\performance-stalls.log
          - Incremental page merge: retained
          - Windows visual pipeline max: 1
          - Tag idle coalescing: 2500 ms
          - Tag SQLite persistence: bulk lookup + Batch
          - Visual DB persistence: max 16 / 100 ms coalescing
          - Canonical asset digest verification: `${{ steps.release.outcome }}`
          - SHA-256: `${{ steps.package.outputs.sha256 }}`
          - Release: ${{ steps.release.outputs.release_url }}
          "@ >> $env:GITHUB_STEP_SUMMARY
