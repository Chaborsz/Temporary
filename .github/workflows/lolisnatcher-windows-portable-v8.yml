name: LoliSnatcher Windows x64 True Portable v8

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "LoliSnatcher_Droid branch, tag, or commit"
        required: true
        default: "master"
        type: string
      flutter_version:
        description: "Flutter SDK version"
        required: true
        default: "3.47.3"
        type: string
  push:
    paths:
      - ".github/scripts/lolisnatcher_*.py"
      - ".github/workflows/lolisnatcher-windows-portable-v8.yml"

permissions:
  contents: write

concurrency:
  group: lolisnatcher-windows-portable-v8-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / True Portable v8.21 / Canonical Release
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    steps:
      - name: Checkout builder scripts
        uses: actions/checkout@v5
        with:
          path: builder
          fetch-depth: 1

      - name: Checkout LoliSnatcher source
        uses: actions/checkout@v5
        with:
          repository: NO-ob/LoliSnatcher_Droid
          ref: ${{ inputs.source_ref || 'master' }}
          path: LoliSnatcher_Droid
          fetch-depth: 1

      - name: Read source metadata
        id: meta
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          $versionLine = (Get-Content pubspec.yaml | Select-String '^version:\s*' | Select-Object -First 1).Line
          if ($versionLine -notmatch '^version:\s*([^\s+]+)\+(\d+)') { throw "Could not parse version: $versionLine" }
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "build=$($Matches[2])" >> $env:GITHUB_OUTPUT

      - name: Apply portable patches through v8.21
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          python ..\builder\.github\scripts\lolisnatcher_true_portable_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v4_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v5_login_cloudflare_patch.py
          $path = 'lib\src\widgets\webview\webview_page.dart'
          $text = Get-Content $path -Raw
          $old = '          await webViewController.dispose();'
          $new = '          webViewController.dispose();'
          if (-not $text.Contains($old)) { throw 'Expected v5 WebView dispose call was not found' }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -Encoding UTF8 -NoNewline
          python ..\builder\.github\scripts\lolisnatcher_v6_nginx_antiddos_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v7_native_inappbrowser_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v7_import_fix.py
          python ..\builder\.github\scripts\lolisnatcher_v8_compressed_visual_cache_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v8_cache_path_label_fix.py
          python ..\builder\.github\scripts\lolisnatcher_v8_webp_thumbnail_cache_patch.py
          python ..\builder\.github\scripts\lolisnatcher_v11_generic_danbooru_auth.py
          'PATCH_CHAIN_V8_21=PASS'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.47.3' }}
          cache: false

      - name: Enable Windows desktop
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter --version
          dart --version

      - name: Install dependencies
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: flutter pub get

      - name: Verify pinned dependencies
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          $lock = Get-Content pubspec.lock -Raw
          if ($lock -notmatch '(?ms)^  image:\s+.*?version: "4\.10\.2"') { throw 'image 4.10.2 was not resolved' }
          if ($lock -notmatch '832d6517b50b3b8094d2658800aa84ee5b9294bf') { throw 'PR2838 commit missing from pubspec.lock' }
          'PINNED_DEPENDENCIES=PASS'

      - name: Sync current es-MX from POEditor
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: python ..\builder\.github\scripts\lolisnatcher_sync_esmx.py

      - name: Regenerate Slang localization
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          dart run slang
          $generated = Get-Content lib\gen\strings_es_MX.g.dart -Raw
          if (-not $generated.Contains('class Translations$settings$es_MX')) { throw 'Generated es-MX missing' }
          'ES_MX_GENERATED=PASS'

      - name: Analyze patched Dart source
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          dart format lib/main.dart lib/src/boorus/danbooru_handler.dart lib/src/handlers/booru_handler.dart lib/src/handlers/tag_handler.dart lib/src/handlers/database_handler.dart lib/src/handlers/service_handler.dart lib/src/utils/logger.dart lib/src/handlers/secure_storage_handler.dart lib/src/pages/settings/language_page.dart lib/src/pages/settings/booru_page.dart lib/src/pages/settings/booru_edit_page.dart lib/src/pages/settings/save_cache_page.dart lib/src/widgets/webview/webview_page.dart lib/src/widgets/image/custom_network_image.dart lib/src/widgets/image/image_viewer.dart lib/src/widgets/thumbnail/thumbnail.dart lib/src/services/image_writer.dart lib/src/services/image_writer_isolate.dart lib/src/services/compressed_visual_cache.dart lib/src/services/portable_media_policy.dart lib/src/services/performance_watchdog.dart lib/src/utils/tools.dart lib/src/utils/dio_network.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src/boorus/danbooru_handler.dart lib/src/handlers/booru_handler.dart lib/src/handlers/tag_handler.dart lib/src/handlers/database_handler.dart lib/src/handlers/service_handler.dart lib/src/utils/logger.dart lib/src/handlers/secure_storage_handler.dart lib/src/pages/settings/language_page.dart lib/src/pages/settings/booru_page.dart lib/src/pages/settings/booru_edit_page.dart lib/src/pages/settings/save_cache_page.dart lib/src/widgets/webview/webview_page.dart lib/src/widgets/image/custom_network_image.dart lib/src/widgets/image/image_viewer.dart lib/src/widgets/thumbnail/thumbnail.dart lib/src/services/image_writer.dart lib/src/services/image_writer_isolate.dart lib/src/services/compressed_visual_cache.dart lib/src/services/portable_media_policy.dart lib/src/services/performance_watchdog.dart lib/src/utils/tools.dart lib/src/utils/dio_network.dart

      - name: Build Windows x64 Release
        id: build
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        run: |
          flutter build windows --release
          $exe = 'build\windows\x64\runner\Release\lolisnatcher.exe'
          if (-not (Test-Path $exe)) { throw "Expected executable not found: $exe" }

      - name: Package True Portable v8.21 build
        id: package
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.3' }}
        run: |
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $outDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $dataDir = Join-Path $releaseDir 'Data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          @"
          LoliSnatcher TRUE PORTABLE Windows x64 - v8.21

          Runtime invariants:
          - Danbooru verified login/API-key behavior is retained.
          - Windows catalog remains thumbnailURL-only; samples/full-res viewer data remain memory-only.
          - Persistent visual thumbnails remain DB-only in Data\LoliSnatcher\cache\visual_cache.db.
          - Loose thumbnails/samples remain forbidden and legacy loose folders are purged.
          - WebP runtime conversion remains disabled; thumbnail source bytes are stored in the DB.
          - Danbooru page merge remains incremental.
          - Windows visual thumbnail load/decode pipeline remains serialized (max 1).
          - Windows packed-thumbnail Dio clients remain persistent/reused.
          - Typed Danbooru tags remain coalesced after 5s quiet and persisted with at most one DB call per flush.
          - Tag-map processing remains cooperatively sliced every 32 tags.
          - Deferred tracked-state refreshes are serialized and use compact IN lookups plus O(1) result maps.
          - Optional DB indexes now include BooruItem postURL/fileURL when indexesEnabled is on.
          - TRACKED_BATCH logs lookup/apply/change timing; TAG_BATCH retains slice diagnostics.
          - Independent watchdog isolate flushes >=150 ms stalls immediately with active phase labels.
          - In-isolate EVENT_LOOP_STALL sampling is 50 ms with a 150 ms threshold.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dataDir 'PORTABLE-README.txt')
          @(
            "PROJECT=LoliSnatcher_Droid"
            "SOURCE_SHA=$env:SOURCE_SHA"
            "VERSION=$env:VERSION+$env:BUILD_NUMBER"
            "FLUTTER_VERSION=$env:FLUTTER_VERSION"
            "TARGET=windows-x64"
            "CONFIGURATION=Release"
            "PORTABLE_MODE=TRUE"
            "PATCH_LEVEL=TRUE_PORTABLE_V8_21"
            "WORKFLOW_LINE=V8_CANONICAL"
            "DANBOORU_AUTH=V8_8_VERIFIED_LOGIN"
            "VISUAL_CACHE=.\Data\LoliSnatcher\cache\visual_cache.db"
            "VISUAL_CACHE_MODE=DB_ONLY_SOURCE_BYTES"
            "LOOSE_THUMBNAILS_SAMPLES=FORBIDDEN"
            "WINDOWS_GRID_PREVIEW=THUMBNAIL_ONLY"
            "FULLRES_VIEWER_CACHE=MEMORY_ONLY"
            "WINDOWS_VISUAL_PIPELINE_MAX=1"
            "WINDOWS_VISUAL_HTTP_CLIENT=REUSED_PERSISTENT"
            "DANBOORU_INCREMENTAL_MERGE=TRUE"
            "TAG_IDLE_COALESCE_MS=5000"
            "TAG_CATEGORY_PASS=SINGLE"
            "TAG_DB_CALLS_PER_FLUSH_MAX=1"
            "TAG_SQLITE_MODE=TRUE_BULK_LOOKUP_BATCH"
            "TAG_SQLITE_LOOKUP_CHUNK=900"
            "TAG_STALE_CUTOFF=PER_FLUSH"
            "TAG_MAP_SLICE_SIZE=32"
            "TAG_MAP_COOPERATIVE_YIELD=TRUE"
            "TRACKED_LOOKUP=IN_QUERY_O1_MAP"
            "TRACKED_REFRESH_SERIAL=TRUE"
            "TRACKED_URL_INDEXES=WHEN_INDEXES_ENABLED"
            "VISUAL_DB_BATCH_MAX=16"
            "VISUAL_DB_COALESCE_MS=100"
            "VISUAL_DIAGNOSTIC_CODEC_THRESHOLD_MS=25"
            "WATCHDOG_ISOLATE=TRUE"
            "WATCHDOG_STALL_THRESHOLD_MS=150"
            "EVENT_LOOP_STALL_THRESHOLD_MS=150"
            "PERFORMANCE_STALL_LOG=.\Data\performance-stalls.log"
            "ENABLED_LOCALE=es_MX"
            "INAPPWEBVIEW_WINDOWS_FIX=FULL_PR2838_832d6517b50b3b8094d2658800aa84ee5b9294bf"
            "WORKFLOW_RUN=${{ github.run_id }}"
          ) | Set-Content -Encoding UTF8 (Join-Path $releaseDir 'BUILD-INFO.txt')
          $zipName = "LoliSnatcher-$env:VERSION+$env:BUILD_NUMBER-Windows-x64-TruePortable.zip"
          $zipPath = Join-Path $outDir $zipName
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Encoding ASCII (Join-Path $outDir "$zipName.sha256")
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "SHA256=$hash"

      - name: Publish canonical True Portable v8.21 prerelease
        id: release
        shell: pwsh
        working-directory: LoliSnatcher_Droid
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.3' }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          EXPECTED_SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          $tag = "lolisnatcher-windows-trueportable-$env:VERSION-$env:BUILD_NUMBER"
          $zipPath = Join-Path $PWD "dist\$env:ZIP_NAME"
          $hashPath = "$zipPath.sha256"
          $title = "LoliSnatcher $env:VERSION+$env:BUILD_NUMBER Windows x64 True Portable v8.21"
          $notes = @"
          Unofficial TRUE PORTABLE Windows x64 build - canonical v8.21.

          v8.21 retains all v8.20 tag slicing and v8.18-v8.19 visual/SQLite fixes. Runtime evidence from v8.20 showed TAG_BATCH 419 tags completing in 86 ms with map_ms=0, while a later SLOW_FRAME=202 ms occurred with build/raster near 1 ms and pending=0. The deferred tracked-state refresh was outside PAGE_PHASE and used a long OR query over BooruItem postURL/fileURL without creating the corresponding optional URL indexes. v8.21 rewrites that lookup to compact IN sets plus O(1) maps, updates Rx flags only when values change, serializes Danbooru tracked refreshes, restores URL indexes when indexesEnabled is on, and adds TRACKED_BATCH diagnostics. A separate watchdog isolate now writes >=150 ms stall markers immediately with active phase labels so hard freezes survive process termination.

          LoliSnatcher work is maintained on branch lolisnatcher-canonical-v8 to avoid unrelated Temporary-repository commits overwriting its canonical build chain.

          Upstream commit: $env:SOURCE_SHA
          Flutter: $env:FLUTTER_VERSION
          "@
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath $hashPath --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload canonical v8 assets' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          } else {
            gh release create $tag $zipPath $hashPath --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag" }

          $apiPath = "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $releaseJson = gh api $apiPath
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read canonical release metadata' }
          $remoteRelease = $releaseJson | ConvertFrom-Json
          $remoteAsset = $remoteRelease.assets | Where-Object { $_.name -eq $env:ZIP_NAME } | Select-Object -First 1
          if ($null -eq $remoteAsset) { throw "Canonical ZIP asset missing: $env:ZIP_NAME" }
          $remoteDigest = [string]$remoteAsset.digest
          if ($remoteDigest -ne "sha256:$env:EXPECTED_SHA") {
            throw "Canonical asset digest mismatch: remote=$remoteDigest expected=sha256:$env:EXPECTED_SHA"
          }
          if ([string]$remoteRelease.body -notmatch 'canonical v8\.21') { throw 'Canonical release notes do not identify v8.21' }
          'V8_21_CANONICAL_ASSET_DIGEST=PASS'
          'V8_21_RELEASE_IDENTITY=PASS'
          "release_url=$([string]$remoteRelease.html_url)" >> $env:GITHUB_OUTPUT

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## LoliSnatcher Windows x64 True Portable v8.21
          - Build: `${{ steps.build.outcome }}`
          - Patch level: TRUE_PORTABLE_V8_21
          - Verified Danbooru auth: retained
          - Windows visual cache: SQLite DB-only
          - Windows visual pipeline max: 1
          - Windows visual HTTP client: persistent/reused
          - Incremental page merge: retained
          - Tag idle coalescing: 5000 ms
          - Tag DB calls per flush: max 1
          - Tag map cooperative slice: 32
          - Tracked lookup: IN query + O(1) maps
          - Tracked refresh serialization: enabled
          - Tracked URL indexes: when indexesEnabled
          - Watchdog isolate threshold: 150 ms
          - Event-loop stall threshold: 150 ms
          - Canonical asset digest verification: `${{ steps.release.outcome }}`
          - SHA-256: `${{ steps.package.outputs.sha256 }}`
          - Release: ${{ steps.release.outputs.release_url }}
          "@ >> $env:GITHUB_STEP_SUMMARY
