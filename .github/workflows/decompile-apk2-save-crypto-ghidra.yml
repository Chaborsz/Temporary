name: Decompile APK2 save crypto with Ghidra

on:
  push:
    paths:
      - '.github/workflows/decompile-apk2-save-crypto-ghidra.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch APK2 and Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o APK2-Win64-Shipping.exe
          echo 'ce3bc03574a9a3e76420c54ec8548a8a113175422a432c1f3f968baf54746940  APK2-Win64-Shipping.exe' | sha256sum -c -
          curl -L --fail --retry 5 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip' -o ghidra.zip
          echo 'ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip' | sha256sum -c -
          unzip -q ghidra.zip
          echo "GHIDRA_DIR=$(find . -maxdepth 1 -type d -name 'ghidra_*' | head -n1)" >> "$GITHUB_ENV"
          mkdir -p ghidra_scripts ghidra_project analysis-results/apk2-save-crypto-ghidra
      - name: Write targeted script
        shell: bash
        run: |
          cat > ghidra_scripts/APK2CryptoDecompile.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import java.io.*;
          public class APK2CryptoDecompile extends GhidraScript {
            private Function ensure(String s) throws Exception {
              Address a=toAddr(s); Function f=getFunctionAt(a);
              if(f==null){disassemble(a);f=createFunction(a,"APK2_crypto_"+s);}
              if(f==null)f=getFunctionContaining(a); return f;
            }
            public void run() throws Exception {
              String[] ts={"14582caa0","14582ce60","1412a18e0","1412a1dc0","1412a1870","1412a1150","1412a14e0"};
              PrintWriter pw=new PrintWriter(new FileWriter("analysis-results/apk2-save-crypto-ghidra/decompiled.txt"));
              DecompInterface di=new DecompInterface();di.toggleCCode(true);di.toggleSyntaxTree(true);di.setSimplificationStyle("decompile");di.openProgram(currentProgram);
              for(String s:ts){
                pw.println("\n===== TARGET 0x"+s+" ====="); Function f=ensure(s);
                if(f==null){pw.println("NO_FUNCTION");continue;}
                pw.println("ENTRY="+f.getEntryPoint()+" BODY="+f.getBody());
                DecompileResults r=di.decompileFunction(f,120,monitor);
                if(r.decompileCompleted())pw.println(r.getDecompiledFunction().getC()); else pw.println("FAIL "+r.getErrorMessage());
              }
              di.dispose();pw.close();
            }
          }
          JAVA
      - name: Targeted decompile
        shell: bash
        run: |
          set -euo pipefail
          "$GHIDRA_DIR/support/analyzeHeadless" "$PWD/ghidra_project" APK2_Crypto -import "$PWD/APK2-Win64-Shipping.exe" -noanalysis -scriptPath "$PWD/ghidra_scripts" -postScript APK2CryptoDecompile.java -deleteProject > analysis-results/apk2-save-crypto-ghidra/ghidra.log 2>&1
      - name: Commit output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-results/apk2-save-crypto-ghidra
          git commit -m 'Decompile APK2 save crypto routines' || exit 0
          git pull --rebase origin main
          git push origin main
