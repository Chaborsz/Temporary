name: Clone Stage44 - event callsite and ASLR relocation audit
on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/clone_mode/audit_event_calls_stage44.py"
      - ".github/workflows/clone-stage44-audit.yml"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pefile==2024.8.26 capstone==5.0.6
      - run: python experiments/clone_mode/audit_event_calls_stage44.py
