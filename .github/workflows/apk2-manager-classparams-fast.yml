name: APK2 manager ClassParams fast
on:
  push:
    paths: ['.github/workflows/apk2-manager-classparams-fast.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Decode class tables only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 'https://github.com/Chaborsz/Temporary/releases/download/apk2-mediafire-transfer-2026-10-18/APK2-Win64-Shipping.exe' -o /tmp/a.exe
          python3 -m pip -q install pefile
          mkdir -p /tmp/out
          python3 - <<'PY' > /tmp/out/apk2-manager-classparams-fast.txt
          import pefile,struct
          from pathlib import Path
          b=Path('/tmp/a.exe').read_bytes();pe=pefile.PE('/tmp/a.exe',fast_load=True);base=pe.OPTIONAL_HEADER.ImageBase
          secs=[(s.VirtualAddress,s.SizeOfRawData,s.PointerToRawData,s.Name.rstrip(b'\0').decode('ascii','replace')) for s in pe.sections]
          def vo(v):
            r=v-base
            for sr,sz,raw,n in secs:
              if sr<=r<sr+sz:return raw+r-sr
          def q(v):return struct.unpack_from('<Q',b,vo(v))[0]
          def d(v):return struct.unpack_from('<I',b,vo(v))[0]
          def s(v):
            o=vo(v)
            if o is None:return '<unmapped>'
            z=b.find(b'\0',o,o+300);z=(o+300 if z<0 else z)
            return b[o:z].decode('utf-8','replace')
          cp=0x14a1dede0
          vals=[q(cp+i*8) for i in range(7)]
          names=['ClassNoRegister','Config','CppInfo','Deps','FuncInfo','Props','Interfaces']
          print('ClassParams',hex(cp))
          for n,v in zip(names,vals):print(n,hex(v),repr(s(v)) if n=='Config' and v else '')
          p=d(cp+0x38); fl=d(cp+0x3c)
          # print all plausible bitfield interpretations to avoid version assumption
          print('packed',hex(p),'classflags',hex(fl))
          print('decode_A deps',p&0xf,'funcs',(p>>4)&0x7ff,'props',(p>>15)&0x7ff,'ifaces',(p>>26)&0x3f)
          print('raw_qwords',*[hex(q(cp+i*8)) for i in range(10)])
          # infer counts by walking arrays conservatively until invalid/unmapped/string fails, max 128
          fi=vals[4]; pa=vals[5]; deps=vals[3]
          print('\nFUNCTION_TABLE_CANDIDATES')
          for i in range(128):
            try:
              fn=q(fi+i*16);np=q(fi+i*16+8);nm=s(np)
            except:break
            if not fn or not np or nm=='<unmapped>' or not nm or any(ord(c)<32 for c in nm):break
            print(i,hex(fn),hex(np),repr(nm))
          print('\nPROPERTY_TABLE_CANDIDATES')
          for i in range(128):
            try: desc=q(pa+i*8);np=q(desc);nm=s(np)
            except:break
            if not desc or not np or nm=='<unmapped>' or not nm or any(ord(c)<32 for c in nm):break
            pf=q(desc+0x10);to=q(desc+0x18);setf=q(desc+0x20);getf=q(desc+0x28);tail=q(desc+0x30)
            print(i,'desc',hex(desc),'name',repr(nm),'pflags',hex(pf),'typeobj',hex(to),'gen',hex(to&0xff),'setter',hex(setf),'getter',hex(getf),'tail',hex(tail),'arraydim',tail&0xffff,'offset',hex((tail>>16)&0xffff),'nmeta',(tail>>32)&0xffff)
          PY
          cat /tmp/out/apk2-manager-classparams-fast.txt
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin apk2-analysis-output
          git checkout -B apk2-analysis-output origin/apk2-analysis-output
          mkdir -p analysis
          cp /tmp/out/apk2-manager-classparams-fast.txt analysis/
          git add analysis/apk2-manager-classparams-fast.txt
          git commit -m 'Add fast manager ClassParams decode' || true
          git push origin HEAD:apk2-analysis-output
